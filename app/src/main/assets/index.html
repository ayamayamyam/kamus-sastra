<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f3217">
<title>Kamus Sastra Indonesia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f6ead0;--fg:#3b2a1c;--mut:#7a6247;--card:#e8d5aa;--card2:#fbf3df;--line:#a8773a;--acc:#8b4a1f;--fab:#7f532c;--fabfg:#f6ead0}
:root[data-theme="dark"]{--bg:#2a1c11;--fg:#f4e4ca;--mut:#cdb48f;--card:#4a3322;--card2:#3a2718;--line:#cfa871;--acc:#e0b06a;--fab:#8a5c30;--fabfg:#f6ead0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--s,1))}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ff,Georgia,"Times New Roman",serif);min-height:100%}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;height:calc(56px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;color:#fbf3df;background:linear-gradient(90deg,#4f3217,#7f532c 55%,#a8773a);border-bottom:2px solid #cfa871}
header h1{flex:1;margin:0;font-size:1.3125rem;font-weight:500}
header button{background:none;border:0;color:#fbf3df;padding:6px;display:flex}
svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{padding:20px 16px 110px;max-width:720px;margin:0 auto}
.hero{text-align:center}.hero img{width:78px;height:auto;margin-top:6px}
.hero h2{font-size:2.25rem;font-weight:400;margin:14px 0 10px}.hero p{color:var(--mut);line-height:1.5;margin:0 8px 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid rgba(207,168,113,.45)!important;border-radius:20px;padding:16px 15px;text-align:left;border:0;color:var(--fg);font:inherit;cursor:pointer}
.tile b{display:block;font-size:1.125rem;margin-bottom:8px;font-weight:500}.tile span{color:var(--mut);font-size:0.875rem}
.card{border:1px solid rgba(207,168,113,.45);background:var(--card2);border-radius:22px;padding:18px;margin:22px 0 16px}
.card small{display:block;color:var(--mut);font-size:0.75rem;margin-top:14px}
.card h3{margin:0 0 8px;font-size:1.0625rem;font-weight:500}.card h4{margin:0 0 4px;font-size:1.5625rem}
.outline{display:flex;justify-content:space-between;align-items:center;width:100%;border:1.5px solid var(--line);background:none;color:var(--fg);border-radius:16px;padding:20px 18px;font:inherit;font-size:1.125rem;cursor:pointer}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(128,128,128,.25);padding:13px 4px;color:var(--fg);font:inherit;cursor:pointer}
.item b{font-size:1.0625rem;display:block}.item span{color:var(--mut);font-size:0.875rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.letters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.letters .tile{text-align:center;padding:14px 6px}.letters b{font-size:1.375rem;margin:0}
.search{width:100%;padding:14px 16px;font-size:1.125rem;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);color:var(--fg);outline:0;margin-bottom:8px}
.def h2{font-size:1.875rem;margin:6px 0 4px}.def .pg{color:var(--mut);font-size:0.8125rem}
.def p{font-size:1.125rem;line-height:1.6}.ex{border-left:4px solid var(--acc);background:var(--card2);padding:10px 14px;border-radius:0 12px 12px 0;font-style:italic;line-height:1.55}
.act{display:flex;gap:10px;margin:16px 0}.act button{flex:1;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:none;color:var(--fg);font:inherit;cursor:pointer}
.empty{color:var(--mut);text-align:center;margin-top:40px}.sec{color:var(--mut);font-size:0.875rem;margin:18px 0 6px}
a.l{color:var(--acc);cursor:pointer;text-decoration:underline}
#fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:64px;height:56px;border-radius:18px;border:0;background:var(--fab);color:var(--fabfg);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px #0006;border:1px solid #cfa871;z-index:15}
#veil{position:fixed;inset:0;background:#0008;z-index:30;display:none}#drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--bg);z-index:31;transform:translateX(-105%);transition:.2s;padding:calc(24px + env(safe-area-inset-top,0px)) 0}
#drawer.o{transform:none}#drawer .dh{display:flex;align-items:center;gap:12px;padding:0 20px 18px;font-size:1.25rem}#drawer img{width:42px}
#drawer button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:inherit;font-size:1.0625rem;padding:15px 22px;cursor:pointer}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{padding:14px 8px;border-radius:14px;border:1.5px solid var(--line);background:none;color:var(--fg);font-size:1rem;cursor:pointer}.opt.on{background:var(--fab);color:var(--fabfg)}
#splash{position:fixed;inset:0;z-index:99;background:linear-gradient(160deg,#4f3217,#2a1c11);color:#f6ead0;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s;font-family:Georgia,"Times New Roman",serif}
#splash img{width:130px;height:auto;animation:pop .8s ease both}#splash h1{margin:22px 0 4px;font-size:30px;font-weight:400}#splash p{margin:0;color:#cfa871;font-size:14px}
.bar{width:170px;height:4px;background:#ffffff30;border-radius:4px;overflow:hidden;margin-top:22px}.bar i{display:block;height:100%;width:40%;background:#cfa871;border-radius:4px;animation:sl 1s infinite ease-in-out}
@keyframes sl{0%{margin-left:-40%}100%{margin-left:100%}}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
</style>
</head>

<script>
const D=[{"t":"Akulturasi Sastra","d":"Proses percampuran unsur-unsur sastra dari budaya berbeda yang menghasilkan bentuk atau gaya baru dalam karya sastra.","c":"Perpaduan unsur wayang Jawa dengan gaya narasi Barat dalam beberapa novel Indonesia modern.","p":4},{"t":"Alazon","d":"Tokoh yang berperan sebagai pembual atau pembohong.","c":"","p":4},{"t":"Alegori","d":"Cerita yang dipakai sebagai ibarat atau kias untuk memberikan pendidikan moral atau menerangkan sesuatu, biasanya terdapat dalam fabel, parabel, atau satire. Gaya bahasa yang mempergunakan perbandingan yang utuh.","c":"hidup kita dibandingkan dengan bahtera, kehidupan yang harus kita tempuh dibandingkan dengan samudra, kesukaran hidup dibandingkan dengan gelombang dan badai, cita-cita dibandingkan dengan pelabuhan.","p":4},{"t":"Alegori Politik","d":"Cerita yang unsur-unsur tokoh dan peristiwanya secara tersembunyi mewakili sindiran terhadap situasi atau tokoh politik tertentu.","c":"","p":4},{"t":"Alegorisasi","d":"Proses mengubah suatu gagasan atau ajaran menjadi bentuk cerita alegori.","c":"Kisah tentang binatang-binatang di sebuah peternakan yang mengubah kritik politik menjadi cerita fabel.","p":4},{"t":"Alih Huruf","d":"Penggantian huruf sebuah kata atau wacana dengan huruf padanannya dari abjad yang lain.","c":"","p":4},{"t":"Alinea","d":"Bagian karangan yang menjadi satu kesatuan gagasan, terdiri atas kalimat utama dan kalimat penjelas; disebut juga paragraf.","c":"","p":4},{"t":"Aliran Sastra","d":"Kelompok karya sastra yang memiliki kesamaan pandangan, gaya, atau prinsip penciptaan, misalnya realisme, romantisme, atau naturalisme.","c":"Realisme, Romantisme, dan Naturalisme merupakan beberapa aliran sastra yang berkembang di Eropa.","p":4},{"t":"Aliterasi","d":"Persamaan bunyi pada puisi yang berupa bunyi-bunyi awal pada tiap-tiap kata yang sebaris atau berlainan baris.","c":"bukan beta bijak berlaku bukan beta berbuat baru","p":5},{"t":"Alonim","d":"Nama samaran yang digunakan dalam dunia kepenulisan. Lihat juga: Nama Samaran (Pseudonim).","c":"","p":5},{"t":"Altruisme","d":"Sikap yang mengutamakan kepentingan orang lain selain kepentingan diri sendiri.","c":"","p":5},{"t":"Alur","d":"Rangkaian peristiwa dalam karya sastra yang tersusun secara sebab-akibat dan membentuk kesatuan cerita yang utuh.","c":"","p":5},{"t":"Alur = plot","d":"Jalinan peristiwa dalam karya sastra yang merupakan rangkaian sebab-akibat dan merupakan kesatuan yang padu, bulat dan utuh dalam menggerakkan jalannya cerita.Biasanya melalui tahap-tahap: Pemaparan atau pendahuluan. Penggawatan. Penanjakan. Puncak atau klimaks. Peleraian.","c":"","p":5},{"t":"Alur Balik","d":"Perubahan keadaan yang berlawanan dengan harapan.","c":"","p":5},{"t":"Alur Bawahan","d":"Alur pembantu, yaitu alur tambahan yang disisipkan di antara bagian-bagian alur utama untuk mendukung alur utama tersebut maupun untuk memberikan variasi.","c":"","p":5},{"t":"Alur Berbingkai","d":"Struktur alur yang menempatkan satu cerita di dalam cerita lain sebagai bingkai penghubung.","c":"","p":5},{"t":"Alur Cerita","d":"Rangkaian peristiwa yang disusun untuk menimbulkan efek tertentu.","c":"","p":5},{"t":"Alur Episodik","d":"Alur yang terdiri atas beberapa episode atau bagian yang relatif berdiri sendiri, meski terhubung oleh tokoh atau tema yang sama.","c":"","p":5},{"t":"Alur Erat","d":"Jalinan peristiwa yang sangat padu; jika satu bagian dihilangkan, cerita menjadi tidak utuh.","c":"","p":5},{"t":"Alur Gabungan","d":"Alur cerita yang merupakan perpaduan antara alur lurus dan alur sorot balik, yaitu sebagian cerita menggunakan alur lurus dan sebagian lainnya menggunakan alur sorot balik. Lihat: Alur Lurus, Alur Sorot Balik","c":"","p":6},{"t":"Alur Kronologis","d":"Alur yang menyusun peristiwa berdasarkan urutan waktu dari yang paling awal hingga paling akhir.","c":"","p":6},{"t":"Alur Longgar","d":"Jalinan peristiwa yang kurang padu.","c":"","p":6},{"t":"Alur Lurus","d":"Alur cerita yang disusun berurutan dari kejadian awal sampai dengan kejadian-kejadian berikutnya dan berakhir pada pemecahan masalah, disebut juga alur maju.","c":"","p":6},{"t":"Alur Maju","d":"Alur yang bergerak secara berurutan dari peristiwa awal menuju peristiwa akhir; sama dengan alur lurus atau alur progresif.","c":"","p":6},{"t":"Alur Menanjak","d":"Alur yang terus meningkat menuju klimaks tanpa peleraian hingga cerita berakhir.","c":"","p":6},{"t":"Alur Mundur","d":"Alur cerita yang disusun mulai dari bagian akhir bergerak menuju kebagian awal cerita, disebut juga alur sorot balik atau flash back.","c":"","p":6},{"t":"Alur Nonlinier","d":"Alur yang tidak mengikuti urutan waktu lurus, melainkan melompat-lompat antara masa lalu, masa kini, dan masa depan. Novel Slaughterhouse- Five karya Kurt Vonnegut menggunakan alur nonlinier.","c":"","p":6},{"t":"Alur Progresif","d":"Alur yang bergerak maju secara terus-menerus dari awal ke akhir; sinonim dari alur lurus atau alur maju.","c":"","p":6},{"t":"Alur Rapat","d":"Alur cerita yang hanya terpusat pada suatu tokoh; pada alur rapat terdapat alur pembantu yang mendukung alur utama. Alur pembantu","c":"","p":6},{"t":"Alur Renggang","d":"Alur cerita yang tidak hanya terpusat pada tokoh utama, tetapi juga pada tokoh-tokoh lain. Pada alur renggang terdapat alur pembantu yang tidak mendukung alur utama.","c":"","p":6},{"t":"Alur Retroaktif","d":"Teknik penceritaan yang menghadirkan peristiwa masa lalu untuk menjelaskan situasi masa kini; mirip dengan flashback.","c":"","p":7},{"t":"Alur Simultan","d":"Alur yang menyajikan beberapa peristiwa berbeda secara bersamaan dalam satu karya.","c":"","p":7},{"t":"Alur Sorot Balik","d":"Teknik penceritaan yang kembali ke masa lalu untuk menjelaskan peristiwa masa kini; disebut juga flashback atau alur mundur.","c":"","p":7},{"t":"Alur Tunggal","d":"Alur yang hanya mengikuti satu rangkaian peristiwa utama tanpa percabangan cerita sampingan.","c":"","p":7},{"t":"Alur Utama","d":"Alur cerita yang terpusat pada tokoh utama.","c":"","p":7},{"t":"Alusi (o)","d":"Gaya bahasa perbandingan yang mempergunakan peribahasa atau ungkapan yang sudah lazim atau juga mempergunakan sampiran pantun yang isinya sudah dipahami oleh masyarakat pada umumnya.","c":"-keadaanku seperti makan buah si malakama, dimakan ibu mati, tak dimakan Ayah mati. Contoh: -kamu itu sudah gaharu cendana pula. (maksudnya: sudah tahu bertanya pula)","p":7},{"t":"Alusio","d":"Majas yang menggunakan ungkapan atau peribahasa yang sudah dikenal umum tanpa menyebutkannya secara lengkap, mengandalkan asosiasi pembaca.","c":"\"Jangan sampai jadi kuda troya di perusahaan ini.\"","p":7},{"t":"Amanat","d":"Pesan pengarang yang berupa suatu gagasan tertentu yang hendak disampaikan kepada pembaca, penonton, atau pendengar. Misalnya: amanat dalam \"Salah Asuhan\" karya Abdul Muis ialah bahwa yang penting dalam perkawinan bukanlah soal pilihan sendiri atau dipilihkan orang lain, bukan pula ada tidaknya cinta sebelum perkawinan, melainkan yang diperlukan adalah adanya saling mencintai setelah perkawinan dan saling pengertian. (a) Gaya bahasa penegasan yang berupa pengulangan kata-kata pada awal kalimat atau baris puisi. Junjunganku. Apatah kekal Apatah tetap Apatah tak bersalin rupa Apatah boga sepanjang masa","c":"","p":7},{"t":"Ambiguitas","d":"Sifat atau keadaan yang bermakna ganda atau tidak jelas; ketaksaan dalam teks sastra yang memungkinkan penafsiran lebih dari satu makna.","c":"","p":8},{"t":"Ambiguitas Puitik","d":"Ketaktentuan makna yang disengaja dalam puisi sehingga memungkinkan lebih dari satu tafsir yang sah atas larik yang sama.","c":"","p":8},{"t":"Ambivalensi","d":"Keadaan memiliki dua perasaan atau sikap yang bertentangan terhadap sesuatu secara bersamaan; dalam sastra sering menggambarkan konflik batin tokoh.","c":"","p":8},{"t":"Amplifikasi","d":"Gaya bahasa yang memperluas atau menegaskan suatu pernyataan dengan menambahkan keterangan atau perincian agar maknanya lebih jelas dan kuat.","c":"'Dia bukan hanya sedih, tetapi hancur, remuk, dan kehilangan seluruh harapan hidupnya.'","p":8},{"t":"Anabasis","d":"Bagian alur yang menunjukkan peningkatan peristiwa menuju klimaks.","c":"","p":8},{"t":"Anadiplosis","d":"Majas repetisi berupa pengulangan kata terakhir dari baris/kalimat sebelumnya di awal baris/kalimat berikutnya.","c":"\"Ia mencintai bukunya. Bukunya adalah dunia baginya.\"","p":8},{"t":"Anafora","d":"Pengulangan kata atau frasa pada awal baris atau kalimat yang berurutan untuk memberikan penekanan. 'Aku ingin hidup seribu tahun lagi / Aku ingin mencium bau tanah / Aku ingin mendengar suara hujan.'","c":"","p":8},{"t":"Anagoge","d":"Penafsiran karya sastra berdasarkan makna spiritual, mistik, alegoris, moral, atau harfiah.","c":"","p":8},{"t":"Anagram","d":"Permainan kata yang dibentuk dengan menyusun ulang huruf-huruf suatu kata atau frasa untuk membentuk kata atau frasa baru.","c":"Kata 'ronda' dapat disusun ulang menjadi 'dora' sebagai permainan kata.","p":8},{"t":"Anakoluton","d":"Penyimpangan struktur kalimat yang disengaja, biasanya untuk menimbulkan efek dramatis atau menggambarkan keadaan emosi tokoh yang kacau.","c":"'Aku... aku tidak tahu... kenapa semua ini... kenapa harus terjadi begini.'","p":9},{"t":"Anakronisme","d":"Ketidaksesuaian yang terdapat di dalam karya sastra antara tokoh, peristiwa, dialog atau latar dengan waktu/masa/sejarah. Misalnya: dalam \"Julius Caesar\" karangan Shakespeare dituliskan \"jam berbunyi 3 kali\" padahal saat itu jam belum ada.","c":"","p":9},{"t":"Anakronisme Naratif","d":"Ketidaksesuaian urutan waktu peristiwa yang disengaja dalam narasi, berbeda dari kesalahan sejarah yang tidak disengaja.","c":"","p":9},{"t":"Analepsis","d":"Teknik naratif yang menyisipkan kembali peristiwa masa lalu ke dalam alur cerita yang sedang berjalan; sepadan dengan alur sorot balik atau kilas balik.","c":"","p":9},{"t":"Analisis Isi Sastra","d":"Metode penelitian yang mengkaji muatan pesan, tema, atau nilai yang terkandung dalam sejumlah karya sastra secara sistematis.","c":"","p":9},{"t":"Analisis Naratif","d":"Metode penelaahan karya sastra yang berfokus pada struktur dan teknik penceritaan, termasuk alur, sudut pandang, dan narator.","c":"","p":9},{"t":"Analisis Semiotik","d":"Pendekatan kajian sastra yang menelaah tanda-tanda dan makna yang terkandung di dalamnya berdasarkan teori semiotika.","c":"","p":9},{"t":"Analisis Struktural","d":"Penelaahan karya sastra berdasarkan unsur-unsur pembangunnya secara internal, seperti alur, tokoh, latar, dan tema.","c":"","p":9},{"t":"Analisis Tema","d":"Penelaahan terhadap gagasan pokok yang menjadi inti sebuah karya sastra.","c":"","p":9},{"t":"Analisis Tokoh","d":"Penelaahan terhadap karakter, peran, motivasi, dan perkembangan tokoh dalam karya sastra.","c":"","p":9},{"t":"Analisis Wacana","d":"Pendekatan penelaahan teks sastra yang mempertimbangkan konteks sosial, budaya, dan ideologi di balik penggunaan bahasa.","c":"","p":10},{"t":"Analogi","d":"Perbandingan antara dua hal yang berbeda namun memiliki kemiripan sifat untuk menjelaskan suatu gagasan dalam karya sastra.","c":"Perkembangan zaman diibaratkan seperti roda yang terus berputar, mewakili pergantian generasi dalam sastra.","p":10},{"t":"Anapes","d":"Pola sajak yang terdiri atas tiga suku kata: dua tak bertekanan diikuti satu bertekanan.","c":"","p":10},{"t":"Anastrof","d":"Pengulangan kata pada akhir larik yang digunakan kembali di awal larik berikutnya.","c":"","p":10},{"t":"Anatomi Cerita","d":"Kajian mengenai bagian-bagian pembangun cerita secara menyeluruh, meliputi alur, tokoh, latar, tema, dan sudut pandang.","c":"","p":10},{"t":"Ancang Ekstrinsik","d":"Pendekatan kajian sastra dengan menggunakan ilmu bantu seperti sejarah, sosiologi, dan psikologi.","c":"","p":10},{"t":"Ancang Intrinsik","d":"Pendekatan yang menitikberatkan pada unsur-unsur dalam karya sastra itu sendiri.","c":"","p":10},{"t":"Ane","d":"Cerita singkat tentang sifat dan gagasan seorang tokoh yang lucu dan aneh.","c":"","p":10},{"t":"Anekdot","d":"Jenis teks naratif singkat yang bersifat lucu atau menggelitik namun mengandung sindiran atau kritik terhadap suatu keadaan.","c":"Anekdot tentang perilaku pejabat yang korup.","p":10},{"t":"Anekdotal","d":"Bersifat seperti anekdot; berkaitan dengan penceritaan singkat yang bersifat lucu atau menggelitik.","c":"Kisah singkat tentang kejadian lucu di pasar yang diceritakan turun-temurun.","p":10},{"t":"Angkatan","d":"Kelompok sastrawan yang memiliki kesamaan prinsip yang mendasari karya-karya.","c":"Angkatan Pujangga Baru, Angkatan 45, dan Angkatan 66.","p":11},{"t":"Angkatan 20","d":"Nama lain dari Angkatan Balai Pustaka dan Angkatan Siti Nurbaya. Disebut demikian karena: Para pengarangnya muncul sekitar tahun 20-an. Roman Indonesia pertama Azab dan Sengsara karangan Merari Siregar terbit tahun 1920.","c":"","p":11},{"t":"Angkatan 2000 / Reformasi","d":"Periodisasi sastra Indonesia pascareformasi 1998 yang ditandai kebebasan berekspresi lebih luas, tema sosial-politik yang lebih terbuka, serta munculnya banyak penulis perempuan.","c":"Karya-karya Ayu Utami dan Dewi Lestari.","p":11},{"t":"Angkatan 33","d":"Nama lain dari Angkatan Pujangga Baru. Disebut demikian: majalah Pujangga Baru (tempat mereka mengumumkan hasil karya) terbit atau lahir 1933.","c":"","p":11},{"t":"Angkatan 45","d":"Kelompok sastrawan yang berasal dari organisasi Sastrawan Gelanggang (didirikan 19-11-1947). Nama Angkatan 45 diperoleh tahun 1949 oleh Rosihan Anwar dengan uraiannya dalam \"Majalah Siasat\" 9-1-1949. Pendirian/pendapat Angkatan 45 dimuat dalam \"Surat Kepercayaan Gelanggang\" yang dibuat tanggal 18-2-1950. Isinya antara lain: pengakuan angkatan 45 sebagai ahli waris kebudayaan dunia (lihat: Surat Kepercayaan Gelanggang). Angkatan 45 memiliki gaya ekpresif-universal dan corak karyanya romantis-realistis. Pelopor Angkatan 45: Chairil Anwar (dalam bidang puisi) dan Idrus (dalam bidang prosa).","c":"","p":11},{"t":"Angkatan 50","d":"Nama yang diberikan oleh W.S. Rendra, dkk. Untuk sastrawan Angkatan 45 yang aktifbaru tahun 50-an.","c":"","p":11},{"t":"Angkatan 66","d":"Kelompok sastrawan yang muncul setelah Angkatan 45. Nama ini diproklamasikan oleh H.B. Jassin dalam sebuah artikel yang berjudul \"Angkatan 66 Bangkitnya Satu Generasi\". Ciri-ciri Angkatan 66: Mempunyai konsepsi Pancasila. Membawa kesadaran nurani manusia yang bertahun-tahun mengalami Hasil-hasil kesusastraanAngkatan 66, ialah protes sosial kemudian Pengarang-pengarang Angkatan 66, ialah mereka yang pada tahun 1945 kezaliman perkosaan terhadap kebenaran dan rasa keadilan, kesadaran moral dan agama. protes politik. berumur kira-kira 6 tahun atau pada tahun 1966 kira-kira berumur 25 tahun.","c":"","p":12},{"t":"Angkatan 70","d":"Periodisasi sastra Indonesia tahun 1970-an yang ditandai eksperimen bentuk, seperti puisi mbeling dan prosa liris.","c":"Karya Danarto dan Putu Wijaya.","p":12},{"t":"Angkatan 80","d":"Periodisasi sastra Indonesia tahun 1980-an yang ditandai berkembangnya sastra populer berdampingan dengan sastra serius.","c":"Novel-novel Ahmad Tohari.","p":12},{"t":"Angkatan Balai Pustaka","d":"Kelompok sastrawan Indonesia yang berkarya pada masa Balai Pustaka aktif sekitar tahun 1920-an. Marah Rusli, Nur Sutan Iskandar, dan Abdul Muis termasuk sastrawan Angkatan Balai Pustaka.","c":"","p":12},{"t":"Angkatan Kerja","d":"Kelompok sastrawan yang muncul sesudah Angkatan 45. Nama ini diberikan oleh Ajip Rosidi, disebutkan demikian karena muncul tanpa banyak bicara terus menulis (bekerja). Angkatan kerja terutama menghasilkan puisi dan cerpen. Disebut juga Angkatan Terbaru oleh Ajip Rosidi.","c":"","p":12},{"t":"Angkatan Pujangga Baru","d":"Angkatan/kelompok sastrawan yang muncul sebagai perwujudan menggeloranya semangat persatuan. Nama pujangga Baru berasal dari nama majalah tempat para sastrawan mengumumkan hasil karyanya yaitu majalah Pujangga Baru (terbit 26 Juni 1933). Disebut juga Angkatan 33/Angkatan 30- an. Angkatan Pujangga Baru menggunakan gaya impresif, dengan corak karyanya romantis-idealistis. Pelopor Pujangga Baru: Sutan Takdir Alisyahbana, Sanusi Pane, Armijn Pane, Amir Hamzah. Raja Penyair Pujangga Baru: Amir Hamzah (karena puisinya yang indah-indah dengan gaya bahasanya yang halus dan merdu).","c":"","p":12},{"t":"Angkatan Siti Nurbaya","d":"Nama lain dari Angkatan Balai Pustaka dan Angkatan 20. Disebut demikian karena roman yang paling popular pada masa Angkatan tersebut berjudul \"Siti Nurbaya\" karangan Marah Rusli.","c":"","p":13},{"t":"Angkatan Terbaru","d":"Nama lain dari Angkatan Kerja. Nama ini diberikan oleh Ajip Rosidi dalam sebuah prasarannya yang berjudul \"Sumbangan Angkatan Terbaru Sastrawan Indonesia kepada Perkembangan Kesastraan Indonesia\". Ciri-ciri Angkatan Terbaru: Tumbuh secara wajar dan berakar di bumi tanah air (hasil pengajaran Menmberi nilai baru terhadap arti daerah sebagai sumber ilham dan Berorientasi kepada pengarang-pengarang Indonesia sendiri. kesastraan Indonesia sendiri). tempat berpijak secara kultural.","c":"","p":13},{"t":"Anonim","d":"Karya sastra yang tidak dikenal nama pengarangnya karena tidak disebutkan (salah satu sifat karya sastra lama yang menggambarkan corak masyarakat lama, yaitu senantiasa beranggapan bahwa segala sesuatu sebagai milik bersama).","c":"","p":13},{"t":"Antagonis","d":"Tokoh cerita penentang tokoh utama; lawan protagonis. Lihat: Protagonis.","c":"","p":13},{"t":"Antanaklasis","d":"Majas yang mengulang kata yang sama dalam satu kalimat namun dengan makna yang berbeda.","c":"\"Kambing itu bukan kambing hitam dalam masalah ini.\"","p":13},{"t":"Antifrasis","d":"Majas yang menggunakan kata atau ungkapan yang maknanya berlawanan dengan kenyataan, biasanya untuk menyindir atau berolok-olok. Menyebut seseorang yang sangat pelit sebagai 'si dermawan' merupakan contoh antifrasis.","c":"","p":13},{"t":"Antihero","d":"Tokoh utama cerita yang tidak memiliki sifat-sifat kepahlawanan konvensional, namun tetap menjadi pusat perhatian pembaca.","c":"Tokoh preman yang menjadi pusat cerita dalam sebuah novel realis.","p":13},{"t":"Antik","d":"Sesuatu yang kuno, langka, dan bernilai tinggi karena usianya; dalam sastra merujuk pada karya atau gaya yang berasal dari masa lampau.","c":"","p":13},{"t":"Antiklimaks","d":"Gaya bahasa yang menyatakan beberapa hal berturut-turut makin lama makin melemah, dan menurun.","c":"Apalagi setahun, sebulan, sedetik pun sepasang remaja itu enggan berpisah, Di kota-kota, di desa-desa, bahkan di kampung-kampung pembangunan dilaksanakan dengan sungguh-sungguh.","p":14},{"t":"Antitesis","d":"Gaya bahasa yang mempergunakan pasangan kata-kata yang berlawanan maknanya.","c":"-besar-kecil, tua-muda, laki-laki-perempuan ikut ambil bagian dalam kerja bakti itu. Contoh: - suka-duka, bahagia-sengsara dihadapinya dengan tabah.","p":14},{"t":"Antologi","d":"Bunga rampai=kumpulan karangan seorang atau beberapa orang yang biasanya memiliki kesamaan ragam atau tema.","c":"","p":14},{"t":"Antonim","d":"Kata yang maknanya berlawanan dengan kata lain.","c":"\"besar\" >< \"kecil\".","p":14},{"t":"Antonomasia","d":"Majas yang menggantikan nama diri dengan gelar, jabatan, atau sifat khas yang melekat pada orang tersebut. Menyebut Napoleon sebagai 'Si Pendek yang Agung' merupakan antonomasia.","c":"","p":14},{"t":"Antropomorfisme","d":"Pemberian sifat atau perilaku manusia kepada benda mati, hewan, atau konsep abstrak.","c":"","p":14},{"t":"Antroposentrisme","d":"Pandangan yang menempatkan manusia sebagai pusat perhatian dalam karya sastra, sering muncul pada aliran humanisme.","c":"Novel-novel humanis yang menjadikan pengalaman batin manusia sebagai pusat cerita.","p":14},{"t":"Apheresis","d":"Penghilangan satu atau beberapa fonem pada awal kata. Kata 'lah' yang berasal dari 'telah' merupakan contoh apheresis.","c":"","p":14},{"t":"Apologia","d":"Karya atau ujaran yang berisi pembelaan diri pengarang atau tokoh terhadap suatu tuduhan atau pandangan.","c":"Pidato pembelaan seorang tokoh yang dituduh berkhianat oleh masyarakatnya dalam sebuah novel sejarah.","p":15},{"t":"Apostrof","d":"Majas yang mengalihkan pembicaraan kepada sesuatu atau seseorang yang tidak hadir, atau benda mati seolah dapat mendengar.","c":"\"Wahai bulan, dengarkanlah keluh kesahku.\"","p":15},{"t":"Apresiasi Sastra","d":"Pengertian dan penghargaan terhadap karya sastra yang tumbuh setelah melalui kegiatan memahami karya sastra tersebut dengan sungguh-sungguh.","c":"","p":15},{"t":"Apresiator Sastra","d":"Sebutan bagi seseorang yang menikmati, menilai, dan menghargai karya sastra tanpa harus berprofesi sebagai kritikus formal.","c":"","p":15},{"t":"Argumentasi","d":"Jenis paragraf/karangan yang mengemukakan pendapat disertai alasan dan bukti untuk meyakinkan pembaca.","c":"Esai yang mendukung pendapat dengan data dan fakta.","p":15},{"t":"Arkaisme","d":"Penggunaan kata atau ungkapan lama yang sudah jarang dipakai dalam bahasa sehari-hari, sering dimanfaatkan untuk memberi kesan klasik pada karya.","c":"","p":15},{"t":"Arketipe","d":"Pola dasar tokoh, tema, atau simbol yang berulang dalam berbagai karya sastra lintas budaya dan zaman.","c":"Tokoh pahlawan yang menempuh perjalanan (hero's journey).","p":15},{"t":"Arketipe Kepahlawanan","d":"Pola dasar tokoh pahlawan yang berulang lintas budaya dan zaman, mengalami panggilan petualangan, ujian, dan kepulangan sebagai sosok baru.","c":"","p":15},{"t":"Artikulasi Puitik","d":"Cara penyair mengungkapkan gagasan dan perasaan melalui pemilihan kata dan struktur bahasa yang khas.","c":"Cara Chairil Anwar memilih kata-kata singkat namun padat dalam sajak-sajaknya.","p":15},{"t":"Arus Kesadaran","d":"Teknik naratif yang menampilkan langsung jalan pikiran dan asosiasi bebas tokoh tanpa menyusunnya secara logis atau berurutan.","c":"","p":16},{"t":"Aside","d":"Ucapan singkat tokoh yang ditujukan langsung kepada penonton dan dianggap tidak terdengar oleh tokoh lain di panggung.","c":"","p":16},{"t":"Asindenton","d":"Gaya bahasa yang menyebutkan beberapa hal, kaedaan, atau benda berturut-turut tanpa menggunakan kata penghubung.","c":"-radio, televisi, pengeras suara dijual di toko itu. Contoh: -dia memang biasa membaca buku, majalah, surat kabar pada sore hari.","p":16},{"t":"Asindeton","d":"Gaya bahasa yang menghilangkan kata penghubung antara unsur-unsur kalimat untuk menciptakan efek kecepatan atau intensitas. 'Datang, lihat, taklukkan.'","c":"","p":16},{"t":"Asonansi","d":"Persamaan bunyi vokal dalam satu atau beberapa kata yang berdekatan untuk menciptakan efek musikalitas. 'Malam kelam, angin datang' --- bunyi vokal 'a' yang berulang merupakan asonansi.","c":"","p":16},{"t":"Asonansi Berirama","d":"Perulangan bunyi vokal yang teratur sehingga menciptakan irama yang harmonis dalam puisi atau prosa liris.","c":"","p":16},{"t":"Asosiasi Bunyi","d":"Hubungan antara bunyi kata dengan kesan atau makna tertentu yang ditimbulkannya dalam puisi.","c":"Bunyi 'r' yang berulang menimbulkan kesan gemuruh atau kemarahan dalam larik puisi.","p":16},{"t":"Asosiasi Makna","d":"Hubungan makna yang timbul antara satu kata dengan kata atau konsep lain berdasarkan pengalaman atau konvensi budaya.","c":"","p":16},{"t":"Aspek Dramatik","d":"Unsur-unsur yang bersifat teatrikal dalam karya sastra, seperti konflik, tegangan, dan peristiwa yang menimbulkan efek dramatis.","c":"","p":16},{"t":"Aspek Ekstrinsik","d":"Unsur-unsur di luar teks karya sastra yang turut mempengaruhi penciptaan dan pemaknaan karya, seperti biografi pengarang dan kondisi sosial.","c":"","p":17},{"t":"Aspek Intrinsik","d":"Unsur-unsur yang membangun karya sastra dari dalam, seperti alur, tokoh, latar, tema, dan gaya bahasa.","c":"","p":17},{"t":"Aspek Lirik","d":"Unsur-unsur yang berhubungan dengan ekspresi perasaan, suasana batin, dan keindahan bunyi dalam sebuah karya sastra.","c":"","p":17},{"t":"Aspek Naratif","d":"Unsur-unsur yang berkaitan dengan cara bercerita, termasuk narator, sudut pandang, dan struktur penceritaan.","c":"","p":17},{"t":"Aspek Struktural","d":"Keseluruhan unsur pembangun yang membentuk keutuhan dan koherensi sebuah karya sastra.","c":"","p":17},{"t":"Aubade","d":"Puisi atau lagu yang mengungkapkan perpisahan sepasang kekasih pada waktu fajar.","c":"Puisi yang menggambarkan perpisahan sepasang kekasih saat fajar menyingsing.","p":17},{"t":"Autobiografi","d":"Riwayat hidup sendiri,karya sastra yang menceritakan riwayat hidup sendiri.","c":"-\"Hikayat Abdulloh\" oleh Abdulloh. -\"Pengalaman Masa Kecil\" oleh St. Iskandar.","p":17},{"t":"Babad","d":"Karya sastra sejarah tradisional (umumnya Jawa) yang mengisahkan silsilah atau riwayat kerajaan bercampur unsur mitos.","c":"Babad Tanah Jawi.","p":18},{"t":"Babak","d":"Bagian utama dari sebuah drama yang menandai perpindahan peristiwa besar atau perubahan latar. Drama Hamlet karya Shakespeare terdiri atas lima babak.","c":"","p":18},{"t":"Bacaan Sastra","d":"Teks atau karya sastra yang dijadikan bahan bacaan, baik untuk hiburan maupun kepentingan pendidikan.","c":"","p":18},{"t":"Bahasa Artistik","d":"Penggunaan bahasa yang bersifat estetis, kaya ekspresi, dan memiliki nilai keindahan tinggi dalam karya sastra.","c":"","p":18},{"t":"Bahasa Daerah dalam Sastra","d":"Penggunaan unsur bahasa daerah untuk memperkaya nuansa lokal dalam karya sastra.","c":"Penggunaan dialek Betawi dalam novel-novel bertema kehidupan Jakarta tempo dulu.","p":18},{"t":"Bahasa Denotatif","d":"Bahasa yang digunakan sesuai makna sebenarnya tanpa tambahan kesan atau nilai rasa.","c":"'Meja itu terbuat dari kayu jati' menyatakan makna sebenarnya tanpa kiasan.","p":18},{"t":"Bahasa Ekspresif","d":"Ragam bahasa yang digunakan untuk mengungkapkan perasaan, emosi, dan sikap pengarang secara langsung.","c":"","p":18},{"t":"Bahasa Formal","d":"Ragam bahasa baku yang digunakan dalam karya sastra tertentu, terutama esai dan tulisan ilmiah sastra.","c":"Gaya bahasa baku yang digunakan dalam esai kritik sastra ilmiah.","p":18},{"t":"Bahasa Kiasan","d":"Bahasa yang menggunakan ungkapan tidak harfiah untuk menyampaikan makna secara lebih hidup dan imajinatif; mencakup metafora, simile, personifikasi, dan sebagainya.","c":"","p":19},{"t":"Bahasa Konotatif","d":"Bahasa yang mengandung makna tambahan di luar makna dasarnya, digunakan untuk menimbulkan kesan tertentu.","c":"'Bunga desa' bermakna gadis tercantik di suatu desa, bukan bunga sungguhan.","p":19},{"t":"Bahasa Puitis","d":"Bahasa yang digunakan dalam puisi, cenderung padat, bermakna konotatif, dan memperhatikan bunyi serta irama.","c":"'Angin malam berbisik lirih di antara dedaunan yang gugur.'","p":19},{"t":"Bahasa Sastra","d":"Ragam bahasa khas yang digunakan dalam karya sastra, ditandai oleh pemilihan kata dan gaya yang estetis.","c":"Pemilihan kata yang estetis dan penuh makna dalam sebuah puisi atau novel.","p":19},{"t":"Bahasa Simbolis","d":"Penggunaan simbol-simbol dalam bahasa untuk mewakili konsep, perasaan, atau gagasan yang lebih dalam.","c":"","p":19},{"t":"Bait","d":"Bagian puisi yang biasanya terdiri dari beberapa baris (larik) penulisannya agak menjorok ke kanan atau ditulis agak renggang (bandingkan dengan alinea/paragraf pada prosa).","c":"","p":19},{"t":"Bait Bebas","d":"Kesatuan larik dalam puisi yang jumlah dan susunannya tidak mengikuti aturan baku, berbeda dengan bait pada puisi lama.","c":"","p":19},{"t":"Balada","d":"Puisi naratif yang menceritakan kisah heroik atau romantis, sering disertai pengulangan dan dialog. 'Balada Terbunuhnya Atmo Karpo' karya W.S. Rendra adalah contoh balada modern Indonesia.","c":"","p":19},{"t":"Balai Pustaka","d":"Nama badan yang berdiri pada tahun 1917 sebagai penjelmaan dari Komisi Bacaan Rakyat atau Commissie Voor de Volkslectuur (didirikan oleh pemerintah Belanda tahun 1908). Lihat: Komisi Bacaan Rakyat","c":"","p":19},{"t":"Bebasan","d":"Ungkapan tetap dalam bahasa Indonesia yang bermakna kiasan tanpa menyebut perbandingan secara eksplisit.","c":"Ringan tangan berarti suka membantu atau suka memukul, tergantung konteks.","p":20},{"t":"Bedah Buku","d":"Kegiatan diskusi publik yang membahas isi, kekuatan, dan kelemahan sebuah karya sastra yang baru terbit.","c":"","p":20},{"t":"Bentuk Bebas","d":"Bentuk puisi yang tidak terikat oleh aturan rima, irama, atau jumlah baris; disebut juga puisi bebas.","c":"","p":20},{"t":"Bentuk Naratif","d":"Cara pengungkapan karya sastra yang berbentuk cerita dengan unsur alur, tokoh, dan latar.","c":"","p":20},{"t":"Bentuk Puitis","d":"Cara pengungkapan yang mengutamakan keindahan bunyi, irama, dan citraan dalam bahasa.","c":"","p":20},{"t":"Bentuk Sastra","d":"Wujud atau ragam karya sastra berdasarkan struktur dan konvensinya, seperti puisi, prosa, dan drama.","c":"","p":20},{"t":"Bentuk Terikat","d":"Bentuk puisi yang mengikuti aturan baku, seperti jumlah baris, rima, dan irama. Soneta merupakan bentuk terikat yang terdiri atas empat belas baris.","c":"","p":20},{"t":"Berkas Cerita","d":"Kumpulan bahan atau catatan pengarang yang menjadi dasar penyusunan sebuah karya naratif.","c":"Catatan wawancara dan observasi yang dikumpulkan pengarang sebelum menulis novel berdasarkan kisah nyata.","p":20},{"t":"Bidal","d":"Bentuk yang dianggap sebagai permulaan puisi lama, meliputi: pepatah, ungkapan, perumpamaan, tamsil, ibarat, dan pemeo.","c":"-tong kosong berbunyi nyaring (bidal, pepatah). Contoh: -bagai kerakap tumbuh di batu, hidup segan mati tak mau. (bidal, tamsil/ibarat).","p":20},{"t":"Bildungsroman","d":"Genre novel yang mengisahkan perkembangan moral dan psikologis tokoh utama dari masa muda hingga mencapai kedewasaan.","c":"","p":20},{"t":"Biografi","d":"Karangan yang berisikan riwayat hidup seseorang.","c":"-\"Ayahku\" oleh Hamka. - \"Dokter Soetomo\" oleh Imam Supardi.","p":21},{"t":"Blank Verse","d":"Puisi yang ditulis dengan irama tertentu namun tanpa rima akhir yang tetap.","c":"Puisi karya William Shakespeare yang ditulis dalam bentuk iambic pentameter tanpa rima akhir.","p":21},{"t":"Blocking Panggung","d":"Pengaturan posisi dan pergerakan aktor di atas panggung selama pertunjukan berlangsung.","c":"","p":21},{"t":"Blurb","d":"Ringkasan singkat dan menarik tentang isi buku yang dicetak pada sampul belakang untuk menarik minat pembaca.","c":"","p":21},{"t":"Bombas","d":"Gaya bahasa yang menggunakan kata-kata muluk dan berlebihan tanpa isi yang bermakna.","c":"","p":21},{"t":"Bombasatis","d":"Karangan yang menggunakan bahasa atau kata-kata yang muluk-muluk.","c":"","p":21},{"t":"Bombastis","d":"Bersifat bombas; menggunakan bahasa yang berlebih-lebihan dan tidak substansial. Contoh (kutipan puisi \"Bujang\"): O, ayahku, terangi beta dengan pelita Supaya sempurna, sejahtera badanku, Menempuh hidup, menurutkan kalbu, . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . Dari: Puisi Baru, halaman 83.","c":"","p":21},{"t":"Buku Elektronik","d":"Versi digital dari sebuah karya cetak yang dapat dibaca melalui perangkat elektronik seperti telepon pintar atau tablet.","c":"","p":21},{"t":"Buku Harian Sastra","d":"Bentuk tulisan naratif yang berisi catatan pribadi pengarang, kadang dijadikan bahan atau bentuk karya sastra.","c":"Catatan harian yang kemudian diterbitkan sebagai memoar sastra oleh pengarangnya.","p":21},{"t":"Bunga Rampai","d":"Kumpulan karya sastra atau tulisan dari berbagai pengarang yang disatukan dalam satu buku; sinonim dengan antologi.","c":"","p":21},{"t":"Cakrawala Harapan","d":"Konsep dalam teori resepsi sastra yang merujuk pada ekspektasi atau harapan pembaca terhadap sebuah teks berdasarkan pengalaman sastra sebelumnya.","c":"","p":22},{"t":"Catatan Harian","d":"Bentuk tulisan pribadi berisi catatan peristiwa sehari-hari yang kadang dijadikan bentuk atau sumber karya sastra.","c":"Buku harian pribadi yang kemudian diterbitkan dan menjadi karya sastra terkenal.","p":22},{"t":"Cergam","d":"Karya sastra berupa cerita yang disampaikan melalui rangkaian gambar disertai teks singkat.","c":"Komik strip di majalah anak.","p":22},{"t":"Cerita","d":"Tuturan atau karangan yang menjelaskan atau memaparkan bagaimana terjadinya suatu hal, peristiwa, kejadian, dan sebagainya.","c":"","p":22},{"t":"Cerita Alegoris","d":"Cerita yang mengandung makna kiasan di balik peristiwa dan tokoh-tokohnya untuk menyampaikan pesan moral atau ideologi. Animal Farm karya George Orwell merupakan cerita alegoris yang mengkritik rezim totaliter.","c":"","p":22},{"t":"Cerita Anak","d":"Karya sastra dengan tema, tokoh, dan bahasa yang disesuaikan untuk dunia dan pemahaman anak-anak.","c":"Cerita \"Si Kancil\".","p":22},{"t":"Cerita Berbingkai","d":"Cerita yang di dalamnya terdapat cerita, cerita berbingkai terjadi karena di dalamnya terdapat cerita sisipan yang biasanya dituturkan oleh seorang tokoh cerita.","c":"- hikayat Bayan Budiman. Contoh: -hikayat 1001 Malam.","p":22},{"t":"Cerita Berbingkai Ganda","d":"Struktur cerita yang memuat lebih dari satu lapis bingkai narasi, dengan cerita di dalam cerita yang bertingkat-tingkat.","c":"","p":22},{"t":"Cerita Bersambung","d":"Cerita rekaan yang dimuat secara bersambung, bagian demi bagian secara berturut-turut dalam surat kabar atau majalah.","c":"","p":23},{"t":"Cerita Berseri","d":"Cerita yang diterbitkan secara berkelanjutan dalam beberapa bagian atau episode.","c":"Kisah bersambung yang dimuat setiap minggu di majalah remaja.","p":23},{"t":"Cerita Binatang","d":"Cerita yang tokoh-tokohnya terdiri dari binatang yang bertutur kata dan bertingkah laku seperti manusia, disebut juga : dongeng binatang atau fabel.","c":"- cerita Kancil dengan Siput. cerita Kancil dengan Buaya.","p":23},{"t":"Cerita Detektif","d":"Cerita yang menggunakan suatu misteri, misalnya pengungkapan suatu kejahatan.","c":"Mencari Pencuri Anak Perawan oleh Suman Hs.","p":23},{"t":"Cerita Epik","d":"Cerita berskala besar yang menggambarkan petualangan heroik dengan latar yang luas dan tokoh-tokoh besar.","c":"","p":23},{"t":"Cerita Fantasi","d":"Cerita rekaan yang menampilkan unsur-unsur di luar nalar atau kenyataan, seperti sihir dan dunia khayalan.","c":"Kisah tentang dunia sihir dan makhluk ajaib dalam serial fiksi anak-anak.","p":23},{"t":"Cerita Horor","d":"Cerita yang bertujuan menimbulkan rasa takut atau ngeri pada pembaca melalui unsur mistis atau menyeramkan.","c":"Kisah rumah berhantu yang menghadirkan ketegangan dan rasa takut bagi pembaca.","p":23},{"t":"Cerita Inspiratif","d":"Cerita yang bertujuan memberi semangat atau motivasi kepada pembaca melalui kisah tokoh atau peristiwa tertentu.","c":"Kisah seorang anak desa yang berhasil meraih pendidikan tinggi meski keterbatasan ekonomi.","p":23},{"t":"Cerita Jenaka","d":"Cerita yang menampilkan tokoh utama yang lucu/jenaka, kejenakaan tersebut disebabkan oleh kebodohan/kedunguan atau kecerdikan sang tokoh.","c":"- cerita Lebai Malang. -cerita Pak Pandir.","p":24},{"t":"Cerita Komedi","d":"Cerita yang mengandung unsur humor dengan akhir yang bahagia dan menyenangkan.","c":"","p":24},{"t":"Cerita Misteri","d":"Cerita yang alurnya dibangun di sekitar suatu teka-teki atau kejahatan yang harus dipecahkan.","c":"Novel detektif yang mengungkap pembunuhan melalui petunjuk-petunjuk tersembunyi.","p":24},{"t":"Cerita Motivasi","d":"Cerita yang isinya dirancang untuk mendorong pembaca mengambil tindakan positif atau mengubah pandangan hidup.","c":"Kisah pengusaha yang bangkit dari kegagalan berulang kali hingga sukses.","p":24},{"t":"Cerita Panji","d":"Siklus cerita klasik Jawa yang mengisahkan Panji Asmarabangun dan Dewi Sekartaji.","c":"Cerita Panji Semirang.","p":24},{"t":"Cerita Pendek (cerpen)","d":"Jenis karya sastra prosa yang memusatkan perhatian pada tokoh utama dan permasalahannya yang menonjol dalam satu situasi. Sebutan \"pendek\" bukan disebabkan oleh sedikitnya jumlah halaman atau sedikitnya tokoh cerita, melainkan disebabkan oleh terbatasnya ruang lingkup permasalahan yang hendak disampaikan.","c":"-Robohnya Surau Kami oleh A.A. Navis. -Mbah Danu oleh Nugroho Notosusanto.","p":24},{"t":"Cerita Petualangan","d":"Cerita yang berpusat pada perjalanan atau pengalaman tokoh menghadapi tantangan di tempat-tempat baru.","c":"Kisah pelayaran mengarungi lautan mencari harta karun yang hilang.","p":24},{"t":"Cerita Picisan","d":"Cerita yang bersifat hiburan semata, dangkal dalam isi, dan tidak mengandung nilai sastra yang tinggi.","c":"","p":24},{"t":"Cerita Picisan = Roman Picisan","d":"Cerita yang rendah nilai sastranya (cerita murahan) karena hanya mengutamakan sensasi tentang kejahatan, kekejaman, atau petualangan (sepicis = 10 seri) jadi lebih bersifat hiburan daripada bernilai sastra. Dalam sejarah sastra Indonesia pernah dikenal adanya \"Roman Picisan Indonesia\" yaitu buku-buku kecil berisi cerita roman yang diterbitkan di Medan.","c":"-Seri Suasana Baru. Contoh: -Seri Kejora.","p":25},{"t":"Cerita Rakyat","d":"Cerita yang sangat dikenal oleh masyarakat dan dituturkan dari mulut ke mulut serta tidak dikenal penciptanya. Misalnya: dongeng, legenda, dan mite.","c":"","p":25},{"t":"Cerita Realis","d":"Cerita yang menggambarkan kehidupan sehari-hari secara nyata dan apa adanya tanpa idealisasi.","c":"","p":25},{"t":"Cerita Rekaan","d":"Karya sastra naratif yang bersifat fiktif; disebut juga fiksi.","c":"","p":25},{"t":"Cerita Rekaan = Cerita Fiksi","d":"Cerita yang ditulis sebagai hasil rekaan, daya khayal atau imajinasi pengarang. Di dalam cerita rekaan terdapat juga fakta, namun fakta fakta tersebut telah diolah dan dibumbui dengan imajinasi pengarang sehingga dapat menimbulkan kesan tersendiri di hati pembaca.","c":"novel, cerpen.","p":25},{"t":"Cerita Religius","d":"Cerita yang mengangkat tema keagamaan atau nilai-nilai spiritual sebagai inti ceritanya.","c":"Kisah perjalanan hidup seorang santri dalam novel bertema keislaman.","p":25},{"t":"Cerita Sejarah","d":"Cerita rekaan yang berlatar peristiwa atau masa sejarah tertentu, sering memadukan fakta dan fiksi.","c":"Novel yang mengisahkan perjuangan kemerdekaan dengan latar tahun 1945.","p":25},{"t":"Cerita Simbolik","d":"Cerita yang menggunakan simbol-simbol untuk menyampaikan makna yang lebih dalam dari yang tersurat.","c":"","p":25},{"t":"Cerita Sisipan","d":"Cerita pendek yang disisipkan di dalam cerita induk sebagai variasi atau pengayaan narasi. Lihat juga: Cerita Berbingkai.","c":"","p":26},{"t":"Cerita Surreal","d":"Cerita yang menggabungkan realitas dengan unsur-unsur mimpi atau khayalan tanpa batas yang jelas.","c":"","p":26},{"t":"Cerita Tragedi","d":"Cerita yang berakhir dengan penderitaan atau kehancuran tokoh utama akibat takdir, kelemahan karakter, atau keadaan.","c":"","p":26},{"t":"Cerkan","d":"Kependekan dari cerita rekaan; karya sastra naratif yang bersifat fiktif.","c":"","p":26},{"t":"Cerpen","d":"Kependekan dari cerita pendek; karya sastra prosa naratif yang singkat dan memusatkan pada satu peristiwa.","c":"","p":26},{"t":"Cerpen Anak","d":"Cerita pendek yang ditujukan khusus untuk pembaca anak-anak dengan tema dan bahasa yang sesuai usia mereka.","c":"Cerita tentang persahabatan hewan-hewan di hutan yang ditulis untuk pembaca sekolah dasar.","p":26},{"t":"Cerpenis","d":"Sebutan untuk pengarang cerita pendek.","c":"Seno Gumira Ajidarma dikenal sebagai cerpenis.","p":26},{"t":"Cetak Perdana","d":"Terbitan pertama sebuah karya sastra sebelum mengalami cetak ulang, biasanya bernilai historis atau koleksi tersendiri.","c":"","p":26},{"t":"Cetak Ulang","d":"Penerbitan kembali sebuah buku yang sudah pernah terbit sebelumnya karena permintaan pasar yang masih tinggi.","c":"","p":26},{"t":"Chairil Anwar Generation","d":"Sebutan bagi para penyair sezaman dengan Chairil Anwar yang membawa pembaruan bentuk dan semangat individualisme dalam puisi Indonesia.","c":"","p":26},{"t":"Citra Gerak (Kinestetik)","d":"Pengimajian yang menimbulkan kesan gerak pada diri pembaca melalui pilihan kata dalam puisi.","c":"\"Daun-daun berguguran ditiup angin.\"","p":26},{"t":"Citra Imajinatif","d":"Gambaran mental yang terbentuk melalui bahasa puitis dan mampu merangsang imajinasi pembaca.","c":"","p":27},{"t":"Citra Kolektif","d":"Gambaran atau kesan bersama yang muncul dalam benak pembaca terhadap suatu kelompok atau masyarakat dalam karya sastra.","c":"Gambaran masyarakat desa yang gotong royong dalam banyak cerita rakyat Nusantara.","p":27},{"t":"Citra Mental","d":"Gambaran yang terbentuk dalam pikiran pembaca sebagai respons terhadap kata-kata dalam teks sastra.","c":"","p":27},{"t":"Citra Penciuman (Olfaktori)","d":"Pengimajian yang membangkitkan kesan indra penciuman (bau/aroma) pada pembaca.","c":"\"Wangi melati menusuk malam.\"","p":27},{"t":"Citra Pendengaran (Auditif)","d":"Pengimajian yang membangkitkan kesan indra pendengaran (bunyi/suara) pada pembaca.","c":"\"Gemuruh ombak memecah sunyi.\"","p":27},{"t":"Citra Pengecapan (Gustatif)","d":"Pengimajian yang membangkitkan kesan indra pengecap (rasa) pada pembaca.","c":"\"Pahit getir hidup kurasakan.\"","p":27},{"t":"Citra Penglihatan (Visual)","d":"Pengimajian yang menimbulkan kesan dapat dilihat, merupakan citraan paling dasar dan paling sering muncul dalam analisis puisi.","c":"\"Merah senja membakar langit.\"","p":27},{"t":"Citra Perabaan (Taktil)","d":"Pengimajian yang membangkitkan kesan indra peraba (sentuhan/tekstur) pada pembaca.","c":"\"Dingin embun menyentuh kulitku.\"","p":27},{"t":"Citra Simbolik","d":"Gambaran yang mengandung makna simbolis dan melampaui arti harfiahnya.","c":"","p":27},{"t":"Citraan Gerak","d":"Pengimajian dalam puisi yang menghadirkan kesan pergerakan pada benda atau suasana yang sebenarnya diam, untuk menghidupkan gambaran.","c":"","p":28},{"t":"Citraan Penciuman","d":"Pengimajian dalam puisi yang membangkitkan kesan aroma atau bau tertentu untuk memperkuat suasana.","c":"","p":28},{"t":"Citraan Pendengaran","d":"Pengimajian dalam puisi yang membangkitkan kesan bunyi atau suara tertentu di benak pembaca.","c":"","p":28},{"t":"Citraan Penglihatan","d":"Pengimajian dalam puisi yang membangkitkan pengalaman visual pembaca melalui pilihan kata yang menggambarkan warna, bentuk, atau gerak.","c":"","p":28},{"t":"Citraan Perabaan","d":"Pengimajian dalam puisi yang membangkitkan sensasi sentuhan, seperti tekstur, suhu, atau tekanan, pada pengalaman pembaca.","c":"","p":28},{"t":"Close Reading","d":"Metode membaca cermat dan mendetail terhadap unsur bahasa dalam sebuah teks untuk menangkap makna dan efek estetisnya secara menyeluruh.","c":"","p":28},{"t":"Daktil","d":"Jenis kaki puisi yang terdiri atas satu suku kata bertekanan diikuti dua suku kata tak bertekanan.","c":"","p":29},{"t":"Dalang","d":"Orang yang memainkan dan mementaskan pertunjukan wayang, sekaligus menjadi pencerita.","c":"Dalang memainkan wayang kulit semalam suntuk.","p":29},{"t":"Data Primer Sastra","d":"Teks karya sastra itu sendiri yang menjadi objek utama dalam sebuah penelitian atau kajian sastra.","c":"","p":29},{"t":"Data Sekunder Sastra","d":"Sumber pendukung seperti kritik, biografi, atau catatan sejarah yang digunakan untuk memperkaya kajian terhadap karya sastra utama.","c":"","p":29},{"t":"De Tachtigers","d":"Kelompok sastrawan Belanda dari tahun 1880-an yang menekankan individualisme dan estetika dalam sastra; berpengaruh pada sastra Indonesia melalui kolonialisme budaya.","c":"","p":29},{"t":"De Tachtigery","d":"Angkatan 1880, kelompok sastrawan Belanda yang banyak memberikan pengaruh kepada Angkatan Pujangga Baru di Indonesia. Pelopornya: Willem Kloos, Lodewijk van Deyssel, Frederik van Eeden, Albert Verwey.Mereka menerbitkan majalah De Nieuwe Gids (Pandu Baru).","c":"","p":29},{"t":"Defamiliarisasi","d":"Teknik membuat sesuatu yang familiar tampak asing melalui pilihan bahasa atau sudut pandang, sehingga pembaca mengalaminya kembali dengan kesadaran baru; padanan Indonesia dari ostranenie.","c":"","p":29},{"t":"Deiksis","d":"Unsur bahasa yang merujuk pada konteks situasi tuturan, seperti 'ini', 'itu', 'di sini', 'sekarang', dan sebagainya.","c":"","p":29},{"t":"Deiksis Tempat","d":"Kata atau frasa yang penunjukan lokasinya bergantung pada posisi penutur, misalnya 'di sini' atau 'di sana'.","c":"","p":29},{"t":"Deiksis Waktu","d":"Kata atau frasa yang penunjukan waktunya bergantung pada konteks tuturan, misalnya 'kemarin' atau 'besok'.","c":"","p":30},{"t":"Deklamasi","d":"Seni membacakan puisi dengan gerak, mimik, dan intonasi yang dramatis untuk menghidupkan makna dan suasana puisi di depan umum.","c":"","p":30},{"t":"Dekonstruksi","d":"Pendekatan analisis sastra yang membongkar hierarki dan oposisi biner dalam teks untuk menemukan makna yang tersembunyi atau bertentangan.","c":"","p":30},{"t":"Denotasi","d":"Makna kata yang lugas, tanpa adanya makna tambahan atau nilai rasa. Misalnya: bunga = kembang, bagian tumbuhan yang akan menjadi buah, bisanya elok warnanya dan sedap baunya. Lawan denotasi adalah konotasi, yaitu makna kata yang telah memperoleh tambahan nilai rasa tertentu. Misalnya: bunga dapat berarti gadis atau wanita.","c":"","p":30},{"t":"Denouement","d":"Bagian akhir cerita tempat seluruh konflik diselesaikan dan ketegangan mereda; peleraian.","c":"","p":30},{"t":"Depersonifikasi","d":"Majas yang menggambarkan manusia seolah-olah benda mati atau makhluk lain; kebalikan dari personifikasi.","c":"\"Ia hanya boneka dalam permainan ini.\"","p":30},{"t":"Deskripsi","d":"Lukisan, bentuk karangan yang melukiskan sesuatu hal denagn cara yang sehidup-hidupnya, sehingga pembaca mendapat kesan seolah-olah ia sendiri melihat, mendengar, dan merasakan apa yang dilukiskan tersebut.","c":"","p":30},{"t":"Deskripsi Naratif","d":"Pemaparan yang menggambarkan suasana, tempat, atau tokoh secara rinci di dalam alur cerita.","c":"Penggambaran suasana pasar pagi yang ramai sebelum peristiwa utama cerita dimulai.","p":30},{"t":"Deus Ex Machina","d":"Teknik penyelesaian cerita dengan menghadirkan kekuatan atau kejadian tak terduga dari luar logika cerita untuk mengakhiri konflik secara tiba-tiba.","c":"","p":30},{"t":"Deuteragonis","d":"Tokoh kedua terpenting setelah protagonis, sering berperan sebagai pendamping atau sahabat tokoh utama.","c":"Sahabat dekat tokoh utama yang turut membantu memecahkan konflik.","p":31},{"t":"Dewan Juri Sastra","d":"Kelompok penilai yang bertugas menyeleksi dan menentukan pemenang dalam sebuah sayembara atau penghargaan sastra.","c":"","p":31},{"t":"Dialek dalam Sastra","d":"Penggunaan variasi bahasa daerah atau kelompok sosial tertentu dalam dialog atau narasi karya sastra.","c":"Penggunaan logat Medan dalam dialog tokoh pada sebuah novel.","p":31},{"t":"Dialektika Sastra","d":"Proses pertentangan dan perpaduan gagasan dalam perkembangan pemikiran sastra dari satu masa ke masa berikutnya.","c":"Pertentangan antara aliran realisme dan romantisme yang melahirkan gaya penulisan baru.","p":31},{"t":"Dialog","d":"Bagian karya sastra drama, prosa, atau puisi naratif yang berupa percakapan antara dua tokoh atau lebih.","c":"","p":31},{"t":"Dialog Dramatis","d":"Percakapan dalam drama atau cerita yang langsung menampilkan konflik, ketegangan, atau emosi tokoh.","c":"","p":31},{"t":"Dialog Eksternal","d":"Percakapan yang terjadi antara dua tokoh atau lebih secara langsung.","c":"","p":31},{"t":"Dialog Internal","d":"Percakapan batin seorang tokoh dengan dirinya sendiri; disebut juga monolog interior.","c":"","p":31},{"t":"Dialog Naratif","d":"Dialog yang disampaikan melalui narasi, bukan dalam bentuk percakapan langsung.","c":"","p":31},{"t":"Dialog Realistis","d":"Dialog yang meniru cara bicara manusia sehari-hari, lengkap dengan kesan informal dan spontanitasnya.","c":"","p":31},{"t":"Dialogisme","d":"Konsep dari Mikhail Bakhtin yang memandang teks sastra, khususnya novel, sebagai ruang pertemuan berbagai suara dan pandangan yang saling berdialog.","c":"","p":32},{"t":"Diatikon","d":"Gaya bahasa yang menggambarkan sesuatu dengan cara mengelaborasi atau memerinci.","c":"","p":32},{"t":"Diegesis","d":"Dunia rekaan tempat peristiwa dalam cerita berlangsung, mencakup segala sesuatu yang termasuk dalam alam semesta naratif tersebut.","c":"","p":32},{"t":"Digresi","d":"Kejadian atau peristiwa dalam karya sastra yang menyimpang dari pokok persoalan yang sedang dihadapi.","c":"","p":32},{"t":"Diksi","d":"Pilihan kata yang berupa: Kemampuan membedakan secara tepat nuansa-nuansa makna (perbedaan-perbedaan kecil makna yang satu dengan makna yang lain) sesuai dengan gagasan yang hendak disampaikan. Kemampuan menemukan bentuk yang tepat sesuai dengan situasi dan nilai rasa.","c":"","p":32},{"t":"Diksi Ilmiah","d":"Pemilihan kata yang bersifat teknis dan objektif, biasa digunakan dalam esai atau kritik sastra.","c":"Penggunaan istilah 'representasi' dan 'interpretasi' dalam esai kritik sastra.","p":32},{"t":"Diksi Konkret","d":"Pemilihan kata yang menggambarkan sesuatu secara nyata dan dapat ditangkap indra.","c":"Kata 'meja', 'kursi', dan 'jendela' merupakan diksi konkret karena dapat dilihat dan diraba.","p":32},{"t":"Diksi Konotatif","d":"Pemilihan kata yang mengandung makna tambahan atau nilai rasa tertentu selain makna dasarnya.","c":"Kata 'kambing hitam' bermakna orang yang disalahkan, bukan hewan sungguhan.","p":32},{"t":"Diksi Puitis","d":"Pilihan kata yang memiliki nilai keindahan bunyi dan makna serta sesuai dengan konvensi puisi.","c":"","p":33},{"t":"Diksi Retoris","d":"Pilihan kata yang bertujuan mempengaruhi, meyakinkan, atau menggerakkan pembaca atau pendengar.","c":"","p":33},{"t":"Disfemisme","d":"Penggunaan kata-kata kasar atau tidak sopan untuk menggantikan ungkapan yang seharusnya lebih halus.","c":"Kata \"mampus\" untuk menggantikan \"meninggal\".","p":33},{"t":"Disjungsi Naratif","d":"Pemutusan atau ketidaksinambungan alur cerita yang dilakukan secara sengaja oleh pengarang.","c":"Alur cerita yang tiba-tiba melompat dari masa kini ke masa lalu tanpa transisi jelas.","p":33},{"t":"Disonansi","d":"Persamaan bunyi pada puisi berupa vokal-vokal yang menjadi rangka kata yang memberikan kesan bunyi-bunyi yang berlawanan.","c":"lintang-pukang ( i-a/u-a ) compang-camping (o-a/a-i)","p":33},{"t":"Distant Reading","d":"Metode kajian sastra berskala besar menggunakan alat komputasi untuk menganalisis pola dalam ribuan teks sekaligus, berlawanan dengan close reading.","c":"","p":33},{"t":"Distikon","d":"Puisi atau bait yang terdiri dari dua baris.","c":"Bait pantun kilat (karmina) yang hanya dua baris.","p":33},{"t":"Distorsi Realitas","d":"Penyimpangan gambaran kenyataan dalam karya sastra untuk mencapai efek estetis atau kritis tertentu.","c":"Penggambaran kota yang berubah bentuk secara surealis dalam sebuah cerpen.","p":33},{"t":"Domestikasi Terjemahan","d":"Strategi penerjemahan yang menyesuaikan unsur asing dalam teks sumber agar terasa akrab dengan budaya pembaca sasaran.","c":"","p":33},{"t":"Dongeng","d":"Cerita tentang tokoh khayal yang lahir dari khayalan pengarang. Apa yang diceritakan dalam dongeng tak pernah dan tak mungkin terjadi.","c":"-cerita-cerita Si Kancil. Contoh: -cerita terjadinya Gunung Tangkuban Perahu.","p":34},{"t":"Drama","d":"Karya sastra yang berisikan lukisan watak manusia yang harus dipertunjukkan dengan perbuatan atau dipentaskan.","c":"-Malam Jahanam oleh Matinggo Boesje. Contoh: -Cerita oleh Usmar Ismail.","p":34},{"t":"Drama Absurd","d":"Drama yang menggambarkan ketidakbermaknaan hidup manusia melalui alur dan dialog yang tidak logis.","c":"Naskah drama yang menampilkan dua tokoh menunggu seseorang yang tak kunjung datang tanpa kejelasan.","p":34},{"t":"Drama Komedi","d":"Drama yang bertujuan menghibur dan menimbulkan tawa penonton melalui situasi atau dialog jenaka.","c":"Pementasan yang menampilkan kesalahpahaman lucu antartokoh hingga mengundang tawa penonton.","p":34},{"t":"Drama Musikal","d":"Drama yang memadukan dialog, nyanyian, dan tarian dalam pementasannya.","c":"Pertunjukan yang memadukan dialog, lagu, dan tarian dalam satu kisah utuh.","p":34},{"t":"Drama Panggung","d":"Drama yang dipentaskan secara langsung di hadapan penonton di atas panggung.","c":"Pertunjukan teater yang digelar langsung di gedung kesenian dengan penonton hadir secara fisik.","p":34},{"t":"Drama puisi","d":"Drama yang dialognya berbentuk puisi.","c":"Bebasari oleh Rustam Effendi.","p":34},{"t":"Drama Radio","d":"Drama yang disajikan melalui media audio tanpa unsur visual, mengandalkan dialog dan efek suara.","c":"Sandiwara yang disiarkan melalui radio dengan efek suara sebagai pengganti visual.","p":35},{"t":"Drama Satu Babak","d":"Drama pendek yang keseluruhan ceritanya disajikan hanya dalam satu babak.","c":"Naskah pendek yang seluruh ceritanya selesai hanya dalam satu adegan panggung.","p":35},{"t":"Drama Televisi","d":"Drama yang diproduksi khusus untuk ditayangkan melalui media televisi.","c":"Sinetron yang diproduksi khusus untuk ditayangkan setiap minggu di layar kaca.","p":35},{"t":"Drama Tragedi","d":"Drama yang menampilkan kesedihan atau kehancuran tokoh utama sebagai inti ceritanya.","c":"Kisah kehancuran seorang raja akibat kesombongannya sendiri.","p":35},{"t":"Dramatic (s)","d":"Bersifat atau berkaitan dengan drama.","c":"","p":35},{"t":"Dramatik","d":"Bersifat mendebarkan, penuh ketegangan, dan menyentuh perasaan seperti layaknya sebuah drama.","c":"","p":35},{"t":"Dramatisasi","d":"Proses mengubah sebuah karya sastra menjadi bentuk drama, atau teknik membuat suatu peristiwa terasa dramatis.","c":"","p":35},{"t":"Dramaturgi","d":"Ilmu atau seni penyusunan dan pementasan drama, termasuk analisis struktur, karakter, dan teknik pementasan.","c":"","p":35},{"t":"Dramawan","d":"Sebutan untuk penulis naskah drama atau pelaku seni drama.","c":"W.S. Rendra dikenal sebagai dramawan.","p":35},{"t":"Dulmuluk","d":"Teater tradisional Sumatra Selatan (Palembang) yang mengisahkan cerita berbahasa syair diiringi musik.","c":"Pertunjukan Dulmuluk di Palembang.","p":36},{"t":"Dunia Fiksi","d":"Realitas imajiner yang diciptakan dalam sebuah karya fiksi dengan aturan dan logikanya sendiri.","c":"","p":36},{"t":"Dwibahasa Sastra","d":"Karya sastra yang ditulis atau disajikan dalam dua bahasa sekaligus.","c":"Puisi yang ditulis dalam bahasa Indonesia dan bahasa Inggris secara berdampingan.","p":36},{"t":"Editor Naskah","d":"Orang yang bertugas menyunting, memperbaiki, dan menyiapkan naskah karya sastra sebelum diterbitkan.","c":"","p":37},{"t":"Efek Alienasi","d":"Teknik dalam teater epik yang membuat penonton menyadari bahwa mereka sedang menonton pertunjukan, agar tetap berjarak dan kritis, bukan terlarut secara emosional.","c":"","p":37},{"t":"Efek Dramatik","d":"Dampak yang ditimbulkan oleh unsur-unsur dramatis dalam karya, seperti ketegangan, kejutan, atau emosi intens.","c":"","p":37},{"t":"Efek Emosional","d":"Dampak perasaan yang ditimbulkan oleh karya sastra pada pembaca.","c":"","p":37},{"t":"Efek Estetis","d":"Dampak keindahan yang dirasakan pembaca dari karya sastra.","c":"","p":37},{"t":"Efek Naratif","d":"Dampak yang ditimbulkan oleh teknik penceritaan terhadap pengalaman membaca.","c":"","p":37},{"t":"Efek Puitik","d":"Kesan atau dampak puitis yang tercipta dari penggunaan bahasa yang indah dan terstruktur.","c":"","p":37},{"t":"Ekfrasis","d":"Deskripsi verbal yang hidup mengenai sebuah karya seni visual di dalam karya sastra.","c":"Puisi yang menggambarkan secara rinci sebuah lukisan pemandangan malam berbintang.","p":37},{"t":"Ekokritik","d":"Pendekatan kritik sastra yang mengkaji hubungan antara karya sastra dengan lingkungan alam dan isu ekologis.","c":"","p":37},{"t":"Eksistensi","d":"Keberadaan atau kewujudan sesuatu; dalam sastra, eksistensi dapat merujuk pada keberadaan pengarang, karya, atau makna yang dihasilkan dalam interaksi dengan pembaca. Karya sastra memperoleh eksistensi penuh ketika dibaca, diinterpretasikan, dan dihidupkan dalam pengalaman estetis pembaca.","c":"Eksistensi sebuah novel tidak hanya terletak pada teks tertulisnya, tetapi juga pada makna yang diciptakan saat dibaca oleh pembaca yang berbeda-beda.","p":38},{"t":"Eksistensialisme","d":"Aliran filsafat dan sastra yang menitikberatkan pada kebebasan, pilihan, dan tanggung jawab individu dalam menghadapi kehidupan.","c":"Novel yang mengangkat tema kebebasan memilih jalan hidup di tengah absurditas dunia.","p":38},{"t":"Eksperimen Sastra","d":"Karya sastra yang mencoba bentuk, teknik, atau gaya baru yang menyimpang dari konvensi yang ada.","c":"","p":38},{"t":"Eksposisi","d":"Bagian awal cerita yang memperkenalkan tokoh, latar, dan situasi awal; juga merujuk pada metode penyampaian informasi secara langsung.","c":"","p":38},{"t":"Ekspresi Emosional","d":"Pengungkapan perasaan dan emosi melalui bahasa sastra.","c":"","p":38},{"t":"Ekspresi Estetis","d":"Pengungkapan keindahan melalui bahasa dan bentuk sastra.","c":"","p":38},{"t":"Ekspresi Linguistik","d":"Cara pengungkapan melalui bahasa, baik secara denotatif maupun konotatif.","c":"","p":38},{"t":"Ekspresi Puitik","d":"Ungkapan gagasan dan perasaan penyair yang disampaikan melalui bahasa yang padat dan bermakna.","c":"Cara penyair menuangkan kerinduan melalui pilihan kata yang padat makna.","p":38},{"t":"Ekspresionis","d":"Bersifat ekspresionisme; mengungkapkan ekspresi batin secara intens dan tidak realistis.","c":"","p":38},{"t":"Ekspresionisme","d":"Aliran seni dan sastra yang mengutamakan ungkapan batin dan emosi secara intens, sering dengan mendistorsi kenyataan.","c":"","p":39},{"t":"Ekspresionistis","d":"Bersifat ekspresi, karya sastra yang lahir dari aliran ekspresionisme dari tangan seorang ekspresionis. Misalnya, Puisi Aku karya Chairil Anwar.","c":"","p":39},{"t":"Ekstradiegetik","d":"Tingkat penceritaan yang berada di luar dunia cerita, biasanya posisi narator utama yang menceritakan keseluruhan kisah.","c":"","p":39},{"t":"Ekstrinsik","d":"Segi \"luar\" sastra, pembahasan terhadap karya sastra dapat dilakukan dari dua segi, intrinsik (segi dalam) dan ekstrinsik (segi luar). Misalnya, pembahasan sastra secara ekstrinsik: sastra ditinjau dari sosilogi, psikologi, dsb.","c":"","p":39},{"t":"Elegi","d":"Puisi rapatan, berisikan curahan perasaan kesedihan penyairnya. BUAH RINDU Datanglah engkau wahai maut Lepaskan aku dari nestapa Engkau lagi tempatku berpaut Di waktu ini gelap gulita, Kicau murai tiada merdu Pada beta pujang melayu Himbau pungguk tiada merindu Dalam telingaku seperti dahulu. . . . . . . . . . . . . . . . . . . . . . . . . . . Oleh: Amir Hamzah Dari: Puisi Baru","c":"","p":39},{"t":"Elemen Ekstrinsik","d":"Unsur-unsur di luar teks yang turut mempengaruhi pemahaman dan penilaian karya sastra.","c":"","p":39},{"t":"Elemen Intrinsik","d":"Unsur-unsur yang terdapat di dalam teks dan membangun karya sastra itu sendiri.","c":"","p":39},{"t":"Elipsis","d":"Majas penghilangan bagian kalimat yang dianggap sudah dapat dipahami konteksnya untuk efek tertentu.","c":"\"Aku ke pasar, dia ke sekolah.\" (kata \"pergi\" dihilangkan).","p":39},{"t":"Elipsis Naratif","d":"Peloncatan waktu dalam narasi ketika suatu rentang peristiwa sengaja tidak diceritakan agar cerita bergerak lebih cepat.","c":"","p":39},{"t":"Emotif","d":"Bersifat membangkitkan atau berkaitan dengan perasaan; salah satu fungsi bahasa menurut teori komunikasi.","c":"Kalimat 'Betapa indahnya senja ini!' menunjukkan fungsi emotif bahasa.","p":40},{"t":"Empati Pembaca","d":"Kemampuan pembaca merasakan dan memahami perasaan tokoh dalam karya sastra.","c":"Pembaca ikut merasa sedih saat tokoh utama kehilangan orang yang dicintainya.","p":40},{"t":"Enjambemen","d":"Unsur fisik puisi berupa pemenggalan atau perpindahan baris yang melanjutkan gagasan ke baris berikutnya tanpa jeda makna penuh.","c":"Kalimat yang terputus di akhir baris dan disambung pada baris berikutnya.","p":40},{"t":"Epanalepsis","d":"Majas repetisi berupa pengulangan kata pertama pada awal dan akhir baris/kalimat yang sama.","c":"\"Sedih hatiku memikirkannya, sedih.\"","p":40},{"t":"Epanortosis","d":"Majas yang meralat atau mengoreksi pernyataan yang baru saja diucapkan.","c":"\"Dia orang jahat---bukan, dia hanya salah paham.\"","p":40},{"t":"Epentesis","d":"Proses penambahan bunyi di tengah suatu kata.","c":"pucak → puncak; sajak → sanjak; kapak → kampak.","p":40},{"t":"Epic (s)","d":"Karangan yang melukiskan sesuatu secara objektif, tanpa disertai perasaan atau pertimbangan pengarang.","c":"kisah, biografi (prosa), syair, balada (puisi).","p":40},{"t":"Epifora","d":"Lawan anaphora: gaya bahasa penegasan yang berupa pengulangan kata-kata pada akhir kalimat atau akhir baris puisi.","c":"kalau kau mau, aku akan datang jika kau kehendaki, aku akan datang bila kau minta, aku akan dating","p":40},{"t":"Epigon","d":"\"Pengekor\", yaitu orang yang membonceng ketenaran sastrawan terkemuka dengan maksud agar dianggap sejajar atau tergolong ke dalam angkatan sastrawan terkemuka tersebut. Misalnya, seorang penyair yang ingin terkenal kemudian \"membonceng\" sebagai pengekor penyair terkemuka Angkatan 45, padahal melihat hasil karyanya ia belum layak digolongkan Angkatan 45.","c":"","p":41},{"t":"Epigram","d":"Puisi yang berisikan ajaran hidup, semangat perjuangan. BANGUNLAH, O PEMUDA Gempita suara atas angkasa, Wahyu kebangunan tanah tercinta, Bangunlah pemuda, saudaraku saying, Dengerlah nyanyian girang gemirang, Marilah saudara berbimbingan tangan, Mengayun langkah pulang ke taman. Bersinar cahaya di ufuk timur, Tanda bangsaku bangun tidur, Insaflah saudara, pemuda bangsaku, Mari berbakti kepada ibu, Gunakan ketika selagi ada, Buatlah jasa semasa muda. . . . . . . . . . . . . . . . . . . . . . . . Oleh: A. Hasjmy Dari:Puisi Baru","c":"","p":41},{"t":"Epik","d":"Genre sastra naratif panjang yang menceritakan kisah heroik berskala besar dengan tokoh-tokoh luar biasa.","c":"","p":41},{"t":"Epik Klasik","d":"Karya sastra naratif panjang yang mengisahkan kepahlawanan tokoh besar pada masa lampau, biasa ditulis dalam bentuk puisi.","c":"Kisah kepahlawanan dalam wiracarita Mahabharata dan Ramayana.","p":41},{"t":"Epilog","d":"Bagian penutup sebuah karya sastra yang merangkum atau memberikan komentar akhir setelah cerita selesai.","c":"","p":41},{"t":"Epilog Drama","d":"Bagian penutup pertunjukan drama yang berisi simpulan, renungan, atau pesan setelah cerita utama berakhir.","c":"","p":41},{"t":"Episode","d":"Bagian atau kejadian tertentu dalam sebuah cerita yang merupakan bagian dari keseluruhan alur.","c":"","p":41},{"t":"Epistolari","d":"Bentuk karya sastra yang disusun dalam bentuk surat-surat atau korespondensi antartokoh. Cerita disampaikan melalui surat yang ditulis oleh satu atau beberapa tokoh, sehingga pembaca mengenal peristiwa, konflik, dan perkembangan karakter melalui perspektif penulis surat.","c":"Novel Dracula karya Bram Stoker sebagian disusun dalam bentuk surat dan catatan harian. Dalam sastra Indonesia, novel Siti Nurbaya karya Marah Rusli menggunakan bentuk surat dalam beberapa bagian untuk menyampaikan perasaan tokoh.","p":42},{"t":"Epizeuksis","d":"Majas repetisi berupa pengulangan kata secara langsung berturut-turut dalam satu kalimat untuk penegasan.","c":"\"Pergi, pergi, pergi dari sini!\"","p":42},{"t":"Eponim","d":"Majas yang menggunakan nama orang terkenal untuk menyatakan sifat atau kualitas tertentu.","c":"\"Dia adalah Hercules baru di tim ini.\"","p":42},{"t":"Epos","d":"Karya sastra naratif panjang dalam bentuk puisi atau prosa yang menceritakan kisah kepahlawanan; sinonim dengan epik.","c":"","p":42},{"t":"Erotesis","d":"Majas berupa pertanyaan retoris yang tidak memerlukan jawaban, bertujuan menegaskan sesuatu.","c":"\"Siapa yang tak ingin bahagia?\"","p":42},{"t":"Esai","d":"Karangan prosa yang membahas suatu objek kebudayaan atau seni secara subjektifkarena didasarkan pandangan pribadi penulisnya.","c":"dapat dilihat pada antologi esai tentang persoalan-persoalan sastra, kumpulan esai pengarang-pengarang terkenal, Satyangraha Hoerip.","p":42},{"t":"Esais","d":"Orang yang menulis esai. Goenawan Mohamad dikenal sebagai esais terkemuka Indonesia melalui Catatan Pinggir-nya.","c":"","p":42},{"t":"Esensial","d":"Bersifat pokok, utama, atau sangat diperlukan; sesuatu yang menjadi inti, hakikat, atau unsur terpenting dari suatu hal. Dalam karya sastra, unsur esensial adalah komponen yang tidak dapat dihilangkan tanpa merusak keutuhan dan identitas karya tersebut.","c":"Tema merupakan unsur esensial dalam karya sastra karena tanpa tema, karya kehilangan arah, makna, dan pesan yang hendak disampaikan pengarang.","p":43},{"t":"Estetika","d":"Ilmu tentang keindahan; dalam sastra merujuk pada kajian nilai keindahan dalam karya sastra.","c":"","p":43},{"t":"Estetika Melayu","d":"Nilai-nilai keindahan yang khas dalam tradisi sastra Melayu, meliputi kehalusan bahasa, kesantunan, dan muatan moral religius.","c":"","p":43},{"t":"Estetika Resepsi","d":"Teori kritik sastra yang menekankan peran pembaca dalam memberi makna terhadap sebuah teks.","c":"Perbedaan tafsir pembaca terhadap makna akhir cerita yang menggantung.","p":43},{"t":"Estetika Reseptif","d":"Pandangan bahwa makna karya sastra terbentuk lewat proses penerimaan dan tanggapan pembaca, bukan semata-mata melekat pada teks.","c":"","p":43},{"t":"Estetisme","d":"Paham yang mengutamakan keindahan sebagai tujuan utama dalam penciptaan karya sastra.","c":"Karya seni untuk seni, tanpa mementingkan pesan moral atau sosial.","p":43},{"t":"Etnografi Sastra","d":"Pendekatan yang mengkaji karya sastra melalui data dan konteks budaya masyarakat penciptanya.","c":"Penelitian yang mengkaji upacara adat dalam novel berlatar budaya Toraja.","p":43},{"t":"Eufemisme","d":"Penggunaan ungkapan yang lebih halus untuk menggantikan kata yang dianggap kasar atau tabu. Menggunakan 'berpulang ke rahmatullah' sebagai pengganti kata 'meninggal' merupakan eufemisme.","c":"","p":43},{"t":"Eufenisme","d":"Ungkapan penghalus untuk menjaga kesopanan atau menghindari timbulnya kesan yang tidak menyenangkan.","c":"-kurang waras (gila) -sakit ingatan (gila)","p":44},{"t":"Eufoni","d":"Perpaduan bunyi bahasa yang enak didengar dan menimbulkan efek merdu dalam puisi.","c":"Perpaduan bunyi vokal lembut pada larik 'sunyi senyap malam berlalu'.","p":44},{"t":"Evaluasi","d":"Bagian struktur teks naratif yang berisi penilaian atau puncak konflik menuju penyelesaian cerita.","c":"Bagian cerita saat konflik mencapai puncaknya sebelum diselesaikan.","p":44},{"t":"Fabel","d":"Cerita yang menampilkan binatang sebagai tokoh dengan sifat manusia, biasanya mengandung pesan moral.","c":"","p":45},{"t":"Fabliau","d":"Cerita pendek berbentuk syair yang bersifat lucu dan sering berisi sindiran terhadap moral masyarakat, berasal dari tradisi sastra Prancis abad pertengahan.","c":"Cerita rakyat Prancis abad pertengahan yang menyindir tingkah laku pendeta serakah.","p":45},{"t":"Fakta Cerita","d":"Unsur-unsur dalam cerita yang bersifat nyata dalam dunia fiksi, seperti peristiwa, tokoh, dan latar yang membangun cerita.","c":"","p":45},{"t":"Faktor Budaya","d":"Aspek kebudayaan yang mempengaruhi penciptaan dan pemaknaan karya sastra.","c":"","p":45},{"t":"Faktor Psikologis","d":"Aspek kejiwaan yang mempengaruhi penciptaan karya dan perilaku tokoh dalam karya sastra.","c":"","p":45},{"t":"Faktor Sosial","d":"Aspek kehidupan masyarakat yang mempengaruhi karya sastra, seperti kelas sosial, konflik, dan norma.","c":"","p":45},{"t":"Fantasi","d":"Unsur khayalan yang melampaui kenyataan, sering digunakan dalam cerita rekaan untuk menciptakan dunia baru.","c":"Dunia sihir dan naga dalam kisah-kisah fiksi anak.","p":45},{"t":"Farce / Dagelan","d":"Jenis drama komedi yang menampilkan kelucuan berlebihan/kasar semata untuk menghibur penonton, tanpa pesan moral mendalam.","c":"Pertunjukan lawak panggung tradisional.","p":45},{"t":"Feminisme Sastra","d":"Pendekatan kritik sastra yang menyoroti representasi dan posisi perempuan dalam sebuah karya sastra.","c":"Kajian atas peran tokoh perempuan dalam novel \"Saman\" karya Ayu Utami.","p":45},{"t":"Festival Sastra","d":"Acara berskala besar yang menghimpun pembacaan karya, diskusi, dan pertemuan penulis serta pembaca dari berbagai kalangan.","c":"","p":46},{"t":"Fiksi","d":"Karya sastra yang bersifat rekaan atau khayalan, tidak berdasarkan fakta nyata.","c":"","p":46},{"t":"Fiksi Distopia","d":"Genre fiksi yang menggambarkan masyarakat masa depan yang tertindas, rusak, atau dikuasai sistem yang menekan kebebasan manusia.","c":"","p":46},{"t":"Fiksi Eksperimental","d":"Karya fiksi yang mencoba teknik, struktur, atau gaya naratif baru yang menyimpang dari konvensi.","c":"","p":46},{"t":"Fiksi Ilmiah","d":"Cerita rekaan yang menggabungkan unsur ilmu pengetahuan dan teknologi, sering berlatar masa depan.","c":"Novel tentang perjalanan antariksa dan kecerdasan buatan di masa depan.","p":46},{"t":"Fiksi Imajinatif","d":"Karya fiksi yang sangat mengandalkan daya khayal dan kreativitas pengarang.","c":"","p":46},{"t":"Fiksi Interaktif","d":"Bentuk narasi digital yang memungkinkan pembaca menentukan jalannya cerita melalui pilihan-pilihan yang disediakan.","c":"","p":46},{"t":"Fiksi Mini","d":"Cerita fiksi yang sangat pendek, sering kali hanya beberapa kalimat, namun tetap memuat unsur naratif yang utuh.","c":"","p":46},{"t":"Fiksi Naratif","d":"Karya fiksi yang disajikan dalam bentuk narasi atau cerita.","c":"","p":46},{"t":"Fiksi Populer","d":"Karya fiksi yang ditulis untuk dinikmati khalayak luas, umumnya ringan dan menghibur.","c":"Novel roman remaja yang laris dibaca kalangan luas.","p":46},{"t":"Fiksi Realis","d":"Karya fiksi yang menggambarkan kehidupan dengan cara yang menyerupai kenyataan.","c":"","p":46},{"t":"Fiksi Sejarah","d":"Cerita rekaan yang mengangkat latar dan peristiwa sejarah namun dengan tokoh atau alur yang dikarang.","c":"Novel yang menghidupkan kembali suasana zaman kolonial dengan tokoh rekaan.","p":47},{"t":"Fiksi Simbolik","d":"Karya fiksi yang menggunakan simbol-simbol untuk menyampaikan makna yang lebih dalam.","c":"","p":47},{"t":"Fiksi Spekulatif","d":"Genre fiksi yang mencakup unsur-unsur di luar realitas, seperti fiksi ilmiah, fantasi, dan horor.","c":"Cerita yang menggabungkan unsur fiksi ilmiah dan horor dalam satu dunia rekaan.","p":47},{"t":"Fiksi Utopia","d":"Genre fiksi yang menggambarkan masyarakat ideal dan sempurna sebagai kebalikan dari fiksi distopia.","c":"","p":47},{"t":"Filologi","d":"Ilmu yang mempelajari bahasa melalui teks-teks tertulis; dalam konteks sastra, filologi berkaitan dengan penelitian naskah-naskah kuno.","c":"","p":47},{"t":"Firasat Cerita","d":"Petunjuk atau isyarat yang disisipkan pengarang lebih awal untuk mengisyaratkan peristiwa penting yang akan terjadi kemudian dalam cerita.","c":"","p":47},{"t":"Fokalisasi","d":"Sudut pengambilan sudut pandang dalam narasi yang menentukan dari perspektif siapa peristiwa disampaikan.","c":"Cerita yang seluruhnya disampaikan dari sudut pandang batin tokoh utama.","p":47},{"t":"Fokalisasi Eksternal","d":"Jenis fokalisasi ketika narator hanya menceritakan apa yang tampak dari luar, tanpa masuk ke pikiran atau perasaan tokoh.","c":"","p":47},{"t":"Fokalisasi Internal","d":"Jenis fokalisasi ketika informasi cerita dibatasi pada apa yang diketahui dan dirasakan oleh satu tokoh tertentu.","c":"","p":47},{"t":"Fokalisasi Nol","d":"Jenis fokalisasi ketika narator mengetahui lebih banyak daripada tokoh mana pun, sepadan dengan sudut pandang mahatahu.","c":"","p":47},{"t":"Folklor","d":"Kebudayaan tradisional suatu masyarakat, termasuk cerita rakyat, yang diwariskan secara lisan turun-temurun.","c":"Cerita rakyat 'Malin Kundang' yang diwariskan turun-temurun di Sumatra Barat.","p":48},{"t":"Foreignisasi Terjemahan","d":"Strategi penerjemahan yang mempertahankan unsur asing dari teks sumber agar pembaca sasaran merasakan nuansa budaya aslinya.","c":"","p":48},{"t":"Formalisme Rusia","d":"Aliran kritik awal abad ke-20 yang memusatkan perhatian pada unsur formal dan teknik kebahasaan yang membuat sebuah teks bersifat sastra (literariness).","c":"","p":48},{"t":"Fragmen","d":"Bagian atau petikan dari sebuah karya yang tidak utuh; bisa berupa penggalan cerita atau puisi.","c":"","p":48},{"t":"Frasa Puitik","d":"Rangkaian kata yang dipilih dan disusun khusus untuk menimbulkan efek keindahan dalam puisi.","c":"'Senja yang merah jambu' merupakan frasa yang dipilih khusus untuk efek keindahan.","p":48},{"t":"Fungsi Bahasa","d":"Peran dan tujuan penggunaan bahasa dalam karya sastra, seperti untuk berekspresi, berkomunikasi, atau memperindah.","c":"","p":48},{"t":"Fungsi Ekspresif","d":"Peran bahasa dalam mengungkapkan perasaan dan sikap penutur atau pengarang.","c":"","p":48},{"t":"Fungsi Estetika","d":"Peran bahasa dalam menciptakan keindahan dan rasa senang pada pembaca.","c":"","p":48},{"t":"Fungsi Fatik","d":"Fungsi bahasa yang digunakan untuk menjaga atau membuka saluran komunikasi antara penutur dan lawan bicara.","c":"Ungkapan 'Halo, apa kabar?' yang berfungsi membuka saluran komunikasi.","p":48},{"t":"Fungsi Konatif","d":"Fungsi bahasa yang ditujukan untuk memengaruhi atau mengajak pembaca/pendengar bertindak.","c":"Kalimat 'Bacalah buku ini!' bertujuan memengaruhi pembaca untuk bertindak.","p":49},{"t":"Fungsi Naratif Propp","d":"Unit-unit tindakan tokoh yang berulang dan tetap urutannya dalam struktur dasar cerita rakyat, menurut analisis Vladimir Propp.","c":"","p":49},{"t":"Fungsi Referensial","d":"Peran bahasa dalam merujuk pada kenyataan atau objek di luar teks.","c":"","p":49},{"t":"Gagasan","d":"Ide atau konsep yang menjadi dasar atau isi dari sebuah karya sastra.","c":"","p":50},{"t":"Gagasan Kreatif","d":"Ide orisinal yang menjadi sumber inspirasi penciptaan karya sastra.","c":"","p":50},{"t":"Gagasan Naratif","d":"Ide yang disampaikan melalui cara bercerita, bukan secara langsung.","c":"","p":50},{"t":"Gagasan Utama","d":"Ide pokok yang menjadi inti dan landasan seluruh karya sastra.","c":"","p":50},{"t":"Gaya","d":"Cara menyusun dan menyampaikan pikiran serta perasaan dalam bentuk tulisan maupun secara lisan. Ciri suatu kelompok karya sastra yang dibentuk oleh pilihan kata dan susunan kalimat berdasarkan bentuk pernyataan atau ekspresinya.","c":"","p":50},{"t":"Gaya Argumentatif","d":"Cara penyampaian yang bertujuan membuktikan atau membela suatu pendapat.","c":"","p":50},{"t":"Gaya Bahasa","d":"Cara menggunakan
