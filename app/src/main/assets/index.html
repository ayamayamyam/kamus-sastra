 bahasa untuk memperoleh efek tertentu (maksud dan suasana) sesuai dengan yang dikehendaki oleh pengarang atau pembicara, disebut juga figura bahasa. Misalnya dengan mempergunakan perbandingan-perbandingan, menghidupkan benda-benda mati dan sebagainya. Pemuda adalah bunga bangsa. Pucuk-pucuk teh menggeliat ditimpa sinar matahari pagi.","c":"","p":50},{"t":"Gaya Bahasa Figuratif","d":"Penggunaan bahasa yang tidak harfiah dengan menggunakan kiasan, lambang, atau perbandingan.","c":"","p":50},{"t":"Gaya Bahasa Perbandingan","d":"Kelompok majas yang menyatakan perbandingan antara dua hal, seperti metafora, simile, dan personifikasi.","c":"Metafora, simile, dan personifikasi termasuk dalam kelompok ini.","p":50},{"t":"Gaya Bahasa Retoris","d":"Penggunaan bahasa yang bertujuan mempengaruhi atau meyakinkan pembaca atau pendengar.","c":"","p":51},{"t":"Gaya Bahasa Simbolik","d":"Penggunaan simbol-simbol dalam bahasa untuk menyampaikan makna yang lebih dalam.","c":"","p":51},{"t":"Gaya Individual","d":"Cara khas seorang pengarang yang unik dan berbeda dari pengarang lainnya.","c":"","p":51},{"t":"Gaya Klasik","d":"Gaya penulisan yang mengikuti kaidah dan konvensi sastra tradisional, menekankan keteraturan bentuk.","c":"Penulisan syair yang mengikuti pola bait dan rima tradisional secara ketat.","p":51},{"t":"Gaya Kolektif","d":"Ciri-ciri gaya yang dimiliki bersama oleh sekelompok pengarang dalam suatu periode atau aliran.","c":"","p":51},{"t":"Gaya Naratif","d":"Cara khas pengarang dalam menyampaikan cerita, meliputi pemilihan kata, sudut pandang, dan struktur kalimat.","c":"Cara seorang pengarang menyusun kalimat panjang dan reflektif yang khas dalam novelnya.","p":51},{"t":"Gaya Realis","d":"Cara penulisan yang menggambarkan kehidupan sebagaimana adanya tanpa dilebih-lebihkan.","c":"Penggambaran kehidupan buruh pabrik apa adanya tanpa dilebih-lebihkan.","p":51},{"t":"Gazal","d":"Jenis puisi lama yang berasal dari bahasa Persi dan Arab. Kekasihku seperti nyawa pun adalah terkasih dan mulia juga, Dan nyawaku pun, mana daripada nyawa itu jauh ia juga, Jika seribu tahun lamanya pun hidup ada sia-sia juga, Hanya jika pada nyawa itu hampir dengan sedia suka juga, Nyawa itu yang menghidupkan senantiasa nyawa manusia juga, Dan menghilangkan cintanya pun itu kekasihku yang setia juga; Kekasihku itu yang mengenak hatiku dengan rahasia juga, Bukhari yang ada serta nyawa itu ialah berbahagia juga.","c":"","p":51},{"t":"Geguritan","d":"Puisi tradisional Jawa modern yang bebas dari aturan tembang.","c":"Geguritan tentang keindahan alam Jawa.","p":52},{"t":"Gender dalam Sastra","d":"Kajian mengenai representasi peran dan identitas gender dalam karya sastra.","c":"Kajian tentang peran perempuan dalam novel-novel bertema kesetaraan gender.","p":52},{"t":"Genre Sastra","d":"Pengelompokan karya sastra berdasarkan bentuk, isi, atau gaya penulisannya, seperti puisi, prosa, dan drama.","c":"Puisi, prosa, dan drama merupakan tiga genre utama dalam sastra.","p":52},{"t":"Gerakan Literasi","d":"Upaya kolektif untuk menumbuhkan kebiasaan membaca dan menulis di tengah masyarakat, sering melibatkan komunitas sastra dan perpustakaan.","c":"","p":52},{"t":"Gestalt Naratif","d":"Kesan keseluruhan yang terbentuk dari perpaduan unsur-unsur cerita secara utuh.","c":"Kesan menyeluruh yang tertinggal setelah membaca keseluruhan novel.","p":52},{"t":"Gita","d":"Puisi atau nyanyian yang bersifat pujian, sering digunakan dalam sastra klasik.","c":"Kidung pujian dalam sastra Jawa kuno yang dilantunkan pada upacara adat.","p":52},{"t":"Glosarium Sastra","d":"Kumpulan istilah beserta penjelasannya yang berkaitan dengan bidang kesusastraan.","c":"Daftar istilah seperti 'metafora' dan 'alur' yang disusun beserta penjelasannya di akhir buku.","p":52},{"t":"Grotesk","d":"Gaya penggambaran yang aneh, berlebihan, dan kadang menyeramkan untuk menciptakan efek dramatis atau satire.","c":"Penggambaran tokoh dengan wujud fisik aneh dan berlebihan dalam cerita satire.","p":52},{"t":"Guguritan","d":"Puisi tradisional Sunda yang terikat oleh aturan pupuh.","c":"Guguritan berisi nasihat hidup.","p":53},{"t":"Gurindam","d":"Bentuk puisi lama yang diperkirakan berasal dari India (Tamil). Syarat-syarat gurindam: Tiap bait terdiri dari 2 baris. Rima akhir /aa/. Baris pertama merupakan sebab, baris kedua merupakan akibatnya. Isinya: nasihat, sindiran.","c":"kurang pikir kurang siasat, tentu dirimu kelak tersesat.","p":53},{"t":"Gurindam XII","d":"Karya sastra Melayu klasik karangan Raja Ali Haji yang terdiri atas dua belas fasal gurindam berisi nasihat moral dan ajaran agama.","c":"","p":53},{"t":"Hagiografi","d":"Tulisan yang mengisahkan riwayat hidup tokoh suci atau tokoh yang dianggap mulia, sering disertai unsur pemujaan.","c":"Kisah riwayat hidup seorang wali yang penuh keteladanan dan mukjizat.","p":54},{"t":"Haiku","d":"Puisi pendek asal Jepang yang terdiri atas tiga baris dengan pola suku kata 5-7-5, biasa menggambarkan alam.","c":"'Daun jatuh sendiri / kolam tua yang sepi / suara air.'","p":54},{"t":"Heksameter","d":"Bentuk baris puisi yang terdiri atas enam kaki (unit irama), umum dalam puisi epik klasik Yunani dan Latin.","c":"Baris puisi epik Yunani yang tersusun atas enam kaki irama.","p":54},{"t":"Hermeneutika","d":"Ilmu atau teori penafsiran teks, terutama teks sastra dan keagamaan.","c":"","p":54},{"t":"Hermeneutika Sastra","d":"Penerapan hermeneutika dalam kajian karya sastra untuk mengungkap makna tersembunyi dalam teks.","c":"","p":54},{"t":"Heterodiegetik","d":"Jenis narator yang berada di luar dunia cerita dan tidak menjadi tokoh yang mengalami peristiwa yang diceritakannya.","c":"","p":54},{"t":"Heteroglosia","d":"Konsep Bakhtin tentang keberagaman ragam bahasa, dialek, dan gaya bicara yang hidup berdampingan di dalam sebuah teks naratif.","c":"","p":54},{"t":"Hibriditas Teks","d":"Sifat sebuah teks yang memadukan berbagai bentuk, genre, atau gaya secara kreatif.","c":"","p":54},{"t":"Hikayat","d":"Karya sastra prosa Melayu lama yang berisi kisah para raja, pahlawan, atau tokoh legendaris. Hikayat Hang Tuah merupakan karya sastra Melayu klasik yang menceritakan kesetiaan seorang pahlawan.","c":"","p":54},{"t":"Himne","d":"Puisi yang berisikan pujian kepada Tuhan atau bernafas keagamaan.","c":"DO'A Dengan apakah kubandingkan pertemuan kita, kekasihku? Dengan senja samar sepoi, pada masa purnama meningkat naik, setelah menghalaukan panas payah terik. Angin malam menghembus lemah, menyejuk badan, melambung rasa menayang pikir, membawa angan ke bawah kursi mu. Hatiku terang menerima kata-Mu, bagai bintang memasang lilinnya. Kalbuku terbuka menungu kasih-Mu, bagai sedap malam menyirak kelopak. Aduh, kasihku, isi hati-Mu dengan kata-Mu, penuhi dadaku dengan cahaya-Mu, biar bersinar mataku sendu, biar bersinar gelakku rayu. (Amir Hamzah)","p":55},{"t":"Hiperbol (a)","d":"Gaya bahasa yang menggunakan keterangan yang berlebih-lebihan.","c":"setiap hari ia senantiasa membanting tulang, memeras keringat untuk menghidupi keluarganya. para pemuda berteriak ke seluruh dunia meminta kebebasan.","p":55},{"t":"Hiperbola","d":"Majas yang menyatakan sesuatu secara berlebihan melebihi kenyataan. 'Sudah seribu kali aku memanggilmu' --- angka seribu merupakan hiperbola.","c":"","p":55},{"t":"Hiperbolisme","d":"Kecenderungan atau gaya yang menggunakan hiperbola secara berlebihan.","c":"","p":55},{"t":"Hipernim","d":"Kata yang maknanya mencakup atau menjadi superordinat dari makna kata-kata lain (hiponim).","c":"\"Bunga\" adalah hipernim dari \"mawar\", \"melati\", \"anggrek\".","p":55},{"t":"Hipertekstualitas","d":"Hubungan antara sebuah teks (hiperteks) dengan teks sebelumnya (hipoteks) yang ditransformasikan, diparodikan, atau digubah ulang olehnya.","c":"","p":55},{"t":"Hipogram","d":"Teks atau karya terdahulu yang menjadi rujukan atau dasar penciptaan karya sastra baru.","c":"Sajak lama yang menjadi rujukan penciptaan puisi baru dengan tema serupa.","p":55},{"t":"Hiponim","d":"Kata yang maknanya tercakup di dalam makna kata lain yang lebih umum (hipernim).","c":"\"Mawar\" adalah hiponim dari \"bunga\".","p":56},{"t":"Hipotaksis","d":"Penyusunan kalimat dengan hubungan bertingkat antara induk kalimat dan anak kalimat.","c":"'Karena hujan turun deras, ia pun membatalkan perjalanannya.'","p":56},{"t":"Historiografi Sastra","d":"Penulisan sejarah perkembangan sastra dari suatu bangsa atau periode tertentu.","c":"Penulisan tentang perkembangan sastra Indonesia dari Angkatan Balai Pustaka hingga kini.","p":56},{"t":"Historisisme Baru","d":"Pendekatan kritik yang membaca karya sastra sebagai bagian dari jalinan wacana sejarah dan kekuasaan pada zamannya, bukan sekadar cerminan pasif sejarah.","c":"","p":56},{"t":"Homodiegetik","d":"Jenis narator yang juga merupakan salah satu tokoh yang berperan dan mengalami peristiwa di dalam dunia cerita yang diceritakannya.","c":"","p":56},{"t":"Homofon","d":"Kata yang memiliki lafal sama tetapi ejaan dan makna berbeda.","c":"\"bank\" dan \"bang\".","p":56},{"t":"Homograf","d":"Kata yang memiliki ejaan sama tetapi lafal dan makna berbeda.","c":"\"apel\" (buah) dan \"apel\" (upacara).","p":56},{"t":"Homonim","d":"Kata yang memiliki ejaan dan lafal sama tetapi maknanya berbeda.","c":"\"bisa\" (racun) dan \"bisa\" (dapat/mampu).","p":56},{"t":"Homonimi","d":"Gejala dua kata atau lebih yang memiliki bentuk atau bunyi sama tetapi maknanya sama sekali berbeda.","c":"","p":56},{"t":"Hubungan Intertekstual","d":"Keterkaitan makna antara satu teks sastra dengan teks lain yang mendahului atau memengaruhinya.","c":"Novel modern yang mengambil rujukan alur dari kisah pewayangan klasik.","p":57},{"t":"Humanisme","d":"Pandangan yang menempatkan manusia sebagai pusat dan nilai tertinggi; dalam sastra, humanisme menekankan nilai kemanusiaan dan martabat manusia.","c":"","p":57},{"t":"Humor","d":"Sesuatu yang bersifat lucu dan menggelikan; dalam sastra, humor digunakan untuk menghibur atau menyampaikan kritik secara tidak langsung.","c":"","p":57},{"t":"Humor Verbal","d":"Kelucuan yang timbul dari permainan kata atau bahasa dalam suatu karya sastra.","c":"Permainan kata yang menimbulkan tawa dalam dialog tokoh, seperti pelesetan nama.","p":57},{"t":"Humoristis","d":"Bersifat humor, bergaya humor.","c":"cerpen-cerpen M. Kasim dalam Teman Duduk. cerpen-cerpen Suman H. S. dalam Dawar Bergelut.","p":57},{"t":"Iambik","d":"Jenis kaki puisi yang terdiri atas satu suku kata tak bertekanan diikuti satu suku kata bertekanan.","c":"","p":58},{"t":"Ibarat","d":"Perumpamaan yang menggunakan alam sebagai bahan perbandingan.","c":"bagai kerakap tumbuh di batu hidup segan mati tak mau. ibarat bunga segar dipakai layu dibuang.","p":58},{"t":"Ide Pokok","d":"Gagasan utama yang menjadi inti sebuah karya atau paragraf.","c":"","p":58},{"t":"Ideologi dalam Sastra","d":"Pandangan atau nilai tertentu yang secara sadar maupun tidak disisipkan pengarang ke dalam karyanya.","c":"Nilai perjuangan kelas yang tersirat dalam novel-novel realisme sosial.","p":58},{"t":"Idiolek","d":"Ciri khas pemakaian bahasa seseorang, termasuk gaya bahasa khas seorang pengarang.","c":"Kebiasaan seorang pengarang menggunakan kata seru tertentu berulang kali dalam karyanya.","p":58},{"t":"Idiom","d":"Gabungan kata yang membentuk makna baru dan tidak dapat ditelusuri dari makna masing-masing unsur katanya.","c":"\"Membanting tulang\" berarti bekerja keras.","p":58},{"t":"Idiom Sastra","d":"Ungkapan tetap dalam bahasa yang maknanya tidak dapat ditafsirkan secara harfiah dari kata-kata pembentuknya, sering dipakai untuk memperkaya gaya bahasa.","c":"","p":58},{"t":"Ikhtisar","d":"Ringkasan pokok isi karangan yang ditulis dengan bahasa/susunan penulis sendiri, tidak harus mengikuti urutan asli teks.","c":"Ikhtisar bab dalam buku pelajaran.","p":58},{"t":"Ilokusi","d":"Tindak tutur yang mengandung maksud atau tujuan tertentu dari penutur, dikaji dalam pragmatik sastra.","c":"Kalimat 'Tolong tutup pintunya' yang mengandung maksud permintaan, bukan sekadar informasi.","p":59},{"t":"Iluminasi Naskah","d":"Hiasan atau gambar dekoratif yang menyertai teks dalam naskah kuno, sering ditemukan pada naskah keagamaan atau istana.","c":"","p":59},{"t":"Ilusi Realitas","d":"Kesan nyata yang diciptakan oleh karya fiksi sehingga pembaca merasakan dunia cerita seolah-olah nyata.","c":"","p":59},{"t":"Ilustrasi Sastra","d":"Gambar yang menyertai teks sastra untuk memperjelas atau memperindah penyampaian cerita.","c":"Gambar tokoh utama yang menyertai teks pada buku cerita anak.","p":59},{"t":"Imaji Puitik","d":"Gambaran indrawi yang diciptakan melalui bahasa puisi untuk mempengaruhi perasaan dan imajinasi pembaca.","c":"","p":59},{"t":"Imaji Simbolik","d":"Gambaran indrawi yang sekaligus memiliki makna simbolis.","c":"","p":59},{"t":"Imajinasi","d":"Daya khayal, daya bayang; kemampuan membayangkan sesuatu yang tidak tertangkap oleh panca indera atau yang belum pernah dialami atau belum menjadi kenyataan.","c":"","p":59},{"t":"Imajis","d":"Bersifat menonjolkan citraan atau gambaran indrawi dalam puisi.","c":"Larik puisi yang menonjolkan gambaran visual daun gugur satu per satu.","p":59},{"t":"Imajisme","d":"Aliran puisi yang menekankan penggambaran citra yang tajam, jelas, dan padat.","c":"Gerakan puisi awal abad ke-20 yang menekankan citra visual yang tajam dan padat.","p":59},{"t":"Imitasi","d":"Peniruan karya atau gaya pengarang lain; dalam kajian sastra, imitasi dapat menjadi tahap awal pembelajaran penulisan.","c":"","p":60},{"t":"Implikatur","d":"Makna tersirat yang harus disimpulkan pembaca dari suatu ujaran atau dialog dalam karya sastra.","c":"Ucapan 'Di sini dingin sekali' yang tersirat bermaksud meminta jendela ditutup.","p":60},{"t":"Impresionis","d":"Bersifat impresionisme; menangkap kesan sesaat secara subjektif.","c":"","p":60},{"t":"Impresionisme","d":"Aliran seni dan sastra yang menekankan kesan subjektif dan sensori sesaat daripada gambaran objektif.","c":"","p":60},{"t":"Impresionistis","d":"Karya sastra yang merupakan hasil ciptaan sastrawan yang impresionis, penganut aliran impresionisme. CANDI Engkau menahan empasan kala Tinggi berdiri indah permai Tidak mengabaikan serangan segala Megah kuat tidak terperai Engkau berita waktu yang lalu Masa Indonesia mashur maju Dilayan putera bangsawan kalbu Dijunjung tinggi penaka ratu Aku memandang suka dan duka Berganti-ganti di dalam hati Terkenang dulu dan waktu nanti Apa gerangan masa di muka Jadi bangsa yang kucintai ini Ada tanda megah kembali (Sanusi Pane)","c":"","p":60},{"t":"Improvisasi","d":"Penciptaan atau penyampaian yang dilakukan secara spontan tanpa persiapan; dalam teater, improvisasi adalah teknik bermain tanpa naskah baku.","c":"","p":60},{"t":"In Medias Res","d":"Teknik memulai cerita dari tengah-tengah rangkaian peristiwa, bukan dari awal kronologis, untuk langsung menarik perhatian pembaca.","c":"","p":60},{"t":"Indeksikalitas","d":"Sifat suatu tanda bahasa yang maknanya bergantung pada konteks penggunaannya.","c":"Kata 'di sini' yang maknanya berubah tergantung tempat penutur berada.","p":60},{"t":"Individu Tokoh","d":"Keunikan dan kekhasan karakter seorang tokoh yang membedakannya dari tokoh lain.","c":"","p":61},{"t":"Inspirasi","d":"Ilham; bisikan yang mampu menggerakkan jiwa untuk mempengaruhi pikiran atau perasaan dalam penciptaan karya sastra.","c":"","p":61},{"t":"Intensifikasi Makna","d":"Penguatan makna suatu kata atau ungkapan melalui pengulangan atau penekanan tertentu.","c":"Kata 'sangat', 'sekali', dan 'benar-benar' yang memperkuat makna kata sifat.","p":61},{"t":"Interaksi Naratif","d":"Hubungan dinamis antara berbagai elemen cerita, seperti antara narator dan tokoh, atau antara alur dan latar.","c":"","p":61},{"t":"Interaksi Tokoh","d":"Hubungan dan pertukaran antara tokoh-tokoh dalam sebuah karya sastra yang mendorong perkembangan cerita.","c":"","p":61},{"t":"Interpretasi","d":"Penafsiran makna suatu karya sastra berdasarkan pemahaman pembaca.","c":"","p":61},{"t":"Interpretasi Hermeneutis","d":"Proses penafsiran makna teks sastra dengan memperhitungkan konteks, latar belakang, dan pergulatan makna antara pembaca dan teks.","c":"","p":61},{"t":"Interpretasi Sastra","d":"Proses menafsirkan makna, nilai, dan pesan yang terkandung dalam karya sastra.","c":"","p":61},{"t":"Interpretasi Teks","d":"Upaya memahami dan menjelaskan makna sebuah teks sastra.","c":"","p":61},{"t":"Interteks","d":"Teks yang mengandung jejak atau rujukan terhadap teks lain sebelumnya.","c":"Novel yang menyisipkan kutipan dan alusi dari karya-karya klasik sebelumnya.","p":61},{"t":"Intertekstualitas","d":"Hubungan antara satu teks dengan teks-teks lain yang mempengaruhi atau dirujuknya, baik secara eksplisit maupun implisit.","c":"","p":61},{"t":"Intonasi","d":"Lagu atau tekanan suara yang mempengaruhi makna dan efek sebuah ucapan atau bacaan puisi.","c":"","p":62},{"t":"Intradiegetik","d":"Tingkat penceritaan yang berada di dalam dunia cerita, misalnya tokoh yang menceritakan kisah lain di dalam cerita utama.","c":"","p":62},{"t":"Intrinsik","d":"Berasal dari dalam; dalam sastra merujuk pada unsur-unsur yang membangun karya dari dalam, seperti tema, alur, dan tokoh.","c":"","p":62},{"t":"Inuendo","d":"Majas sindiran halus dengan cara mengecilkan fakta yang sebenarnya.","c":"\"Dia hanya 'meminjam' uang itu tanpa izin.\" (menyindir tindakan mencuri).","p":62},{"t":"Inversi","d":"Pembalikan urutan kata sehingga menyimpang dari urutan biasa untuk menonjolkan makna kata tertentu.","c":"tidak mengabaikan serangan segala. berontak hati hendak bebas. (urutan kata yang lazim: segala serangan) (urutan yang lazim: hati berontak)","p":62},{"t":"Irama","d":"Pengulangan bunyi, tekanan, atau pola tertentu yang menciptakan kesan musikal dalam puisi atau prosa.","c":"","p":62},{"t":"Irama = ritme","d":"Keindahan yang ditimbulkan oleh adanya perulangan dan variasi bunyi berupa cepat-lambat, keras-lemah atau tinggi-rendahnya bunyi.","c":"","p":62},{"t":"Ironi","d":"Jenis gaya bahasa sindiran dengan cara mengatakan sebaliknya dengan apa yang sebenarnya.","c":"wah, rajin benar engkau, baru pukul 08.00 sudah bangun. manis sekali kopi ini, gula mahal ya? (rajin benar = malas sekali) (manis sekali = pahit sekali)","p":62},{"t":"Ironi Dramatik","d":"Ironi yang terjadi ketika penonton atau pembaca mengetahui sesuatu yang tidak diketahui oleh tokoh dalam cerita.","c":"Penonton tahu tokoh akan tertipu, sementara tokoh itu sendiri tidak menyadarinya.","p":62},{"t":"Ironi Situasi","d":"Ironi yang muncul dari pertentangan antara harapan dan kenyataan yang terjadi dalam suatu peristiwa.","c":"Seorang pemadam kebakaran yang rumahnya sendiri terbakar.","p":63},{"t":"Ironi Verbal","d":"Ironi yang terjadi ketika ucapan seseorang bermakna kebalikan dari yang sebenarnya dimaksud.","c":"'Bagus sekali pekerjaanmu!' diucapkan saat pekerjaan itu sebenarnya berantakan.","p":63},{"t":"Isotopi","d":"Konsistensi makna yang diciptakan oleh pengulangan unsur-unsur semantik serupa dalam teks.","c":"","p":63},{"t":"Jalinan Cerita","d":"Cara unsur-unsur cerita disambungkan dan dirajut menjadi kesatuan yang utuh.","c":"","p":64},{"t":"Jalur Cerita","d":"Garis pergerakan alur dari awal hingga akhir dalam sebuah narasi.","c":"","p":64},{"t":"Jargon Sastra","d":"Istilah khusus yang digunakan dalam bidang kesusastraan, kadang tidak dipahami masyarakat umum.","c":"Istilah 'intrinsik' dan 'ekstrinsik' yang lazim digunakan dalam kajian sastra.","p":64},{"t":"Jeda","d":"Hentian suara yang menandai batas bagian-bagian kalimat.","c":"Dahulu parang / sekarang besi Dahulu sayang / sekarang benci (Di antara kata parang dan sekarang, sayang dan sekarang terdapat jeda).","p":64},{"t":"Jeda Naratif","d":"Momen dalam narasi ketika waktu cerita seakan berhenti karena narator menyisipkan deskripsi atau komentar panjang di luar alur peristiwa.","c":"","p":64},{"t":"Jenaka","d":"Bersifat lucu atau menggelikan; kerap menjadi corak dalam cerita atau pantun tertentu.","c":"Pantun jenaka yang mengundang tawa pendengarnya karena isinya lucu.","p":64},{"t":"Jenis Sastra","d":"Pengelompokan karya sastra berdasarkan bentuknya, seperti prosa, puisi, dan drama.","c":"Novel, cerpen, dan puisi merupakan beberapa jenis sastra tulis.","p":64},{"t":"Jiplakan","d":"Karya sastra yang hasil \"curian\" dari karya orang lain; atau karya oarng lain yang diakui sebagai karya sendiri; disebut juga: plagiat, sedang orang yang melakukan perbuatan \"mencuri\" karangan orang lain disebut \"plagiator\".","c":"","p":64},{"t":"Judul Karya","d":"Nama yang diberikan pengarang untuk mengidentifikasi dan mencerminkan isi suatu karya sastra.","c":"Sebuah judul novel yang dipilih untuk mencerminkan tema utama ceritanya.","p":65},{"t":"Jurnal Sastra","d":"Media publikasi berkala yang memuat karya sastra atau kajian mengenai sastra.","c":"Majalah sastra yang memuat puisi, cerpen, dan esai kritik sastra.","p":65},{"t":"Jurnalisme Sastra","d":"Penulisan berita atau laporan dengan teknik dan gaya bahasa sastra.","c":"Reportase panjang yang ditulis dengan gaya naratif seperti cerpen.","p":65},{"t":"Juru Cerita","d":"Orang yang bertugas menuturkan atau membawakan sebuah cerita, terutama dalam tradisi lisan.","c":"Dalang yang menuturkan kisah pewayangan dalam pertunjukan semalam suntuk.","p":65},{"t":"Juru Dongeng","d":"Orang yang bertugas atau piawai menuturkan dongeng dalam tradisi lisan.","c":"Kakek yang menuturkan kisah rakyat kepada cucu-cucunya sebelum tidur.","p":65},{"t":"Juru Pantun","d":"Orang yang mahir dan biasa membawakan pantun dalam tradisi lisan masyarakat Melayu.","c":"Orang tua yang biasa berbalas pantun dalam acara pernikahan adat Melayu.","p":65},{"t":"Kaba","d":"Cerita rakyat Minangkabau yang berbentuk prosa bersajak dan biasanya dinyanyikan.","c":"","p":66},{"t":"Kadens","d":"Pola naik turunnya nada suara pada akhir baris puisi yang memberi kesan selesai atau menggantung.","c":"","p":66},{"t":"Kaidah Sastra","d":"Aturan atau konvensi yang mengatur bentuk dan penciptaan suatu jenis karya sastra.","c":"Aturan jumlah baris dan rima yang harus dipatuhi dalam penulisan pantun.","p":66},{"t":"Kajian Budaya","d":"Pendekatan interdisipliner yang mengkaji karya sastra sebagai bagian dari praktik budaya, kekuasaan, dan ideologi masyarakat.","c":"","p":66},{"t":"Kajian Pascakolonial","d":"Pendekatan kritik yang menelaah dampak kolonialisme terhadap identitas, bahasa, dan budaya yang tercermin dalam karya sastra bekas negara jajahan.","c":"","p":66},{"t":"Kakawin","d":"Puisi Jawa Kuno berbahasa Kawi yang terikat aturan metrum (guru laghu) yang berasal dari tradisi India.","c":"Kakawin Ramayana.","p":66},{"t":"Kaki Puisi","d":"Satuan dasar irama dalam metrum puisi yang terdiri atas kombinasi suku kata bertekanan dan tak bertekanan.","c":"","p":66},{"t":"Kakofoni","d":"Perpaduan bunyi yang terdengar tidak enak atau kasar di telinga, sering sengaja digunakan penyair untuk menimbulkan efek tertentu; kebalikan dari eufoni.","c":"","p":66},{"t":"Kanon Sastra","d":"Kumpulan karya sastra yang dianggap penting dan berpengaruh oleh suatu tradisi keilmuan sehingga dijadikan rujukan atau bahan ajar utama.","c":"","p":66},{"t":"Kanonisasi Sastra","d":"Proses suatu karya sastra diakui dan ditetapkan sebagai bagian penting dalam kanon oleh institusi pendidikan, kritikus, atau sejarah sastra.","c":"","p":67},{"t":"Karakter Bulat","d":"Tokoh yang memiliki kepribadian kompleks, berlapis, dan mengalami perkembangan dalam cerita.","c":"","p":67},{"t":"Karakter Datar","d":"Tokoh yang memiliki satu atau dua sifat dominan yang tidak berubah sepanjang cerita.","c":"","p":67},{"t":"Karikatur","d":"Gambaran yang pada umumnya terdapat dalam komedi yang mengejek seseorang atau sesuatu hal dengan cara melebih-lebihkan sifatnya yang aneh atau kekurangan-kekurangannya.","c":"","p":67},{"t":"Karikatural","d":"Bersifat karikatur; menggambarkan sesuatu dengan cara yang melebih-lebihkan untuk efek komis atau satiris.","c":"","p":67},{"t":"Karmina","d":"Pantun kilat, pantun dua seuntai: pantun yang hanya terdiri dari dua baris atau terdiri dari empat baris yang pendek-pendek.","c":"Dahulu parang sekarang besi Dahulu sayang sekarang benci Dahulu parang Sekarang besi Dahulu sayang Sekarang benci atau","p":67},{"t":"Karnavalisasi","d":"Konsep Bakhtin tentang pembalikan tatanan sosial dan norma yang serius menjadi jenaka dan bebas di dalam karya sastra, meniru suasana pesta karnaval rakyat.","c":"","p":67},{"t":"Kata Abstrak","d":"Kata yang menyatakan konsep atau gagasan yang tidak dapat ditangkap oleh indera.","c":"","p":67},{"t":"Kata Khusus","d":"Kata yang maknanya sempit dan terbatas pada bidang, tempat, waktu, atau kondisi tertentu; lawan dari kata umum. Dalam kamus sastra, istilah seperti anafora, soneta, deiksis, dan epistolari merupakan kata khusus bidang sastra yang tidak digunakan dalam percakapan sehari-hari.","c":"\"Metafora\" (khusus bidang sastra), \"stetoskop\" (khusus bidang kedokteran), \"debit\" (khusus bidang keuangan).","p":67},{"t":"Kata Konkret","d":"Kata yang menyatakan sesuatu yang dapat ditangkap oleh indera secara langsung.","c":"","p":68},{"t":"Kata Serapan","d":"Kata yang berasal dari bahasa asing dan telah disesuaikan dengan ejaan serta pengucapan bahasa Indonesia. Dalam sastra, banyak istilah yang merupakan kata serapan, menunjukkan pengaruh budaya atau aliran pemikiran asing yang masuk ke dalam khazanah sastra Indonesia.","c":"\"drama\" (dari bahasa Yunani drao); \"soneta\" (dari bahasa Italia sonetto); \"epik\" (dari bahasa Yunani epikos); \"novel\" (dari bahasa Inggris via Belanda roman); \"sarkasme\" (dari bahasa Yunani sarkasmos); \"epistolari\" (dari bahasa Inggris epistolary via Latin epistola).","p":68},{"t":"Kata Umum","d":"Kata yang maknanya luas dan mencakup banyak hal; tidak terbatas pada bidang, tempat, atau waktu tertentu. Lawan dari kata khusus. Kata umum dapat digunakan dalam berbagai konteks, termasuk dalam pembahasan sastra secara umum.","c":"\"barang\", \"pergi\", \"makan\", \"kata\", \"cerita\", \"buku\", \"membaca\".","p":68},{"t":"Katarsis","d":"Efek pelepasan emosi yang dialami penonton atau pembaca setelah menyaksikan atau membaca karya tragedi.","c":"Perasaan lega dan terharu penonton setelah menyaksikan sebuah drama tragedi klasik.","p":68},{"t":"Katastrof","d":"Istilah dalam tragedi, yaitu peristiwa akhir yang dialami tokoh utama yang kurang menguntungkan.","c":"","p":68},{"t":"Kearifan Lokal dalam Sastra","d":"Nilai, pengetahuan, dan pandangan hidup khas suatu masyarakat yang direfleksikan melalui karya sastra daerah.","c":"","p":68},{"t":"Kepadatan Makna","d":"Ciri bahasa puisi yang mengungkapkan gagasan secara ringkas namun kaya akan lapisan makna dan asosiasi.","c":"","p":68},{"t":"Kesepadanan Dinamis","d":"Prinsip penerjemahan yang mengutamakan kesamaan efek dan makna bagi pembaca sasaran dibandingkan kesamaan bentuk kata demi kata.","c":"","p":68},{"t":"Kesusastraan Jawa Kuno","d":"Karya sastra berbahasa Jawa Kuno yang berkembang pada masa kerajaan Hindu-Buddha di Nusantara, seperti kakawin dan kidung.","c":"","p":69},{"t":"Ketoprak","d":"Teater tradisional Jawa Tengah yang mengangkat cerita legenda atau babad kerajaan Jawa dengan iringan gamelan.","c":"Pertunjukan Ketoprak mengisahkan babad Majapahit.","p":69},{"t":"Kewajaran Cerita","d":"Kesan bahwa peristiwa dalam cerita masuk akal dan dapat dipercaya dalam logika dunia rekaan yang dibangunnya sendiri.","c":"","p":69},{"t":"Kiasan","d":"Ungkapan yang tidak menyatakan makna sebenarnya, melainkan menggunakan perbandingan untuk memperindah bahasa.","c":"'Buah tangan' berarti oleh-oleh, bukan buah yang dipegang tangan.","p":69},{"t":"Kiasmus","d":"Gaya bahasa yang menyusun dua frasa dengan struktur yang saling berbalikan untuk penekanan makna.","c":"'Bukan aku yang mencari harta, harta yang mencari aku.'","p":69},{"t":"Kidung","d":"Puisi Jawa Pertengahan berbahasa Jawa Tengahan dengan metrum tersendiri, berbeda dari kakawin.","c":"Kidung Sunda.","p":69},{"t":"Kisah","d":"Dalam Sastra Lama = cerita tentang perjalanan seseorang. Dalam Sastra Modern = cerita.","c":"kisah Pelayaran Abdullah dari Singapura ke Kelantan (karya Abdullah bin Abdul Kadir Munsyi). Contoh: kisah Sebuah Celana Pendek (karya Idrus).","p":69},{"t":"Kisah Perjalanan","d":"Karya sastra yang menceritakan pengalaman pengarang dalam melakukan perjalanan ke suatu tempat.","c":"","p":69},{"t":"Klimaks","d":"Gaya bahasa yang menyatakan beberapa hal berturut-turut makin lama makin mengeras, menanjak, dan memuncak.","c":"Jangankan sepuluh ribu, lima puluh ribu, seratus ribu akan kubeli juga jika aku suka. Rakyat berkata, berseru, berteriak minta dibebaskan dari kemiskinan","p":70},{"t":"Klise","d":"Ungkapan atau gambaran yang sudah terlalu sering digunakan sehingga kehilangan kekuatan dan kesegaran.","c":"","p":70},{"t":"Klise, Bahasa Klise","d":"Bahasa tiruan yang selalu digunakan berulang-ulang sehingga tidak mempunyai kemampuan lagi untuk membangkitkan imajinasi pembaca atau pendengar, tidak mampu membangkitkan keindahan, keharuan, atau tidak memiliki gaya getar jiwa.","c":"lukisan tentang kecantikan gadis atau wanita menurut sastrawan lama sebagai berikut. (Tifa Penyair dan Daerahnya: halaman 116) Badannya ramping sebagai pohon pinang; Rambutnya sebagai mayang terurai; Mukanya berseri bagai bulan 14 hari; Alisnya sebagai bentuk taji; Hidungnya mancung bagai bunga melur; Matanya bagai bintang timur; Telinganya bagai karang; Mulutnya bagai delima merekah; Giginya bagai dua barisan mutiara; Dagunya bagai lebah bergantung; Jarinya bagai duri landak; Pepat kukunya bagai bulan 3 hari; Pahanya bagai paha belalang; Betisnya bagai perut padi; Tumitnya bagai telur burung..............","p":70},{"t":"Koda","d":"Bagian penutup pada pantun atau cerita yang berisi kesimpulan atau moral; juga bagian akhir soneta.","c":"","p":70},{"t":"Koda (cauda, coda)","d":"Baris tambahan puisi.","c":"koda pada sonata karya M. Yamin. Untuk Tini Kasuma-St. Takdir SUNGGUHKAH? Sungguhkah benar hamba termenung Hijau barisan di hati pun lekat Berbukit-bukit gunung-gemunung Diselimuti awan jauh dan dekat? Sungguhkah benar di jantung terkandung Lautan berombak berpangkat-pangkat Mengejar pantai tanahku-indung Berbuih putih intan terikat? Sungguh begitu dahulu kupandang Waktu badanku suka dan riang Bermain di pantai, di gunung padang Tetapi sekarang walaupun muda Alam begitu hilang dimata Cuma rasakan di dalam dada. .. . . . . . Mbungan (cauda) Bukit barisan kupandang kabur Terlukis di awang awan-gemawan Berkaki laut debur mendebur Merdu bunyinya rindu dan rawan: Gulung gemulung suara malam Ombak ke pasir derai-berderai Desir-mendesir di hari kelam Memuji pulauku sorak-semarai Semuanya itu nyaring kudengar Memanggil badan tulang-belulang Masuk ke dada di jantung tergambar Supaya kembali lekaslah pulang Aduhai diriku sepantun burung Mata lepas badan terkurung. (s'Land gevangenis en Huis van Bewaring Surabaya hari Ahad, 14 Mei 1933).","p":71},{"t":"Kodikologi","d":"Ilmu yang mempelajari aspek fisik naskah kuno, seperti bahan, tinta, dan cara penjilidan, untuk mengungkap sejarah naskah tersebut.","c":"","p":71},{"t":"Koherensi","d":"Keterpaduan makna antarbagian dalam sebuah karya sastra sehingga membentuk kesatuan yang utuh.","c":"","p":71},{"t":"Koherensi Teks","d":"Keterkaitan makna atau alur pikiran antarbagian teks sehingga wacana terasa padu dan logis.","c":"","p":71},{"t":"Kohesi","d":"Keterpaduan bentuk atau unsur-unsur bahasa dalam teks yang menciptakan kesinambungan.","c":"","p":71},{"t":"Kohesi Teks","d":"Keterkaitan bentuk antarunsur bahasa dalam sebuah teks, misalnya melalui kata ganti, konjungsi, dan pengulangan kata.","c":"","p":71},{"t":"Kolofon","d":"Catatan pada bagian akhir naskah kuno yang memuat informasi tentang penulis, waktu, atau tempat penyalinan naskah.","c":"","p":71},{"t":"Kolokasi","d":"Kecenderungan sebuah kata untuk berdampingan dengan kata tertentu dalam penggunaan bahasa.","c":"Kata 'deras' lazim berdampingan dengan 'hujan', bukan dengan 'angin'.","p":72},{"t":"Kolokial","d":"Ragam bahasa percakapan sehari-hari yang bersifat santai dan tidak resmi, sering digunakan dalam dialog tokoh cerita.","c":"","p":72},{"t":"Kolom Sastra","d":"Ruang tetap di media cetak atau daring yang secara berkala memuat karya atau ulasan sastra.","c":"","p":72},{"t":"Komedi","d":"Drama yang menonjolkan kelucuan-kelucuan yang terjadi dalam kehidupan. Komedi bertujuan membawa penonton dalam suasana riang gembira, di samping itu sering dipergunakan untuk menyindir orang atau masyarakat. Pemain komedi harus dapat menarik penonton untuk tertawa.","c":"","p":72},{"t":"Komedi Situasi","d":"Komedi yang kelucuannya timbul dari situasi atau keadaan yang dialami tokoh, bukan dari dialog semata.","c":"Tokoh yang salah masuk kamar hotel dan menimbulkan kekacauan lucu.","p":72},{"t":"Komisi Bacaan Rakyat","d":"Lembaga yang didirikan pemerintah kolonial Belanda untuk menyediakan bahan bacaan bagi rakyat Indonesia; cikal bakal Balai Pustaka.","c":"","p":72},{"t":"Komisi Bacaan Rakyat (Commissie Voor de Volkslectuur)","d":"Komisi yang didirikan oleh pemerintah Belanda pada tahun 1908 dan terdiri dari 6 orang diketahui oleh Dr.G.A.J. Hazeu. Komisi ini berkewajiban memilih karangan -karangan yang baik untuk digunakan di sekolah-sekolah dan dijadikan bacaan rakyat. Pada tahun 1917 Komisi Bacaan Rakyat menjelma menjadi Balai Pustaka Lihat:Balai Pustaka","c":"","p":72},{"t":"Komplikasi","d":"Bagian struktur teks naratif yang berisi rangkaian peristiwa yang menimbulkan konflik atau masalah.","c":"Bagian cerita saat tokoh mulai menghadapi rintangan.","p":72},{"t":"Komunitas Sastra","d":"Perkumpulan penulis, pembaca, atau pemerhati sastra yang secara rutin mengadakan kegiatan diskusi, pembacaan, dan pelatihan menulis.","c":"","p":73},{"t":"Konflik","d":"Pertandingan yang terjadi dalam drama yang disebabkan oleh perbedaan pendirian atau sikap.","c":"","p":73},{"t":"Konflik Batin","d":"Pertentangan yang terjadi dalam diri tokoh sendiri antara dua dorongan atau nilai yang bertentangan.","c":"","p":73},{"t":"Konflik Eksternal","d":"Pertentangan yang terjadi antara tokoh dengan kekuatan di luar dirinya, seperti tokoh lain, masyarakat, atau alam.","c":"","p":73},{"t":"Konflik Fisik","d":"Jenis konflik berupa pertentangan fisik/benturan tindakan, baik antar tokoh maupun tokoh dengan alam.","c":"Perkelahian antara dua tokoh dalam cerita.","p":73},{"t":"Konflik Ide","d":"Jenis konflik berupa pertentangan gagasan, pandangan, atau prinsip antar tokoh.","c":"Perdebatan pendapat antara dua tokoh mengenai suatu keputusan.","p":73},{"t":"Konflik Internal","d":"Pertentangan yang berlangsung dalam batin atau pikiran tokoh itu sendiri; sama dengan konflik batin.","c":"","p":73},{"t":"Konflik Sosial","d":"Pertentangan yang timbul akibat perbedaan kelas, nilai, atau kepentingan dalam masyarakat.","c":"","p":73},{"t":"Konotasi","d":"Makna kata yang telah memperoleh tambahan nilai rasa tertentu, bandingkan dengan denotasi.","c":"","p":73},{"t":"Konsepsi Karya","d":"Gagasan atau ide awal yang menjadi landasan penciptaan sebuah karya sastra.","c":"","p":73},{"t":"Konsonansi","d":"Pengulangan bunyi konsonan yang sama dalam larik puisi untuk menciptakan efek musikal.","c":"Pengulangan bunyi 'ng' pada larik 'burung terbang melayang tenang'.","p":74},{"t":"Konteks Budaya","d":"Latar belakang kebudayaan yang melingkupi penciptaan dan pemaknaan karya sastra.","c":"","p":74},{"t":"Konteks Historis","d":"Latar belakang sejarah yang melingkupi penciptaan karya sastra.","c":"","p":74},{"t":"Konteks Naratif","d":"Situasi dan kondisi yang melingkupi jalannya cerita dan mempengaruhi makna peristiwa dalam narasi.","c":"","p":74},{"t":"Konteks Pragmatik","d":"Situasi atau keadaan di sekitar ujaran yang memengaruhi makna suatu tuturan dalam karya sastra.","c":"Ucapan 'Sudah malam' bisa bermakna ajakan pulang tergantung situasinya.","p":74},{"t":"Konteks Sosial","d":"Kondisi kehidupan masyarakat yang menjadi latar belakang dan mempengaruhi karya sastra.","c":"","p":74},{"t":"Konteks Teks","d":"Keseluruhan unsur dalam teks yang mengelilingi dan mempengaruhi makna sebuah bagian tertentu.","c":"","p":74},{"t":"Kontradiksi Dramatik","d":"Pertentangan yang muncul antara harapan tokoh dan kenyataan yang dihadapinya dalam alur cerita.","c":"Tokoh yang ingin damai namun terus terseret dalam pertikaian.","p":74},{"t":"Korelatif Objektif","d":"Istilah T.S. Eliot untuk rangkaian benda, situasi, atau peristiwa konkret yang dipakai pengarang untuk membangkitkan emosi tertentu pada pembaca tanpa menyebutnya secara langsung.","c":"","p":74},{"t":"Korpus Sastra","d":"Kumpulan teks sastra yang dijadikan objek kajian dalam penelitian.","c":"Kumpulan seratus cerpen Indonesia yang dijadikan bahan penelitian gaya bahasa.","p":74},{"t":"Kosakata Puitik","d":"Perbendaharaan kata yang khas digunakan dalam penulisan puisi untuk mencapai efek estetis.","c":"Kata 'rembulan', 'kalbu', dan 'rindu' yang sering muncul dalam puisi lama.","p":75},{"t":"Kramagung","d":"Petunjuk teknis atau petunjuk laku dalam naskah drama yang menerangkan tindakan/ekspresi tokoh, biasanya ditulis di dalam tanda kurung.","c":"\"(Ia berjalan mondar-mandir sambil menangis)\".","p":75},{"t":"Krisis","d":"Suatu saat tertentu dalam drama yang mengharuskan tokoh-tokoh inti menentukan sikap, mengambil keputusan.","c":"","p":75},{"t":"Kritik Ekspresif","d":"Pendekatan kritik sastra yang berfokus pada hubungan karya dengan pengarangnya.","c":"","p":75},{"t":"Kritik Feminis","d":"Pendekatan kritik sastra yang menyoroti representasi perempuan dan isu gender dalam karya sastra.","c":"Analisis terhadap penggambaran perempuan sebagai korban dalam novel-novel lama.","p":75},{"t":"Kritik Genetik","d":"Kajian yang menelusuri proses penciptaan karya sastra melalui naskah, draf, dan revisi pengarang sebelum menjadi teks final.","c":"","p":75},{"t":"Kritik Historis","d":"Pendekatan kritik sastra yang menilai karya berdasarkan konteks sejarah penciptaannya.","c":"Penilaian novel perjuangan berdasarkan situasi politik saat karya itu ditulis.","p":75},{"t":"Kritik Marxis","d":"Pendekatan kritik sastra yang menyoroti hubungan kelas sosial dan ekonomi dalam karya sastra.","c":"Analisis novel yang menyoroti eksploitasi buruh oleh pemilik modal.","p":75},{"t":"Kritik Mimetik","d":"Pendekatan kritik sastra yang menilai karya berdasarkan kemampuannya meniru atau mencerminkan kenyataan.","c":"","p":76},{"t":"Kritik Objektif","d":"Pendekatan kritik sastra yang berfokus pada teks itu sendiri tanpa mempertimbangkan pengarang atau konteks eksternal.","c":"","p":76},{"t":"Kritik Pragmatik","d":"Pendekatan kritik sastra yang mempertimbangkan efek karya pada pembaca.","c":"","p":76},{"t":"Kritik Psikoanalisis","d":"Pendekatan kritik sastra yang menelaah karya melalui teori psikologi, terutama kondisi kejiwaan tokoh atau pengarang.","c":"Analisis konflik batin tokoh utama berdasarkan teori kejiwaan.","p":76},{"t":"Kritik Psikologi Sastra","d":"Pendekatan kajian yang menelaah aspek kejiwaan tokoh, pengarang, atau proses kreatif penciptaan karya sastra.","c":"","p":76},{"t":"Kritik Queer","d":"Pendekatan kritik sastra yang menyoroti representasi identitas dan orientasi seksual non-normatif dalam karya sastra.","c":"","p":76},{"t":"Kritik Sastra","d":"Pembahasan tentang suatu hasil sastra secara objektif, dalam kritik dikemukakan keungulan maupun kekurangan suatu karya sastra disertai anjuran bagaimana usaha menutup kekurangan tersebut.","c":"","p":76},{"t":"Kritik Sastra Feminis","d":"Pendekatan kritik yang membaca dan menilai karya sastra dari perspektif kesetaraan gender serta menyoroti representasi perempuan di dalamnya.","c":"","p":76},{"t":"Kritik Subjektif","d":"Pendekatan kritik sastra yang sangat dipengaruhi oleh selera dan penilaian pribadi kritikus.","c":"","p":76},{"t":"Kritik Teks","d":"Metode kajian filologi yang membandingkan berbagai salinan naskah untuk merekonstruksi bentuk teks yang paling otentik.","c":"","p":76},{"t":"Kritikus Sastra","d":"Orang yang melakukan kajian dan penilaian terhadap karya sastra secara sistematis. H.B. Jassin dijuluki 'Paus Sastra Indonesia' karena perannya sebagai kritikus sastra yang dominan.","c":"","p":76},{"t":"Kronologi","d":"Urutan peristiwa berdasarkan waktu terjadinya dari yang paling awal hingga paling akhir.","c":"","p":77},{"t":"Kronotop","d":"Konsep Bakhtin tentang keterjalinan ruang dan waktu yang membentuk citra dunia tertentu di dalam sebuah karya naratif.","c":"","p":77},{"t":"Kuatrain","d":"Bait puisi yang terdiri dari empat baris.","c":"Bait pantun pada umumnya yang terdiri dari empat baris.","p":77},{"t":"Kuatren","d":"Puisi empat baris seuntai. BERDIRI AKU Berdiri aku di senja senyap Camar melayang menepis buih Melayah bakau mengurai puncak Berjulang datang ubur terkembang Angin pulang menyejuk bumi Menepuk teluk mengempas emas Lari ke gunung memuncak sunyi Berayun alun di atas alas. . . . . . ... . . . . . . . . ... . . . . . . . . . . . . (Amir Hamzah) Contoh (kutipan puisi \"Kucari Jawab\"): Di mata air, di dasar kolam, Kucari jawab teka-teki alam, Di kawan awan kian kemari, Di situ juga jawabnya kucari Di warna bunga yang kembang, Kubaca jawab, penghilang bimbang. Oleh: Y.E. Tatengkeng Dari: Puisi Baru","c":"","p":77},{"t":"Kuin","d":"Puisi lima baris seuntai. MADAH KEMENANGAN Jiwaku bergetar, peluh Berenaian sekujur tubuh Badanku lemas, mata tiada terpicing, Tapi sukma naik menarik madah kemenangan Mendengar senjata budi dasyat berdencing. Bisikan engkau, jahanam, Senyum nan mengorak, Pandangan nan lembut tajam, Tiada kuasa mengubahku di dalam, Tinggi nilainya jiwaku sekarang. Laksana embun di pagi hari, Jiwaku jernih, Terang mengintai cuaca, Menggetarkan kalbu, Berteteskan mutia dan suci-putih. . . . . . . . . . . . . . . . . . . . . . . .. . . . . . . . . ... ...... (Aoh Kartahadimadja)","c":"","p":77},{"t":"Kuint","d":"Bait puisi yang terdiri dari lima baris.","c":"Bait puisi lama tertentu yang tersusun atas lima baris.","p":77},{"t":"Kuplet","d":"Dua baris puisi berurutan yang biasanya berima dan membentuk satu kesatuan makna.","c":"'Ke pasar membeli baju / Baju indah berwarna biru' merupakan dua baris berima.","p":77},{"t":"L'art pour l'art","d":"Ungkapan Perancis yang berarti 'seni demi seni'; pandangan yang menyatakan bahwa seni tidak perlu memiliki tujuan di luar seni itu sendiri. Semboyan golongan sastrawan yang berpendapat bahwa seni diciptakan berdasarkan ilham yang suci dan murni, serta tidak terikat tujuan apa pun selain untuk dirasakan, diresapi, dan dinikmati.","c":"","p":78},{"t":"Lakon","d":"Cerita atau naskah drama yang dipentaskan; rangkaian peristiwa dalam sebuah pertunjukan.","c":"","p":78},{"t":"Laku Dramatik","d":"Tindakan atau peristiwa dalam drama yang menggerakkan cerita dan mengungkapkan karakter tokoh.","c":"","p":78},{"t":"Lakuna Naratif","d":"Kekosongan atau celah informasi dalam alur cerita yang sengaja ditinggalkan pengarang untuk diisi tafsiran pembaca.","c":"Cerita yang tidak menjelaskan alasan kepergian tokoh, dibiarkan menjadi tafsiran pembaca.","p":78},{"t":"Lambang","d":"Sesuatu yang mewakili atau menggantikan makna lain berdasarkan kesepakatan atau konvensi tertentu dalam karya sastra.","c":"Warna putih yang melambangkan kesucian dalam banyak karya sastra.","p":78},{"t":"Larik","d":"Baris dalam puisi.","c":"","p":78},{"t":"Larik Bebas","d":"Baris puisi yang tidak terikat oleh pola jumlah suku kata, rima, atau irama tertentu, umum ditemukan dalam puisi bebas modern.","c":"","p":78},{"t":"Latar","d":"Tempat, waktu, dan suasana terjadinya peristiwa dalam karya sastra.","c":"","p":78},{"t":"Latar = setting","d":"Tempat atau waktu terjadinya cerita dalam karya sastra.","c":"","p":78},{"t":"Latar Budaya","d":"Tradisi, adat istiadat, dan nilai-nilai kebudayaan yang melingkupi cerita.","c":"","p":78},{"t":"Latar Historis","d":"Konteks sejarah yang menjadi latar belakang terjadinya peristiwa dalam karya sastra.","c":"","p":79},{"t":"Latar Naratif","d":"Keseluruhan latar yang dibangun dalam narasi untuk menciptakan dunia cerita yang konkret.","c":"","p":79},{"t":"Latar Psikologis","d":"Kondisi kejiwaan dan suasana batin yang melatarbelakangi perilaku tokoh.","c":"","p":79},{"t":"Latar Simbolik","d":"Latar yang dipilih pengarang bukan sekadar sebagai tempat kejadian, tetapi mengandung makna kiasan yang mendukung tema cerita.","c":"","p":79},{"t":"Latar Sosial","d":"Kondisi kehidupan masyarakat yang menjadi lingkungan tokoh dan cerita.","c":"","p":79},{"t":"Latar Suasana","d":"Latar yang menggambarkan suasana batin atau kondisi emosional yang melingkupi peristiwa dalam cerita.","c":"Suasana mencekam saat malam badai.","p":79},{"t":"Latar Tempat","d":"Latar yang menunjukkan lokasi terjadinya peristiwa dalam cerita.","c":"Peristiwa terjadi di sebuah desa kecil.","p":79},{"t":"Latar Waktu","d":"Latar yang menunjukkan kapan (waktu) peristiwa dalam cerita berlangsung.","c":"Cerita berlatar pada masa penjajahan Belanda.","p":79},{"t":"Legenda","d":"Dongeng yang menghubung-hubungkan peristiwa sejarah dengan keanehan atau keajaiban alam, biasanya menceritakan tentang asal-usul terjadinya sesuatu.","c":"- terjadinya Rawa Pening. - cerita Gunung Tangkuban Perahu.","p":79},{"t":"Lekra","d":"Lembaga Kebudayaan Rakyat, organisasi kebudayaan yang menaungi sastrawan beraliran realisme sosialis di Indonesia pada era 1950-1960-an.","c":"","p":79},{"t":"Leksikon Sastra","d":"Perbendaharaan kata yang berkaitan dengan bidang kesusastraan.","c":"Kumpulan kata seperti 'alur', 'tema', dan 'amanat' yang khas dalam bidang sastra.","p":80},{"t":"Lelucon","d":"Cerita atau ucapan singkat yang bertujuan menimbulkan tawa.","c":"Cerita rakyat tentang tokoh jenaka yang kisahnya selalu berakhir dengan tawa.","p":80},{"t":"Lenong","d":"Teater tradisional Betawi yang diiringi musik gambang kromong, bertema kehidupan rakyat Betawi.","c":"Pertunjukan Lenong di Jakarta.","p":80},{"t":"Licencia-poetica","d":"Kebebasan yang dimiliki oleh penyair dalam menciptakan puisi.","c":"Lambaian putri manakah engkau ikuti kalau kau 'benam Sungguh berat rasa berpisah (dari \"Buah Tangan\" oleh Y.E. Tatengkeng) Ninggalkan kekasih berusuh hati (dari \"Berpisah\" oleh Fatimah H. Delais) Kata 'benam maksudnya terbenam, ninggalkan maksudnya meninggalkan.","p":80},{"t":"Licentia Poetica","d":"Kebebasan penyair untuk menyimpang dari aturan tata bahasa atau konvensi demi tujuan estetis.","c":"","p":80},{"t":"Lilotes","d":"Gaya bahasa yang menggunakan kata yang berlawanan artinya dengan yang dimaksud, untuk merendahkan diri.","c":"Jika ada waktu silakan mampir ke gubuk kami. Apa yang saya lakukan hanyalah merupakan titik air di samudra yang luas.","p":80},{"t":"Lirik(s)","d":"Karangan yang melukiskan sesuatu secara subjektifkarena menyertakan perasaan pengarang serta bertujuan menimbulkan rasa haru di hati pembaca.","c":"Romance, Ode, Himne, Elegi, Sonata.","p":80},{"t":"Liris","d":"Bersifat mengungkapkan perasaan pribadi secara mendalam, biasa terdapat dalam puisi lirik.","c":"Puisi yang mengungkapkan kerinduan mendalam penyair kepada kampung halaman.","p":80},{"t":"Lirisisme","d":"Kecenderungan gaya penulisan yang menonjolkan curahan perasaan secara subjektif dan mendalam.","c":"Gaya penulisan penyair klasik yang penuh curahan perasaan pribadi.","p":81},{"t":"Litani","d":"Doa atau puisi yang menggunakan pengulangan secara berseri, biasanya dalam bentuk permohonan.","c":"","p":81},{"t":"Litotes","d":"Majas yang mengecilkan atau merendahkan sesuatu yang sesungguhnya besar atau penting.","c":"","p":81},{"t":"Longser","d":"Teater tradisional Sunda yang memadukan lawakan, tari, dan nyanyian.","c":"Pertunjukan Longser di Jawa Barat.","p":81},{"t":"Ludruk","d":"Teater tradisional Jawa Timur (Surabaya) yang mengangkat kehidupan rakyat sehari-hari, diperankan oleh laki-laki termasuk peran perempuan.","c":"Pertunjukan Ludruk di Surabaya.","p":81},{"t":"Majas","d":"Kiasan: pemakaian kata dengan makna kiasan. Gaya bahasa:- perbandingan (metafora, dsb). - penegasan (pleonasme, repetisi, tologi, dsb). - pertentangan (paradoks, antithesis, dsb). - sindiran (ironi, sinisme, sarkasme).","c":"","p":82},{"t":"Majas Perbandingan","d":"Kelompok gaya bahasa yang menyamakan atau membandingkan dua hal, seperti metafora dan simile.","c":"'Wajahnya bagai bulan purnama' merupakan simile, salah satu majas perbandingan.","p":82},{"t":"Majas Sindiran","d":"Kelompok gaya bahasa yang berisi sindiran atau kritik, seperti ironi dan sarkasme.","c":"Sarkasme dan ironi termasuk dalam kelompok majas sindiran.","p":82},{"t":"Makna Ambigu","d":"Makna yang dapat ditafsirkan lebih dari satu cara sehingga menimbulkan ketaksaan.","c":"'Ia melihat orang itu dengan teropong' dapat ditafsirkan dua cara berbeda.","p":82},{"t":"Makna Denotatif","d":"Makna dasar atau harfiah sebuah kata atau ungkapan.","c":"","p":82},{"t":"Makna Eksplisit","d":"Makna yang dinyatakan secara langsung dan jelas dalam teks.","c":"","p":82},{"t":"Makna Ganda","d":"Teks atau ungkapan yang memiliki lebih dari satu tafsiran yang sah.","c":"","p":82},{"t":"Makna Implisit","d":"Makna yang tidak dinyatakan secara langsung tetapi tersirat dalam teks.","c":"","p":82},{"t":"Makna Konotatif","d":"Makna tambahan atau asosiasi emosional yang melekat pada sebuah kata di luar makna harfiahnya.","c":"","p":82},{"t":"Makna Kontekstual","d":"Makna yang ditentukan oleh konteks penggunaannya dalam teks.","c":"","p":82},{"t":"Makna Literal","d":"Makna harfiah atau sesungguhnya dari sebuah kata atau kalimat; sama dengan makna denotatif.","c":"","p":83},{"t":"Makna Simbolik","d":"Makna yang terkandung dalam simbol-simbol yang digunakan dalam teks sastra.","c":"","p":83},{"t":"Makna Tekstual","d":"Makna yang dapat ditarik langsung dari teks tanpa memerlukan konteks eksternal.","c":"","p":83},{"t":"Makyong","d":"Teater tradisional Melayu (Riau) yang memadukan tari, nyanyian, dan lakon, dipentaskan untuk ritual maupun hiburan.","c":"Pertunjukan Makyong di Kepulauan Riau.","p":83},{"t":"Mamanda","d":"Teater tradisional Kalimantan Selatan (Banjar) yang mengangkat cerita kerajaan dengan dialog berbalas pantun.","c":"Pertunjukan Mamanda di Banjarmasin.","p":83},{"t":"Manifes Kebudayaan","d":"Kami para seniman dan cendekiawan Indonesia dengan ini mengumumkan sebuah Manifes Kebudayaan, yang menyatakan pendirian, cita-cita dan politik kebudayaan Nasional kami. Bagi kami kebudayaan adalah perjuangan untuk menyempurnakan kondisi hidup manusia. Kami tidak mengutamakan salah satu sektor kebudayaan diatas sektor kebudayaan yang lain. Setiap sektor berjuang bersama-sama untuk kebudayaan sesuai dengan kodratnya. Dalam melaksanakan kebudayaan Nasional kami berusaha menciptakan dengan kesungguhan yang sejujur-jujurnya sebagai perjuangan untuk mempertahankan dan mengembangkan martabat diri kami sebagai bangsa Indonesia di tengah masyarakat bangsa-bangsa. Pancasila adalah falsafah kebudayaan kami. Jakarta, 17 Agustus 1963.","c":"","p":83},{"t":"Manifesto Kebudayaan","d":"Pernyataan sikap kelompok sastrawan Indonesia tahun 1963 yang menegaskan kebebasan berkarya di luar garis politik tertentu.","c":"","p":83},{"t":"Mantra","d":"Kata-kata yang mengandung hikmat dan kekuatan ghaib, diucapkan oleh dukun atau pawang, untuk menandingi kekuatan ghaib yang lain. Mantra dianggap sebagai permulaan bentuk puisi lama. MANTRA MENANGKAP BUAYA Hai si Jambu Rakai, sambut pekiriman Puteri Runduk di gunung Ledang, Ambacang masak sebiji bulat, Penyikat tujuh penyikat, Pengarang tujuh pengarang, Diorak dikumbang jangan, Lulur lalu ditelan, Kalau tidak kau sambut, Dua hari, jangan ketiga, Mati mampek, mati mawai, Mati tersadai pangkalan tambang, Kalau kau sambut, Ke darat kau dapat makan, Ke laut kau dapat minum, Aku tahuasal kau jadi, Tanah liat asal kau jadi, Tulang buku tebu asal kau jadi, Darahku gula, dadaku upih, Gigiku tunjang berembang. (dari: Puisi Lama)","c":"","p":84},{"t":"Manuskrip","d":"Naskah tulisan tangan asli sebuah karya sastra sebelum diterbitkan atau dicetak.","c":"Naskah tulisan tangan asli seorang penyair yang disimpan di perpustakaan nasional.","p":84},{"t":"Marginalia","d":"Catatan atau komentar yang dituliskan pembaca di tepi halaman sebuah naskah atau buku sebagai tanggapan pribadi terhadap teks.","c":"","p":84},{"t":"Masnawi","d":"Jenis puisi lama yang berasal dari bahasa Parsi dan Arab. BUDI Didengarlah olehmu, hai yang budiman, Budi itulah sungguh pohon ahsan, Karena ahsan itu putri budilah, Jika lain,maka lain jadilah, Orang yang berbudi itu kayalah, Yang bukan berbudiitu papalah, Jikalau kau dapat arta alam ini, Dan budi kurang padamu disini, Bahwa kesini jua namamu, Dan segala kesini pun adamu, Jika kamu mau menjadi kaya, Mintalah budi padamu cahaya. ............................................................................ (dari: Puisi Lama)","c":"","p":84},{"t":"Matra","d":"Unsur fisik puisi berupa pola irama atau ukuran panjang-pendek dan tinggi-rendah suku kata dalam baris puisi.","c":"Pola irama tetap pada puisi lama seperti syair.","p":84},{"t":"Matriks Naratif","d":"Kerangka dasar yang menjadi struktur pembangun sebuah cerita.","c":"Kerangka dasar konflik-klimaks-penyelesaian yang mendasari sebuah novel.","p":84},{"t":"Melodrama","d":"Drama yang melebih-lebihkan emosi, konflik, dan karakter untuk menciptakan efek sentimentil.","c":"","p":85},{"t":"Memoar","d":"Prosa nonfiksi berisi catatan pengalaman pribadi penulis atas suatu peristiwa atau masa tertentu yang dialaminya, biasanya lebih terfokus dibanding autobiografi.","c":"Memoar seorang aktivis tentang masa perjuangannya.","p":85},{"t":"Mesodiplosis","d":"Majas repetisi berupa pengulangan kata di tengah beberapa baris atau klausa secara berturut-turut.","c":"Pengulangan satu kata yang sama pada posisi tengah tiap baris puisi.","p":85},{"t":"Metafiksi","d":"Karya fiksi yang secara sadar menunjukkan dirinya sebagai sebuah karya fiksi, sering dengan menyisipkan komentar pengarang tentang proses penulisannya.","c":"Novel yang menampilkan tokoh pengarang sedang menulis novel yang sedang dibaca.","p":85},{"t":"Metafora (a)","d":"Gaya bahasa yang memperbandingkan suatu benda dengan benda lain yang mempunyai sifat sama.","c":"- Pemuda adalah bunga bangsa. (pemuda=bunga bangsa) Contoh: -Jangan sampai para remaja menjadi sampah masyarakat. (sampah masyarakat = manusia yang tak berguna)","p":85},{"t":"Metalepsis","d":"Pelanggaran batas antara tingkat penceritaan, misalnya ketika narator atau pengarang seolah masuk ke dalam dunia cerita yang diciptakannya.","c":"","p":85},{"t":"Metatesis","d":"Proses pertukaran letak fonem dalam sebuah kata.","c":"-merah Padma -merah padam -berlutut -bertelut","p":85},{"t":"Metode Analisis","d":"Cara atau prosedur yang digunakan untuk mengkaji dan menafsirkan karya sastra.","c":"","p":85},{"t":"Metode Interpretasi","d":"Cara menafsirkan makna karya sastra berdasarkan pendekatan tertentu.","c":"","p":85},{"t":"Metode Sastra","d":"Prosedur dan teknik yang digunakan dalam penelitian atau pengkajian karya sastra.","c":"","p":86},{"t":"Metode Semiotik","d":"Cara menganalisis karya sastra berdasarkan sistem tanda-tanda yang dikandungnya.","c":"","p":86},{"t":"Metode Struktural","d":"Cara menganalisis karya sastra dengan berfokus pada struktur dan hubungan antarelemen dalam teks.","c":"","p":86},{"t":"Metonimi (a)","d":"Gaya bahasa yang menggunakan kata atau nama yang berasosiasi dengan suatu benda untuk menggantikan benda tersebut.","c":"Adik pergi ke sekolah menggunakan Honda bukan Yamaha. Ayah lebih suka menghisap Djarum daripada Gudang Garam. (Honda, Yamaha: nama sepeda) (Djarum, Gudang garam: nama rokok).","p":86},{"t":"Metonimia","d":"Majas yang menggunakan suatu kata untuk menyebut hal lain yang berkaitan erat dengannya. 'Istana tidak berkomentar' menggunakan 'istana' untuk mewakili pemerintah.","c":"","p":86},{"t":"Metrum Puisi","d":"Pola tetap pergantian suku kata bertekanan dan tak bertekanan yang membentuk irama dalam puisi, terutama dalam tradisi puisi metris.","c":"","p":86},{"t":"Mimesis","d":"Konsep peniruan realitas kehidupan ke dalam karya sastra, sebagaimana dikemukakan Aristoteles.","c":"Penggambaran kehidupan sehari-hari petani secara apa adanya dalam novel realis.","p":86},{"t":"Mise en Abyme","d":"Teknik naratif menyisipkan cerita atau gambar kecil di dalam cerita utama yang mencerminkan atau merangkum keseluruhan cerita itu sendiri.","c":"","p":86},{"t":"Mistikisme/Mistisisme","d":"Aliran dalam kesusastraan yang mengutamakan nafas ketuhanan dalam setiap ciptaan.","c":"Rindu Dendam oleh J.E. Tatengkeng.","p":86},{"t":"Mistisisme","d":"Kepercayaan atau pengalaman tentang hubungan langsung dengan Yang Ilahi atau realitas tertinggi yang melampaui akal.","c":"","p":87},{"t":"Mite","d":"Cerita suci tentang asal-usul alam, dewa-dewi, atau kejadian kosmis yang diyakini kebenarannya oleh suatu komunitas.","c":"","p":87},{"t":"Mitologi","d":"Kumpulan mite atau cerita suci yang membentuk sistem kepercayaan suatu budaya.","c":"","p":87},{"t":"Mitos","d":"Cerita rakyat yang menampilkan tokoh yang luar biasa dalam peristiwa khayal. Kepercayaan yang tidak dapat dibuktikan kebenarannya namun diterima masyarakat.","c":"","p":87},{"t":"Modernisme","d":"Aliran sastra yang menolak konvensi lama dan bereksperimen dengan bentuk serta gaya penulisan baru.","c":"Puisi-puisi yang meninggalkan pola rima tradisional demi kebebasan bentuk.","p":87},{"t":"Monolog","d":"Percakapan seorang diri; dalam drama, monolog adalah ucapan panjang seorang tokoh yang disampaikan sendiri. Monolog Hamlet 'To be or not to be' adalah salah satu monolog paling terkenal dalam sejarah drama.","c":"","p":87},{"t":"Monomit","d":"Pola dasar perjalanan pahlawan yang ditemukan berulang dalam mitos dan cerita di berbagai budaya.","c":"Pola perjalanan pahlawan yang meninggalkan rumah, menghadapi cobaan, lalu kembali membawa perubahan.","p":87},{"t":"Motif Cerita","d":"Unsur atau pola berulang yang menjadi ciri khas dalam suatu cerita atau kumpulan cerita.","c":"Motif pengorbanan yang berulang dalam berbagai cerita rakyat Nusantara.","p":87},{"t":"Motif Naratif","d":"Unsur atau pola berulang, seperti benda, situasi, atau tindakan, yang berulang kali muncul dan membangun makna di dalam sebuah karya.","c":"","p":87},{"t":"Motif Rakyat","d":"Unsur cerita yang berulang dan ditemukan dalam berbagai cerita rakyat di berbagai daerah atau budaya.","c":"Motif anak tiri yang teraniaya, ditemukan dalam berbagai kisah rakyat Nusantara maupun mancanegara.","p":88},{"t":"Motivasi Tokoh","d":"Alasan atau dorongan yang mendasari tindakan dan perilaku tokoh dalam cerita.","c":"","p":88},{"t":"Nada","d":"Unsur batin puisi berupa sikap penyair terhadap pembaca atau pokok persoalan yang diungkapkan, misalnya menggurui, mengejek, atau memohon.","c":"Nada sinis dalam puisi yang mengkritik ketidakadilan sosial.","p":89},{"t":"Nada Puisi","d":"Sikap batin penyair terhadap pembaca yang tersirat dalam pilihan kata dan gaya penyampaian, misalnya nada mengejek atau merenung.","c":"","p":89},{"t":"Nama Samaran (Pseudonim)","d":"Nama lain yang digunakan pengarang sebagai identitas dalam karyanya. Hamka adalah nama samaran dari Haji Abdul Malik Karim Amrullah.","c":"","p":89},{"t":"Nama Samaran = pseudonim","d":"Nama yang tidak sebenarnya yang dipergunakan oleh sastrawan lama dalam hasil karyanya.","c":"HAMKA (Haji Abdul Malik Karim Amrullah) Selaih atau Seleguri (Sariamin) Yogi (A. Rival)","p":89},{"t":"Narasi","d":"Jenis karangan yang menceritakan sesuatu atau beberapa kejadian dan bagaimana berlangsungnya kejadian itu.","c":"","p":89},{"t":"Narasi Bingkai","d":"Struktur cerita yang menempatkan satu kisah di dalam kisah lain, dengan cerita luar berfungsi sebagai bingkai bagi cerita di dalamnya.","c":"","p":89},{"t":"Narasi Linear","d":"Narasi yang menyampaikan peristiwa secara berurutan sesuai waktu terjadinya.","c":"","p":89},{"t":"Narasi Nonlinier","d":"Narasi yang tidak mengikuti urutan waktu lurus, melainkan melompat antara berbagai titik waktu.","c":"","p":89},{"t":"Narasi Puitik","d":"Narasi yang menggunakan bahasa yang puitis dan kaya imajinasi.","c":"","p":89},{"t":"Naratif","d":"Bersifat narasi atau bercerita; berkaitan dengan cara menyampaikan cerita.","c":"","p":89},{"t":"Naratologi","d":"Ilmu yang mempelajari struktur dan cara kerja narasi dalam karya sastra.","c":"Kajian tentang bagaimana sudut pandang memengaruhi penyampaian cerita.","p":90},{"t":"Narator","d":"Pencerita atau suara yang menyampaikan cerita dalam karya sastra.","c":"","p":90},{"t":"Narator Aktif","d":"Narator yang terlibat langsung dalam cerita sebagai tokoh.","c":"","p":90},{"t":"Narator Objektif","d":"Narator yang menyampaikan cerita tanpa memberi penilaian atau pendapat pribadi.","c":"","p":90},{"t":"Narator Pasif","d":"Narator yang tidak terlibat dalam cerita tetapi hanya mengamati dan menyampaikan peristiwa.","c":"","p":90},{"t":"Narator Serba Tahu","d":"Narator yang mengetahui segala hal tentang tokoh, peristiwa, dan latar, termasuk pikiran dan perasaan tokoh.","c":"","p":90},{"t":"Narator Tak Diandalkan","d":"Narator yang kredibilitas atau kejujuran penuturannya patut diragukan oleh pembaca, sehingga informasi dalam cerita perlu ditafsirkan secara kritis.","c":"","p":90},{"t":"Narator Terbatas","d":"Narator yang hanya mengetahui apa yang dialami atau diketahui satu tokoh tertentu.","c":"","p":90},{"t":"Naskah","d":"Teks tertulis yang menjadi dasar sebuah karya; bisa berupa naskah drama, naskah kuno, atau manuskrip.","c":"","p":90},{"t":"Naskah Drama","d":"Teks tertulis sebuah drama yang berisi dialog, petunjuk pementasan, dan keterangan latar.","c":"","p":90},{"t":"Naskah Lontar","d":"Naskah kuno yang ditulis pada daun lontar yang telah diolah, media tulis umum dalam tradisi sastra Nusantara sebelum kertas dikenal luas.","c":"","p":90},{"t":"Naturalis","d":"Bersifat naturalisme; menggambarkan realitas apa adanya termasuk sisi-sisi yang keras dan tidak menyenangkan.","c":"","p":90},{"t":"Naturalisme","d":"Aliran dalam kesusastraan yang ingin melukiskan keadaan yang sebenarnya, memberikan gambaran yang nyata tentang kebenaran, sering cenderung pada lukisan yang buruk.","c":"","p":91},{"t":"Naturalistis","d":"Ciptaan yang merupakan perwujudan dari aliran Naturalisme.","c":"","p":91},{"t":"Nazam","d":"Bentuk puisi Arab yang berisi pelajaran agama, ilmu pengetahuan, atau syair pujian; banyak dijumpai dalam sastra Melayu Islam.","c":"","p":91},{"t":"Neologisme","d":"Penciptaan kata baru oleh pengarang untuk memperkaya bahasa sastra.","c":"Kata gaul baru yang mulanya diciptakan lalu meluas penggunaannya di masyarakat.","p":91},{"t":"New Criticism","d":"Aliran kritik sastra Barat pertengahan abad ke-20 yang menekankan pembacaan cermat (close reading) terhadap teks tanpa mengaitkannya dengan biografi pengarang.","c":"","p":91},{"t":"Nilai Budaya","d":"Nilai-nilai yang berakar pada tradisi dan kebudayaan suatu masyarakat yang terkandung dalam karya sastra.","c":"","p":91},{"t":"Nilai Estetika","d":"Nilai keindahan yang terkandung dalam karya sastra.","c":"","p":91},{"t":"Nilai Kebenaran","d":"Nilai yang berkaitan dengan kebenaran, kejujuran, dan kesesuaian dengan fakta atau realitas dalam karya sastra.","c":"","p":91},{"t":"Nilai Keindahan","d":"Nilai estetis yang memberikan kepuasan indrawi dan emosional melalui karya sastra.","c":"","p":91},{"t":"Nilai Moral","d":"Nilai-nilai yang berkaitan dengan baik-buruk, benar-salah, dan etika perilaku manusia dalam karya sastra.","c":"","p":91},{"t":"Nilai Pendidikan","d":"Nilai-nilai yang mendidik dan memberikan pelajaran hidup kepada pembaca.","c":"","p":91},{"t":"Nilai Religius","d":"Nilai-nilai yang berkaitan dengan kepercayaan, keagamaan, dan hubungan manusia dengan Tuhan.","c":"","p":92},{"t":"Nilai Sosial","d":"Nilai-nilai yang berkaitan dengan kehidupan bermasyarakat dan hubungan antarmanusia.","c":"","p":92},{"t":"Nokturne","d":"Puisi atau karya yang bersuasana malam, biasanya bernada tenang, murung, atau kontemplatif.","c":"","p":92},{"t":"Nomor Buku Standar Internasional (ISBN)","d":"Kode unik yang diberikan pada setiap judul buku terbitan untuk keperluan identifikasi dan distribusi secara internasional.","c":"","p":92},{"t":"Nonfiksi","d":"Karangan yang mengungkapkan gagasan dan pendapat ditulis berdasarkan fakta.","c":"","p":92},{"t":"Nostalgia Sastra","d":"Perasaan rindu terhadap masa lalu yang sering menjadi tema atau suasana dalam karya sastra.","c":"Puisi yang mengenang masa kecil di kampung halaman yang telah berubah.","p":92},{"t":"Novel","d":"Karya sastra prosa fiksi panjang yang menceritakan kehidupan tokoh-tokoh dengan berbagai konflik dan perkembangan yang kompleks.","c":"","p":92},{"t":"Novel Berseri","d":"Novel yang diterbitkan dalam beberapa jilid berkelanjutan dengan alur yang saling berkaitan.","c":"Serial novel yang terbit dalam lima jilid dengan tokoh dan alur berkelanjutan.","p":92},{"t":"Novel Grafis","d":"Karya naratif panjang yang disajikan dalam bentuk gambar bersambung, memadukan teks dan ilustrasi.","c":"Kisah bergambar yang memadukan panel ilustrasi dan narasi seperti komik naratif panjang.","p":92},{"t":"Novela / Novelet","d":"Karya prosa fiksi yang lebih panjang dari cerpen tetapi lebih pendek dari novel.","c":"","p":92},{"t":"Novelet","d":"Karya prosa fiksi dengan panjang di antara cerita pendek dan novel, biasanya memiliki alur dan penokohan yang lebih ringkas daripada novel.","c":"","p":93},{"t":"Novelis","d":"Sebutan untuk pengarang novel.","c":"Pramoedya Ananta Toer adalah seorang novelis.","p":93},{"t":"Novelisasi","d":"Proses pengubahan sebuah karya, seperti film atau naskah drama, menjadi bentuk novel.","c":"Buku yang ditulis berdasarkan naskah film populer setelah filmnya dirilis.","p":93},{"t":"Objektivikasi","d":"Proses menggambarkan gagasan abstrak atau perasaan menjadi sesuatu yang konkret dalam karya sastra.","c":"Perasaan cemburu yang digambarkan sebagai bayangan hitam yang mengikuti tokoh.","p":94},{"t":"Objektivitas Kritik","d":"Sikap kritikus yang berusaha menilai karya sastra berdasarkan kaidah dan bukti tekstual, bukan preferensi pribadi semata.","c":"","p":94},{"t":"Ode","d":"Puisi yang berisikan pujian dan sanjungan terhadap seseorang yang besar jasanya bagi masyarakat atau bagi nusa dan bangsa.","c":"TERATAI KEPADA KI HAJAR DEWANTARA Dalam kebun di tanah airku Tumbuh sekuntum bunga teratai Tersembunyi indah permai Tidak terlihat orang yang lalu Akarnya tumbuh di hati dunia Daunbersemi laksmi mengarang Biarpun ia diabaikan orang Seroja kembang gemilang mulia Teruslah, o teratai bahagia Berseri di kebun Indonesia Biar sedikit penjaga taman Biarpun engkau tidak dilihat Biarpun engkau tidak diminat Engkaupun turut menjaga zaman (Sanusi Pane)","p":94},{"t":"Oksimoron","d":"Gaya bahasa yang memadukan dua kata yang bertentangan maknanya dalam satu ungkapan.","c":"Kesunyian yang riuh.","p":94},{"t":"Oktaf","d":"Bait puisi yang terdiri dari 8 baris. 8 baris pertama dalam soneta Italia yang isinya semacam sampiran pada pantun.","c":"","p":94},{"t":"Okupasi","d":"Majas yang mengemukakan suatu pernyataan lalu diikuti dengan bantahan atau sanggahan atas pernyataan itu.","c":"\"Memang benar dia pintar, tetapi kelakuannya tidak terpuji.\"","p":94},{"t":"Olok-olok","d":"Ucapan atau tulisan yang bersifat menyindir atau mengejek dengan nada bercanda.","c":"Sindiran bercanda antarwarga desa yang menjadi bagian dari tradisi lisan.","p":95},{"t":"Onomastika","d":"Cabang ilmu yang mempelajari asal-usul dan makna nama, termasuk nama tokoh dalam karya sastra.","c":"Kajian mengapa tokoh antagonis sering diberi nama yang terdengar keras dan tegas.","p":95},{"t":"Onomatope","d":"Kata yang bunyinya menirukan bunyi yang diacunya. 'Meong', 'guk', dan 'cerecet' merupakan onomatope dalam bahasa Indonesia.","c":"","p":95},{"t":"Opera","d":"Jenis drama yang dialognya dinyanyikan dengan diiringi musik/orkestra.","c":"Opera \"La Traviata\" karya Giuseppe Verdi.","p":95},{"t":"Opini Sastra","d":"Pandangan atau tanggapan pribadi seseorang terhadap suatu karya sastra.","c":"Tanggapan seorang pembaca bahwa akhir novel tersebut terasa terlalu terburu-buru.","p":95},{"t":"Oratori","d":"Karya sastra yang bersifat pidato atau dimaksudkan untuk dibacakan di depan umum.","c":"Naskah pidato kemerdekaan yang disusun dengan gaya bahasa yang membangkitkan semangat.","p":95},{"t":"Orientasi","d":"Bagian pembuka struktur teks naratif yang mengenalkan latar, tokoh, dan situasi awal cerita.","c":"Paragraf awal cerita yang memperkenalkan tokoh dan latar tempat.","p":95},{"t":"Orientasi Cerita","d":"Bagian awal cerita yang memperkenalkan latar, tokoh, dan situasi awal sebelum konflik berkembang.","c":"","p":95},{"t":"Orisinalitas","d":"Sifat karya yang asli, tidak meniru, dan memiliki keunikan tersendiri.","c":"","p":95},{"t":"Ostranenie","d":"Istilah Formalisme Rusia (pengasingan/defamiliarisasi) untuk teknik menyajikan hal biasa dengan cara tidak biasa agar pembaca melihatnya kembali secara segar.","c":"","p":96},{"t":"Padahan","d":"Bagian isi pantun yang mengandung makna atau pesan, terdiri atas baris ketiga dan keempat.","c":"","p":97},{"t":"Padanan Budaya","d":"Ungkapan dalam bahasa sasaran yang dipilih penerjemah untuk mewakili konsep budaya spesifik dari bahasa sumber yang tidak memiliki padanan langsung.","c":"","p":97},{"t":"Pantomim","d":"Jenis drama tanpa dialog, cerita disampaikan hanya melalui gerak tubuh dan ekspresi wajah pemain.","c":"Pertunjukan pantomim jalanan.","p":97},{"t":"Pantun","d":"Puisi lama asli yang memiliki syarat-syarat: Satu bait terdiri atas 4 bait. Tiap-tiap bait terdiri atas 8-10 suku kata. Satu bait terdiri atas sampiran (baris 1-2) dan isi (baris 3-4). Memiliki rima akhir ab-ab. Kalau tuan mati dahulu Nantikan saya di pintu surga.","c":"Kalau tuan mandi ke hulu Ambilkan saya bunga kamboja","p":97},{"t":"Pantun Adat","d":"Pantun yang berisi nilai-nilai dan aturan adat istiadat suatu masyarakat.","c":"Pantun yang dibacakan dalam upacara adat pernikahan.","p":97},{"t":"Pantun Agama","d":"Pantun yang berisi ajaran atau nilai-nilai keagamaan.","c":"Pantun berisi ajakan untuk taat beribadah.","p":97},{"t":"Pantun Anak-anak","d":"Pantun bertema dunia anak-anak dengan bahasa dan isi yang riang serta ringan.","c":"Pantun tentang bermain dan bersekolah.","p":97},{"t":"Pantun Berkait","d":"Pantun yang bait-baitnya saling berkaitan, di mana baris terakhir suatu bait menjadi baris pertama bait berikutnya.","c":"","p":97},{"t":"Pantun Berkait = pantun berangkai = pantun berantai","d":"Pantun tidak mengata orang, Janganlah syak di dalam hati. Berangan besar di dalam padi, Rumpun buluh dibuat pagar, Jangan syak di dalam hati, Maklum pantun saya baru belajar. Pantun yang terdiri dari beberapa bait yang berkaitan: baris kedua dan keempat pada bait pertama dijadikan baris pertama dan ketiga bait kedua, demikian seterusnya.","c":"DENGARLAH PANTUN Buah ara, batang dibantun, Mari dibantun dengan parang, Hai saudara dengarlah pantun, Pantuntidak mengata orang. Mari dibantun dengan parang, Berangan besar didalam padi, (dari Puisi Lama)","p":98},{"t":"Pantun Budi","d":"Pantun yang berisi nilai-nilai budi pekerti dan moral.","c":"Pantun yang mengajarkan pentingnya sopan santun.","p":98},{"t":"Pantun Dagang","d":"Pantun yang berisi kehidupan perantauan, perdagangan, atau nasib seseorang.","c":"Pantun tentang suka duka merantau.","p":98},{"t":"Pantun Jenaka","d":"Pantun yang bersifat lucu dan bertujuan menghibur.","c":"Pantun tentang tingkah laku konyol seseorang.","p":98},{"t":"Pantun Kias","d":"Pantun yang berisi sindiran atau perumpamaan secara tidak langsung.","c":"Pantun yang menyindir sifat sombong seseorang.","p":98},{"t":"Pantun Modern","d":"Puisi yang bentuknya mirip pantun (dilihat dari rima dan iramanya), tetapi dari segi isinya bukan (tidak memiliki sampiran).","c":"SERUMPUN BAMBU Serumpun bambu di tepi kolam, Melambai jaya,menjatuhkan bayang, Di lengkung angin, tunduk bermuram, Tak ketentuan daunnya melayag....... (J.E Tatengkeng)","p":98},{"t":"Pantun Muda","d":"Pantun bertema masa muda, umumnya berisi perkenalan atau percintaan.","c":"Pantun yang menggambarkan perasaan jatuh cinta pertama kali.","p":98},{"t":"Pantun Nasihat","d":"Pantun yang berisi petuah atau nasihat hidup.","c":"Pantun tentang pentingnya rajin belajar.","p":98},{"t":"Pantun Percintaan","d":"Pantun yang bertemakan cinta dan asmara.","c":"Pantun yang mengungkapkan rasa rindu kepada kekasih.","p":99},{"t":"Pantun Perkenalan","d":"Pantun yang digunakan untuk membuka perkenalan antara dua orang.","c":"Pantun yang diucapkan saat pertama bertemu.","p":99},{"t":"Pantun Perpisahan","d":"Pantun yang bertemakan perpisahan.","c":"Pantun yang diucapkan saat melepas kepergian seseorang.","p":99},{"t":"Pantun Teka-teki","d":"Pantun yang berisi tebakan yang harus dijawab oleh pendengar.","c":"Pantun yang menanyakan nama suatu benda secara tersirat.","p":99},{"t":"Pantun Tua","d":"Pantun yang berisi nasihat, petuah, atau kebijaksanaan hidup dari orang yang lebih tua.","c":"Pantun tentang pentingnya menjaga hubungan keluarga.","p":99},{"t":"Paparan","d":"Cara penceritaan yang menyampaikan latar, kondisi, atau informasi secara langsung kepada pembaca.","c":"","p":99},{"t":"Parabel","d":"Dongeng perumpamaan yang dipergunakan untuk memberikan pendidikan budi pekerti atau keagamaan. Misalnya: dongeng Sepasang Selop Kulit.","c":"","p":99},{"t":"Paradoks","d":"Gaya bahasa yang mengemukakan hal yang seolah-olah bertentangan, namun sesunggunya tidak, karena obyek yang dikemukakan berlainan.","c":"ia merasa kesepian di jakarta yang ramai itu, dia besar tapi jiwanyakecil.","p":99},{"t":"Parafrase","d":"Penyajian kembali suatu ungkapan gagasan dengan bahasa yang sama, tetapi dengan cara yang berbeda,","c":"pengubahan karya sastra puisi menjadi prosa.","p":99},{"t":"Paragog(e)","d":"Proses penambahan suatu fonem pada akhir kata.","c":"- pen pena Contoh: -lamp lampu","p":99},{"t":"Paragraf","d":"Bagian karangan yang terdiri atas beberapa kalimat yang membahas satu gagasan; disebut juga alinea.","c":"","p":100},{"t":"Paralelisme","d":"Lihat: Anafora, Epifora. Gaya bahasa penegasan yang berupa pengulangan kata-kata pada awal maupun akhir kalimat/baris puisi, jika pengulangan terdapat pada awal kalimat disebut anafora, namun jika pada akhir kalimat disebut epifora.","c":"","p":100},{"t":"Paralipsis","d":"Majas yang menyatakan seolah-olah tidak akan membicarakan sesuatu, padahal sedang membicarakannya.","c":"\"Saya tak akan menyebut kegagalannya dalam proyek lalu...\"","p":100},{"t":"Paratekstualitas","d":"Hubungan antara teks utama dengan unsur pendampingnya seperti judul, kata pengantar, catatan kaki, atau sampul yang membingkai pemaknaan teks.","c":"","p":100},{"t":"Parikan","d":"Puisi rakyat Jawa yang mirip pantun, terdiri atas sampiran dan isi.","c":"Parikan berisi sindiran jenaka dalam bahasa Jawa.","p":100},{"t":"Parodi","d":"Karya yang meniru gaya suatu karya lain dengan tujuan menyindir atau menghibur.","c":"Versi lucu dari dongeng klasik yang mengubah alur aslinya untuk menyindir.","p":100},{"t":"Pars Pro Toto","d":"Gaya bahasa yang menyebutkan sebagian untuk seluruhnya.","c":"-tetangga kami membeli dua ekor kambing hitam. -penduduk Indonesia lebih dari 160 juta jiwa.","p":100},{"t":"Pastiche","d":"Karya yang meniru gaya pengarang atau karya lain tanpa maksud menyindir, biasa sebagai bentuk penghormatan.","c":"Cerpen yang ditulis dengan meniru gaya bahasa khas seorang sastrawan besar sebagai penghormatan.","p":100},{"t":"Pawang","d":"Orang yang memiliki kepandaian dalam beberapa hal yang berhubungan dengan pemujaan terhadap makhluk halus (dalam sastra lama).","c":"pawang perahu, pawang harimau, dan pawang buaya.","p":100},{"t":"Pelipur Lara","d":"Cerita yang berfungsi untuk menghibur dan menenangkan hati; juga merujuk pada pencerita tradisional yang membawakan cerita-cerita tersebut.","c":"","p":101},{"t":"Pelopor Angkatan 45","d":"Lihat: Angkatan 45","c":"","p":101},{"t":"Pelopor Pujangga Baru","d":"Lihat: Angkatan Pujangga Baru","c":"","p":101},{"t":"Peluncuran Buku","d":"Acara resmi memperkenalkan sebuah karya yang baru diterbitkan kepada publik dan media.","c":"","p":101},{"t":"Pembaca Implisit","d":"Konsep tentang sosok pembaca ideal yang dibayangkan dan dibentuk oleh struktur teks itu sendiri, berbeda dari pembaca nyata.","c":"","p":101},{"t":"Pembaca Model","d":"Istilah Umberto Eco untuk pembaca yang mampu menafsirkan teks sesuai dengan strategi interpretasi yang telah disiapkan oleh teks tersebut.","c":"","p":101},{"t":"Pembacaan Puisi","d":"Pertunjukan lisan penyampaian puisi di hadapan penonton, memperhatikan intonasi, ekspresi, dan penjiwaan terhadap makna puisi.","c":"","p":101},{"t":"Pementasan","d":"Proses penyajian sebuah drama di hadapan penonton.","c":"Pertunjukan drama klasik yang digelar di gedung kesenian.","p":101},{"t":"Pemeo","d":"Ucapan tiruan yang tidak diketahui lagi siapa yang pertama kalimenggunakannya, biasanya hanya berlaku untuk beberapa waktu saja.","c":"","p":101},{"t":"Pencerita","d":"Narator atau orang yang menyampaikan cerita dalam karya sastra.","c":"","p":101},{"t":"Pencerita Tak Terbatas","d":"Narator yang memiliki pengetahuan tidak terbatas tentang semua aspek cerita; narator serba tahu.","c":"","p":101},{"t":"Pencerita Terbatas","d":"Narator yang pengetahuannya dibatasi pada pengalaman dan perspektif satu tokoh saja.","c":"","p":101},{"t":"Penceritaan","d":"Cara atau teknik menyampaikan cerita dalam karya sastra, mencakup sudut pandang, gaya, dan struktur.","c":"","p":101},{"t":"Pendekatan Ekstrinsik","d":"Cara mengkaji karya sastra dengan mempertimbangkan faktor-faktor di luar teks seperti biografi pengarang dan kondisi sosial.","c":"","p":102},{"t":"Pendekatan Intrinsik","d":"Cara mengkaji karya sastra dengan berfokus pada unsur-unsur yang terdapat di dalam teks.","c":"","p":102},{"t":"Penegasan","d":"Gaya bahasa yang mengulang atau menekankan suatu pernyataan untuk memberikan kesan yang kuat.","c":"","p":102},{"t":"Pengalih Perhatian Cerita","d":"Petunjuk palsu yang sengaja disisipkan pengarang untuk mengecoh dugaan pembaca, umum dipakai dalam cerita misteri atau detektif.","c":"","p":102},{"t":"Pengarang","d":"Orang yang menciptakan karya sastra.","c":"","p":102},{"t":"Pengarang Anonim","d":"Pengarang yang identitasnya tidak diketahui atau sengaja dirahasiakan.","c":"Kisah hikayat lama yang penulisnya tidak diketahui secara pasti.","p":102},{"t":"Pengarang Eksplisit","d":"Kehadiran pengarang yang nyata dan dapat dirasakan langsung dalam teks, misalnya melalui komentar atau interupsi naratif.","c":"","p":102},{"t":"Pengarang Implisit","d":"Konsep tentang pengarang yang disimpulkan dari teks itu sendiri, berbeda dari pengarang nyata dalam kehidupan.","c":"","p":102},{"t":"Pengembangan Alur","d":"Proses bagaimana rangkaian peristiwa dalam cerita berkembang dari awal hingga akhir.","c":"","p":102},{"t":"Pengimajian","d":"Penggunaan gambar-gambar indrawi dalam sastra untuk menciptakan pengalaman konkret bagi pembaca.","c":"","p":102},{"t":"Pengisahan","d":"Cara menyampaikan cerita dalam karya sastra; sinonim dengan penceritaan.","c":"","p":102},{"t":"Pengulangan","d":"Pemakaian kata, frasa, atau kalimat yang sama secara berulang untuk menciptakan efek penekanan atau irama.","c":"","p":102},{"t":"Penokohan","d":"Cara pengarang menciptakan dan mengembangkan karakter tokoh dalam karya sastra.","c":"","p":103},{"t":"Penokohan = perwatakan","d":"Unsur prosa yang berupa pelukisan mengenai tokoh cerita baik keadaan lahir maupun batinnya.","c":"","p":103},{"t":"Penokohan Analitik","d":"Teknik penggambaran watak tokoh secara langsung melalui penjelasan narator tentang sifat tokoh tersebut.","c":"","p":103},{"t":"Penokohan Dramatik","d":"Teknik penggambaran watak tokoh secara tidak langsung, melalui dialog, tindakan, atau reaksi tokoh lain terhadapnya.","c":"","p":103},{"t":"Penonjolan Makna","d":"Teknik penekanan makna tertentu dalam teks sastra melalui penempatan, pengulangan, atau kontras.","c":"","p":103},{"t":"Penulisan Kreatif","d":"Proses mencipta karya sastra yang menekankan orisinalitas gagasan dan gaya bahasa.","c":"Latihan menulis cerpen dengan sudut pandang
