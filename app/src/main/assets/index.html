 orang pertama sebagai bentuk ekspresi diri.","p":103},{"t":"Penyair","d":"Pengarang atau sastrawan puisi.","c":"Sutarji Calzoum Bakhri dan W. S. Rendra.","p":103},{"t":"Penyimpangan Bahasa","d":"Penggunaan bahasa yang menyimpang dari kaidah gramatikal standar untuk tujuan estetis.","c":"","p":103},{"t":"Pepatah","d":"","c":"-tong kosong berbunyi nyaring. Kiasan yang sangat tepat untuk mematahkan percakapan orang. -air beriak tanda tak dalam.","p":103},{"t":"Perangkat Sastra","d":"Teknik atau alat yang digunakan pengarang untuk menciptakan efek tertentu dalam karya sastra.","c":"","p":103},{"t":"Perbandingan","d":"Majas yang menyandingkan dua hal berdasarkan kesamaan tertentu; mencakup simile dan metafora.","c":"","p":103},{"t":"Peribahasa","d":"Kalimat tetap yang dipergunakan dalam arti kiasan.","c":"-gajah berjuang sama gajah pelanduk mati di tengah-tengah. - bahasa menunjukkan bangsa.","p":104},{"t":"Periodisasi","d":"Pembagian sejarah sastra berdasarkan periode atau kurun waktu tertentu yang memiliki ciri khas.","c":"","p":104},{"t":"Peristiwa","d":"Kejadian atau hal yang terjadi dalam cerita yang mendorong perkembangan alur.","c":"","p":104},{"t":"Peristiwa Naratif","d":"Kejadian dalam cerita yang memiliki fungsi naratif tertentu, baik sebagai penggerak alur maupun pengungkap karakter.","c":"","p":104},{"t":"Peristiwa Tambahan","d":"Kejadian dalam cerita yang tidak langsung berkaitan dengan alur utama tetapi memberikan variasi atau informasi tambahan.","c":"","p":104},{"t":"Peristiwa Utama","d":"Kejadian pokok yang menjadi inti dan penggerak utama alur cerita.","c":"","p":104},{"t":"Perjalanan Sang Pahlawan","d":"Pola naratif universal (monomyth) yang menggambarkan tahapan keberangkatan, inisiasi, dan kepulangan tokoh utama dalam kisah kepahlawanan.","c":"","p":104},{"t":"Personifikasi","d":"","c":"-angin berbisik menyampaikan salam. Gaya bahasa perbandingan yang mengumpamakan benda mati sebagai makhluk hidup. -roda-roda kendaraan menjilati lubang-lubang jalan yang penuh dengan air hujan.","p":104},{"t":"Perspektif Naratif","d":"Sudut pandang yang digunakan pengarang dalam menyampaikan peristiwa cerita.","c":"Cerita yang disampaikan melalui sudut pandang anak kecil yang polos.","p":104},{"t":"Persuasi","d":"Jenis paragraf/karangan yang bertujuan membujuk atau mengajak pembaca untuk melakukan sesuatu.","c":"Iklan layanan masyarakat yang mengajak hidup sehat.","p":104},{"t":"Perubahan Tokoh","d":"Perkembangan atau transformasi karakter tokoh sepanjang cerita.","c":"","p":105},{"t":"Perumpamaan","d":"","c":"-seperti anjing dengan kucing. -bagai laut dengan tebing. Kalimat yang berisikan ungkapan keadaan atau kelakuan seseorang dengan mempergunakan pebandingan dari alam sekitar, biasanya didahului dengan kata: seperti, bagai, bagaikan, laksana, seumpama, dll.","p":105},{"t":"Perwatakan","d":"Cara pengarang menggambarkan sifat dan karakter tokoh dalam cerita.","c":"","p":105},{"t":"Perwatakan Langsung","d":"Cara menggambarkan karakter tokoh secara eksplisit oleh narator atau tokoh lain.","c":"","p":105},{"t":"Perwatakan Tidak Langsung","d":"Cara menggambarkan karakter tokoh melalui perilaku, dialog, dan reaksi tokoh terhadap situasi.","c":"","p":105},{"t":"Pesan Puisi","d":"Amanat atau ajaran yang ingin disampaikan penyair kepada pembaca melalui keseluruhan puisi.","c":"","p":105},{"t":"Picisan","d":"Karya sastra yang bersifat hiburan dangkal tanpa nilai sastra yang tinggi.","c":"","p":105},{"t":"Pigura Bahasa","d":"Gaya atau cara penggunaan bahasa secara artistik; sinonim dengan gaya bahasa atau majas.","c":"","p":105},{"t":"Pikareska","d":"Genre novel yang mengisahkan petualangan tokoh berwatak licik dari kalangan bawah dalam rangkaian episode yang cenderung lepas satu sama lain.","c":"","p":105},{"t":"Plagiat","d":"Penjiplakan karya orang lain tanpa izin dan pengakuan; pelanggaran hak cipta.","c":"","p":105},{"t":"Plagiator","d":"Orang yang melakukan plagiat.","c":"","p":105},{"t":"Plastik bahasa","d":"Daya melukiskan yang dimiliki oleh kata-kata atau bahasa.","c":"di jalan simpang kita berpisah (baris puisi \"berpisah\" karya Waluyati tersebut menimbulkan lukisan jalan bersimpang dalam angan-angan atau imajinasi kita)","p":106},{"t":"Pleonasme","d":"Pemberian keterangan dengan kata-kata yang maknanya sudah tercakup dalam kata-kata yang diterangkan dengan maksud memberikan penegasan.","c":"darah merah membasahi tubuhnya. Mereka telah bertekat mengarungi samudra luas.","p":106},{"t":"Plot","d":"Rangkaian peristiwa dalam cerita yang disusun secara sengaja untuk mencapai efek tertentu; sinonim dengan alur dalam pengertian yang lebih teknis.","c":"","p":106},{"t":"Plot Kompleks","d":"Rangkaian peristiwa yang rumit dengan banyak alur sampingan dan tokoh.","c":"","p":106},{"t":"Plot Sederhana","d":"Rangkaian peristiwa yang tunggal dan mudah diikuti tanpa banyak percabangan.","c":"","p":106},{"t":"Poetika","d":"Cabang ilmu sastra yang mengkaji prinsip dan kaidah penciptaan karya, khususnya puisi.","c":"Kajian klasik tentang unsur-unsur pembangun tragedi dan komedi.","p":106},{"t":"Pola Alur","d":"Struktur dasar atau kerangka yang mengatur pergerakan peristiwa dalam cerita.","c":"","p":106},{"t":"Pola Irama","d":"Pengulangan tekanan, panjang pendek, atau nada secara teratur dalam puisi.","c":"","p":106},{"t":"Pola Rima","d":"Susunan rima dalam bait puisi yang membentuk pola tertentu.","c":"","p":106},{"t":"Polifoni","d":"Istilah dari Bakhtin untuk karya naratif yang menghadirkan banyak suara atau kesadaran tokoh yang setara dan tidak didominasi oleh sudut pandang pengarang tunggal.","c":"","p":107},{"t":"Polisemi","d":"Satu kata yang memiliki beberapa makna yang masih saling berkaitan.","c":"\"kepala\" bisa berarti bagian tubuh atau pemimpin.","p":107},{"t":"Polisindeton","d":"Gaya bahasa yang menyebutkan beberapa hal, keadaan atau benda berturut-turut dengan menggunakan banyak kata penghubung dalam kalimat (lawan asindeton).","c":"","p":107},{"t":"Pornografi","d":"Karya yang secara eksplisit menampilkan konten seksual tanpa nilai artistik; dalam sastra merujuk pada karya yang melanggar norma kesopanan.","c":"","p":107},{"t":"Postkolonialisme","d":"Pendekatan kritik sastra yang mengkaji dampak kolonialisme terhadap budaya dan sastra di negara-negara bekas jajahan.","c":"Kajian atas novel-novel Pramoedya Ananta Toer yang mengangkat masa kolonial.","p":107},{"t":"Postmodernisme","d":"Aliran sastra yang menolak kemapanan bentuk dan makna tunggal, sering menampilkan struktur cerita yang terfragmentasi.","c":"Novel yang menggabungkan berbagai genre dan menolak alur linear tunggal.","p":107},{"t":"Pragmatik Sastra","d":"Pendekatan yang mengkaji makna karya sastra berdasarkan konteks penggunaan bahasanya.","c":"Kajian tentang maksud tersembunyi di balik dialog tokoh dalam drama.","p":107},{"t":"Prakata","d":"Pengantar singkat pada awal buku yang berisi penjelasan atau tujuan penulisan karya.","c":"Bagian awal buku yang menjelaskan tujuan penulisan novel tersebut.","p":107},{"t":"Prasasti","d":"Piagam atau catatan tertulis kuno pada media batu, logam, atau daun lontar yang menjadi sumber utama kajian sastra dan sejarah masa lampau.","c":"","p":108},{"t":"Premis","d":"Rumusan gagasan pokok/inti yang menjadi dasar dan arah penyusunan sebuah cerita.","c":"\"Kejujuran akan selalu menang pada akhirnya\" sebagai premis sebuah cerita.","p":108},{"t":"Premis Cerita","d":"Rumusan inti gagasan cerita yang menyatakan hubungan sebab akibat antara tokoh, tujuan, dan halangan yang dihadapinya.","c":"","p":108},{"t":"Prolepsis","d":"Majas yang menyebutkan akibat atau peristiwa yang akan terjadi lebih dulu sebelum sebab-sebabnya diceritakan.","c":"Menyebutkan kematian tokoh di awal cerita sebelum menjelaskan sebabnya.","p":108},{"t":"Prolepsis Retoris","d":"Gaya bahasa yang mengantisipasi dan menjawab lebih dulu kemungkinan sanggahan sebelum sanggahan itu diajukan lawan bicara.","c":"","p":108},{"t":"Prolog","d":"Kata-katapembukaan yang berisikan tentang penjelasan suatu pertunjukan atau pementasan drama pada saat sebelum dimulai.","c":"","p":108},{"t":"Prolog Drama","d":"Bagian pembuka dalam pertunjukan drama yang berisi pengantar atau gambaran awal sebelum cerita utama dimulai.","c":"","p":108},{"t":"Prosa","d":"Bentuk karangan yang tidak terikat aturan puisi; bahasa sehari-hari yang mengalir bebas.","c":"","p":108},{"t":"Prosa Berirama","d":"Prosa yang memiliki irama atau musikalitas meski tidak berbentuk puisi.","c":"","p":108},{"t":"Prosa Berirama = prosa lirik","d":"Prosa yang mementingkan irama.","c":"PENDAHULUAN CERITERA SABAI NAN ALUHI Kait-berikat rotan saga. Sudah terkait di akar bahar. Terbang ke langit terberita. Tiba di bumi jadi kabar. [ Tulis Sutan Sati ] Siapakah orang yang terkabar -- terkabar raja berbandingi -- dalam negeri padang tarap -- di tanah payung sekali -- di kerambil nan atap tungku -- di pinang yang linggayuran -- di cempedak nan condong -- di rusuk rumah nan godang - - di bawah anjung yang tinggi. . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .. . . . .","p":109},{"t":"Prosa Berlebihan","d":"Gaya penulisan yang terlalu menghias kalimat dengan bahasa berbunga-bunga sehingga justru mengaburkan makna dan melemahkan cerita.","c":"","p":109},{"t":"Prosa Naratif","d":"Karya prosa yang disusun berdasarkan rangkaian peristiwa yang membentuk alur cerita.","c":"Cerpen yang disusun berdasarkan urutan kejadian dari awal hingga akhir.","p":109},{"t":"Proses Kreatif","d":"Rangkaian tahapan yang dilalui pengarang dalam menciptakan sebuah karya sastra.","c":"","p":109},{"t":"Proses Naratif","d":"Cara kerja dan mekanisme penceritaan dalam sebuah karya naratif.","c":"","p":109},{"t":"Prosodi","d":"Ilmu yang mempelajari unsur bunyi, irama, dan rima dalam puisi.","c":"Pola tekanan dan panjang-pendek suku kata dalam pembacaan puisi.","p":109},{"t":"Protagonis","d":"Tokoh utama dalam cerita yang menjadi pusat konflik dan pengembangan narasi.","c":"","p":109},{"t":"Psikoanalisis Sastra","d":"Pendekatan kritik sastra yang menganalisis aspek kejiwaan tokoh atau pengarang berdasarkan teori psikoanalisis, misalnya teori Sigmund Freud.","c":"Analisis kondisi psikologis tokoh utama dalam sebuah novel.","p":109},{"t":"Puisi","d":"Karya sastra yang menggunakan bahasa yang padat, ekspresif, dan berirama untuk menyampaikan perasaan dan gagasan.","c":"","p":110},{"t":"Puisi = sajak","d":"Bentuk karya sastra yang terikat oleh irama, matra, rima dan penyusun bait dan baris.","c":"","p":110},{"t":"Puisi Anak","d":"Puisi yang ditulis untuk atau oleh anak-anak dengan tema dan bahasa yang sederhana dan ringan.","c":"Puisi tentang binatang kesayangan.","p":110},{"t":"Puisi Balada Modern","d":"Puisi naratif modern yang menceritakan kisah tragis atau kepahlawanan dengan sentuhan gaya bahasa yang lebih bebas dari balada tradisional.","c":"","p":110},{"t":"Puisi Baru","d":"Puisi yang lahir setelah pengaruh sastra Barat masuk ke Indonesia, terutama sejak awal abad ke-20. Ciri-cirinya: menggunakan bahasa Indonesia modern, lebih bebas dalam bentuk dan irama, menonjolkan ekspresi individual penyair, dan tidak selalu terikat aturan baku seperti rima dan matra. Pelopornya di Indonesia adalah Angkatan Pujangga Baru.","c":"","p":110},{"t":"Puisi Deskriptif","d":"Puisi berdasarkan cara penyampaian di mana penyair berperan sebagai pengamat yang menggambarkan suatu keadaan, objek, atau peristiwa.","c":"Puisi yang melukiskan keindahan pemandangan alam.","p":110},{"t":"Puisi Diafan","d":"Puisi yang mudah dipahami karena menggunakan bahasa yang lugas dan transparan.","c":"","p":110},{"t":"Puisi Diafan = puisi transparan","d":"Tiga anak kecil Dalam langkah malu-malu Datang ke salemba Sore itu Ini dari kami bertiga Pita hitam pada karangan bunga Sebab kami ikut berduka Bagi kakak yang ditembak mati Siang tadi [ Taufiq Ismail ] Puisi yang mudah dipahami karena isinya sudah jelas dari kata-kata yang dipergunakanya.","c":"KARANGAN BUNGA","p":110},{"t":"Puisi Digital","d":"Puisi yang memanfaatkan media digital, seperti animasi, suara, atau tautan hiperteks, sebagai bagian dari penyajian karyanya.","c":"","p":110},{"t":"Puisi Dramatik","d":"Puisi yang disampaikan melalui suara tokoh tertentu, mengandung ketegangan emosi atau konflik batin seperti dalam drama.","c":"","p":111},{"t":"Puisi Ekspresif","d":"Puisi yang menonjolkan ekspresi perasaan dan emosi penyair secara intens.","c":"","p":111},{"t":"Puisi Elegi","d":"Puisi ratapan yang mengungkapkan kesedihan mendalam, sering ditujukan untuk mengenang kematian seseorang.","c":"","p":111},{"t":"Puisi Epigram","d":"Puisi pendek yang mengandung ajaran hidup atau petunjuk untuk mencapai kebaikan.","c":"","p":111},{"t":"Puisi Himne","d":"Puisi pujian yang ditujukan kepada Tuhan, tanah air, atau sesuatu yang dianggap luhur dan mulia.","c":"","p":111},{"t":"Puisi Konkret","d":"Puisi kontemporer yang tipografinya disusun membentuk gambar atau simbol yang berkaitan dengan makna puisi.","c":"Puisi yang disusun membentuk gambar hati untuk tema cinta.","p":111},{"t":"Puisi Kontemplatif","d":"Puisi yang berisi perenungan mendalam penyair terhadap kehidupan, alam, atau keberadaan manusia.","c":"","p":111},{"t":"Puisi Kontemporer","d":"Puisi yang mengutamakan permainan bunyi untuk menimbulkan kesan keindahan.","c":"Masa Muda jadi andalannya,, Bimbang,, keseharianya,, Impiannya bagaikan Hotel bintang tujuh di Dubai,, Tekun, musuh terberatnya,, Mendadak diam,,, sunyiii,, Katanya merenung,, tapi nggak tahu apa yang direnung,, Inilahmasamuda.","p":111},{"t":"Puisi Konvensional","d":"Puisi yang masih mengikuti aturan bentuk baku, seperti jumlah baris dan pola rima tertentu, berbeda dari puisi bebas.","c":"","p":111},{"t":"Puisi Lama","d":"Puisi yang lahir dan berkembang dalam tradisi lisan masyarakat Nusantara sebelum pengaruh sastra Barat masuk secara meluas. Ciri-cirinya: menggunakan bahasa daerah atau Melayu klasik, terikat oleh aturan baku (rima, matra, bait, jumlah suku kata), biasanya berisi nasihat, agama, atau cerita rakyat, dan ditujukan untuk dilagukan atau dinyanyikan.","c":"","p":112},{"t":"Puisi Lirik","d":"Puisi yang mengungkapkan perasaan atau pikiran pribadi penyair secara subjektif.","c":"Puisi cinta yang mengungkapkan kerinduan penyair.","p":112},{"t":"Puisi Liris","d":"Puisi yang mengutamakan curahan perasaan pribadi penyair secara subjektif, biasanya tentang cinta, kerinduan, atau kesedihan.","c":"","p":112},{"t":"Puisi Mbeling","d":"Puisi yang tidak patuh pada aturan atau kaidah penulisan. Puisi bernada \"main-main\", sering berisikan protes atau kritik terhadap masalah-masalah sosial secara kelakar.","c":"Teka-teki Saya ada dalam puisi Saya ada dalam cerpen Saya ada dalam novel Saya ada dalam roman Saya ada dalam esai Saya ada dalam w,c, Siapakah saya? Jawab: H. B. Jassin. (Mahawan)","p":112},{"t":"Puisi Naratif","d":"Puisi yang mengandung unsur cerita, seperti tokoh dan alur, contohnya balada dan romansa.","c":"Balada \"Orang-Orang Miskin\" karya W.S. Rendra.","p":112},{"t":"Puisi Primatis","d":"Puisi yang sangat mengandalkan pemakaian kata-kata Siapa menggores di langit biru Siapa meretas di awan lalu Siapa mengkristal di kabut itu Siapa mengertas di bunga layu Siapa cerna di warna ungu Siapa bernafas di detak waktu Siapa berkebat setiap kubuka pintu Siapa mencair di bawah pandaanganku Siapa terucap di celah kata-kataku Siapa mengaduh di bayang-bayang sepiku Siapa tiba-tiba menyibak cadarku Siapa meledak dalam diriku : siapa aku (Saopardi Doko Damano) yang berupa pelambangan atau kiasan, sehingga kadang-kadang sangat konotatif dan bermakna ganda (poly interpretable).","c":"Sonet X","p":112},{"t":"Puisi Primatis / Prismatis","d":"Jenis puisi baru yang memandang satu objek atau gagasan dari berbagai sudut pandang, sehingga menghasilkan makna berlapis seperti prisma.","c":"Puisi yang menggambarkan satu peristiwa dari beberapa sudut pandang tokoh.","p":113},{"t":"Puisi Prismatis","d":"Puisi yang kaya makna dan dapat ditafsirkan dari berbagai sudut seperti prisma yang membiaskan cahaya.","c":"","p":113},{"t":"Puisi Ratapan","d":"Puisi yang mengungkapkan kesedihan atau duka; sinonim dengan elegi.","c":"","p":113},{"t":"Puisi Satire","d":"Puisi yang menyindir keadaan sosial, politik, atau perilaku manusia dengan nada mengejek atau menertawakan.","c":"","p":113},{"t":"Puisi Simbolik","d":"Puisi yang menggunakan simbol-simbol untuk menyampaikan makna yang lebih dalam.","c":"","p":113},{"t":"Puisi Transparan","d":"Puisi yang menggunakan bahasa yang jelas dan mudah dipahami; sinonim dengan puisi diafan.","c":"","p":113},{"t":"Pujangga","d":"Penyair atau pengarang yang sangat terampil dan bijaksana; gelar kehormatan untuk sastrawan terkemuka.","c":"","p":113},{"t":"Pujangga Baru","d":"Lihat: Angkatan Pujangga Baru","c":"","p":113},{"t":"Pujangga Lama","d":"Angkatan sastra tertua dalam periodisasi sastra Indonesia, berisi karya sastra sebelum pengaruh Barat masuk, umumnya anonim dan berbentuk hikayat, syair, atau pantun.","c":"Hikayat Hang Tuah.","p":113},{"t":"Purwakanti","d":"Pengulangan bunyi dalam larik puisi tradisional, mirip dengan aliterasi dan asonansi dalam khazanah sastra Jawa/Sunda.","c":"Pengulangan bunyi awal kata dalam pupuh Sunda tradisional.","p":113},{"t":"Pusat Pengisahan","d":"Sudut pandang atau perspektif yang digunakan sebagai pusat penceritaan dalam karya sastra.","c":"","p":113},{"t":"Pusat Pengisahan = sudut pandang","d":"Kedudukan pengarang dalam menuturkan cerita,misalnya: Pengarang sebagai pelaku utama cerita. Pengarang ikut terlibat dalam peristiwa, tetapi bukan sebagai pelaku Pengarang serba hadir. Pengarang peninjau. utama.","c":"","p":114},{"t":"Qasidah","d":"Bentuk puisi lama yang berasal dari tradisi Arab, biasa berisi pujian, nasihat, atau syair keagamaan, dan turut memengaruhi khazanah sastra Melayu.","c":"Syair pujian kepada Nabi Muhammad yang dilantunkan dalam tradisi Melayu-Islam.","p":115},{"t":"Raja Penyair Pujangga Baru","d":"Gelar kehormatan yang diberikan kepada Amir Hamzah sebagai penyair terbaik Angkatan Pujangga Baru.","c":"","p":116},{"t":"Randai","d":"Teater tradisional Minangkabau yang memadukan silat, tari, nyanyian, dan drama dalam bentuk lingkaran.","c":"Pertunjukan Randai di Sumatra Barat.","p":116},{"t":"Rangkaian Cerita","d":"Urutan peristiwa yang membentuk cerita secara keseluruhan.","c":"","p":116},{"t":"Rangkaian Peristiwa","d":"Urutan kejadian yang berturut-turut dalam sebuah cerita.","c":"","p":116},{"t":"Rasa","d":"Unsur batin puisi berupa sikap atau perasaan penyair terhadap objek/pokok persoalan yang diungkapkan dalam puisi.","c":"Rasa haru dalam puisi tentang kehilangan orang tercinta.","p":116},{"t":"Rasa dalam Puisi","d":"Unsur batin puisi yang berkaitan dengan sikap penyair terhadap objek atau persoalan yang diungkapkannya.","c":"","p":116},{"t":"Realis","d":"Bersifat realisme; menggambarkan kehidupan secara nyata dan objektif.","c":"","p":116},{"t":"Realisme","d":"Aliran dalam kesusastraan yang mengemukakan kenyataan secara objektif, tanpa menyertakanperasaan simpati dan antipati pengarang.","c":"","p":116},{"t":"Realisme Magis","d":"Aliran sastra yang memadukan unsur kejadian realistis sehari-hari dengan unsur ajaib/gaib yang ditampilkan seolah wajar dan diterima begitu saja dalam cerita.","c":"Novel \"Seratus Tahun Kesunyian\" karya Gabriel García Márquez.","p":116},{"t":"Realisme Sosialis","d":"Aliran sastra yang menggambarkan kehidupan masyarakat dari sudut pandang perjuangan kelas dan cita-cita sosialisme.","c":"Novel yang menggambarkan perjuangan kaum buruh melawan penindasan pemilik pabrik.","p":117},{"t":"Realita Sosial","d":"Kondisi nyata kehidupan masyarakat yang diangkat menjadi tema atau latar dalam karya sastra.","c":"Kemiskinan dan ketimpangan yang digambarkan sebagai latar utama sebuah novel.","p":117},{"t":"Refleksi Sastra","d":"Proses perenungan atau pencerminan nilai-nilai kehidupan melalui karya sastra.","c":"","p":117},{"t":"Register Bahasa","d":"Ragam bahasa yang digunakan sesuai situasi, tujuan, atau kelompok sosial tertentu dalam karya sastra.","c":"Bahasa formal dalam pidato berbeda dengan bahasa santai dalam obrolan sehari-hari tokoh.","p":117},{"t":"Rekaan","d":"Bersifat khayalan atau fiksi; karya yang diciptakan dari imajinasi pengarang.","c":"","p":117},{"t":"Rekonstruksi","d":"Penyusunan kembali suatu teks, peristiwa, atau makna berdasarkan data atau petunjuk yang tersedia.","c":"","p":117},{"t":"Relasi Makna","d":"Hubungan antara makna satu kata atau ungkapan dengan kata atau ungkapan lain dalam teks.","c":"","p":117},{"t":"Repetisi","d":"Majas pengulangan kata, frasa, atau baris untuk memberi penekanan/penegasan.","c":"\"Aku ingin, aku ingin sekali bertemu denganmu.\"","p":117},{"t":"Repetisi Anaforis","d":"Pengulangan kata atau frasa di awal beberapa baris atau kalimat berturut-turut untuk penekanan makna.","c":"","p":117},{"t":"Repetisi Epistrofa","d":"Pengulangan kata atau frasa pada akhir beberapa baris atau kalimat berturut-turut untuk penekanan makna.","c":"","p":118},{"t":"Representasi","d":"Cara sesuatu ditampilkan atau digambarkan dalam karya sastra.","c":"","p":118},{"t":"Representasi Realitas","d":"Cara karya sastra menampilkan atau mencerminkan kenyataan.","c":"","p":118},{"t":"Resensi","d":"Timbangan buku: karangan yang berisikan pertimbangan atau penilaian terhadap suatu buku atau hasil sastra. Penulisan resensi bertujuan membantu para pembaca menentukan perlu tidaknya sebuah buku tertentu.","c":"","p":118},{"t":"Residensi Penulis","d":"Program yang memberi kesempatan bagi penulis untuk tinggal dan berkarya di suatu tempat dalam jangka waktu tertentu guna mendukung proses kreatifnya.","c":"","p":118},{"t":"Resolusi","d":"Bagian cerita di mana konflik diselesaikan dan ketegangan mereda; disebut juga peleraian atau denouement.","c":"","p":118},{"t":"Respons Pembaca","d":"Tanggapan atau reaksi pembaca terhadap karya sastra yang dibacanya.","c":"","p":118},{"t":"Retisensi","d":"Majas penghentian kalimat secara tiba-tiba, membiarkan makna kalimat menggantung dan dipahami sendiri oleh pendengar/pembaca.","c":"\"Kalau kau berani...\"","p":118},{"t":"Retorika","d":"Seni menggunakan bahasa secara efektif dan persuasif, baik dalam tulisan maupun lisan.","c":"Penggunaan pertanyaan retoris untuk meyakinkan pembaca dalam sebuah esai.","p":118},{"t":"Rima","d":"Persamaan bunyi pada akhir baris atau pada bagian tertentu dalam puisi.","c":"","p":118},{"t":"Rima Akhir","d":"Rima yang terdapat pada akhir kalimat atau baris.","c":"air dalam bertambah dalam, hujan di hulu belum lagi teduh. Hati dendam bertambah dendam, Dendam dahulu-dahulu lagi sembuh","p":118},{"t":"Rima Aliterasi","d":"Perulangan bunyi konsonan di awal kata dalam satu baris atau beberapa baris berdekatan.","c":"","p":119},{"t":"Rima Asonansi","d":"Perulangan bunyi vokal pada kata-kata dalam satu baris atau antar baris puisi.","c":"","p":119},{"t":"Rima Asonansi.","d":"Lihat: Asonasi","c":"","p":119},{"t":"Rima Awal","d":"Rima yang terdapat pada awal kalimat atau baris.","c":"dari mana datangnya cinta Dari sawah turun ke kali Dari mana datangnya cinta Dari mata turun ke hati","p":119},{"t":"Rima Berpeluk","d":"Pola persajakan pada bait empat baris dengan rumus a-b-b-a, di mana baris pertama dan keempat berima sama.","c":"","p":119},{"t":"Rima Berpeluk (Rima Pelukan)","d":"Pola rima dalam bait empat baris dengan rumus a-b-b-a, di mana baris pertama berima dengan baris keempat, dan baris kedua berima dengan baris ketiga. Contoh (dari soneta \"Permintaan\" karya M. Yamin): Mendengarnya ombak pada hampirku (a) Debar-mendebar kiri dan kanan (b) Melangukan nyanyian penuh santunan (b) Terbitlah rindu ke tempat lahirku (a)","c":"","p":119},{"t":"Rima Bersilang (Rima Salib)","d":"Pola rima dalam bait empat baris dengan rumus a-b-a-b, yaitu baris pertama berima dengan baris ketiga, dan baris kedua berima dengan baris keempat.","c":"Jika ada sumur di ladang, (a) Boleh kita menumpang mandi, (b) Jika ada umur panjang, (a) Boleh kita berjumpa lagi (b)","p":119},{"t":"Rima Dalam (Rima Horizontal)","d":"Persamaan bunyi yang terdapat di dalam satu baris yang sama, bukan di akhir baris atau antarbaris. Contoh (Amir Hamzah): habis kikis, segala cintaku hilang terbang.","c":"","p":119},{"t":"Rima Datar","d":"Pola rima di mana semua baris dalam satu bait berima sama; rumus a-a-a-a.","c":"","p":119},{"t":"Rima Disonansi","d":"Persamaan bunyi yang tidak sempurna atau sengaja dibuat tidak harmonis untuk efek tertentu.","c":"","p":120},{"t":"Rima Kembar","d":"Rima yang berupa kata seluruhnya,menjadi vokal dan konsonannya sama.","c":"pengulangan kata yang sama pada akhir larik, misalnya \"... rata, ... rata, ... rata\".","p":120},{"t":"Rima Paut","d":"Rima yang menghubungkan bait satu dengan bait berikutnya.","c":"","p":120},{"t":"Rima Rangkai","d":"Rima yang terdapat pada akhir kalimat-kalimat yang beruntun. Misalnya, pada syair: aa-aa,bb-bb,cc-cc. Syair perahu Inilah gerakan suatu madah (a) Mengarungkan syair terlalu indah, (a) Membetuli jalan tempat berpindah, (a) Di sanalah I'tikat diperbetuli sudah. (a) Wahai muda, kenaliu dirimu, (b) Ialah perahu tamsil tubuhmu, (b) Tidaklah berapa lama hidupmu, (b) Ke akhirat jua kekal diammu. (b) Hai muda arif budiman, (c) Hasilkan kemudian dengan pedoman, (c) Alat perahumu jua kerjakan, (c) Itulah jalan membetulkan insan. (c)","c":"","p":120},{"t":"Rima Sejajar","d":"Rima yang berupa sepatah kata yang dipakai berulang-ulang dalam kalimat yang beruntun. Bertudung langit selalu biru, Tempat cahaya selalu benderang, Tepat udara selalu bersih, Tempat angin selalu nikmat, Tempat bernapas manusia merdeka (Dikaki Gunung oleh IPIII)","c":"","p":120},{"t":"Rima Sempurna","d":"Persamaan bunyi yang sangat tepat antara dua suku kata atau kata yang berima.","c":"","p":120},{"t":"Rima Silang","d":"Pola persajakan pada bait berselang-seling, dengan rumus a-b-a-b pada akhir tiap barisnya.","c":"","p":120},{"t":"Rima Tak Sempurna","d":"Rima yang berupa persamaan sebagian suku akhir.","c":"ber-ge-ma se-ha-ti te-ru-na se-ka-li","p":120},{"t":"Rima Tegak","d":"Rima yang terdapat pada kata-kata dalam baris-baris yang berlainan.","c":"Dari mana punai melayang Dari sawah turun ke padi Dari mana kasih sayang Dari mata turun ke hati (Kata dari awal kalimat, kata mana, sawah, mata di tengah kalimat, kata melayang dan sayang, padi dan hati pada akhir kalimat memperlihatkan rima tegak).","p":121},{"t":"Rima Tengah","d":"Rima yang terdapat di tengah-tengah kalimat atau baris.","c":"kata mana, sawah, dan mata pada pantun di atas.","p":121},{"t":"Rima Terbuka","d":"","c":"du-ka ba-tu su-ka pa-lu Rima yang terdapat pada suku terbuka (berakhir dengan vokal) dengan vokal yang sama.","p":121},{"t":"Rima Tertutup","d":"Rima yang terdapat pada suku tertutup (berakhir dengan konsonan) dengan konsonan yang sama.","c":"si-lang pa-gut Se-lang ta-kut","p":121},{"t":"Rima Terus","d":"Jenis rima yang polanya sama pada setiap baris dalam satu bait (a-a-a-a).","c":"Bait puisi lama dengan akhiran bunyi sama di setiap barisnya.","p":121},{"t":"Rima Vertikal","d":"Persamaan bunyi pada posisi yang sama secara vertikal dalam puisi bertingkat.","c":"","p":121},{"t":"Ritme","d":"Pola pengulangan bunyi, tekanan, atau durasi yang menciptakan irama dalam puisi atau prosa; sinonim dengan irama.","c":"","p":121},{"t":"Ritual Sastra","d":"Kegiatan atau tradisi tertentu yang berkaitan dengan penciptaan atau penyampaian karya sastra dalam suatu masyarakat.","c":"Tradisi berbalas pantun yang menjadi bagian dari upacara pernikahan adat.","p":121},{"t":"Roman","d":"","c":"Siti Nurbaya oleh Marah Rusli. Salah Asuhan oleh Abdul Muis. Jenis prosa baru yang mengisahkan kehidupan manusia baik lahir maupun gejolak batinnya dari awal sampai akhir hidupnya.","p":121},{"t":"Roman Adat","d":"","c":"Azab dan Sengsara oleh Merari Siregar. Siti Nurbaya oleh Marah Rusli. Roman yang bertemakan adat atau roman bertendens yang mengubah adat yang kurang baik.","p":122},{"t":"Roman Berkunci","d":"Novel yang menampilkan tokoh dan peristiwa nyata dengan menyamarkan nama-namanya menjadi tokoh fiksi.","c":"","p":122},{"t":"Roman Bertendens","d":"Roman yang mempunyai tujuan tertentu, misalnya ingin menunjukkan keburukan kawin paksa dan sifat kebarat-baratan (roman Salah Asuhan oleh Abdul Muis).","c":"","p":122},{"t":"Roman Bildung","d":"Novel yang mengisahkan proses pertumbuhan dan pembentukan jati diri tokoh utama dari masa muda menuju kedewasaan.","c":"","p":122},{"t":"Roman Detektif","d":"Roman yang bertemakan kejahatan dan rahasia pembongkarannya.","c":"Mencari Pencuri Anak Perawan oleh Suman Hs.","p":122},{"t":"Roman Gotik","d":"Genre fiksi yang memadukan unsur misteri, kengerian, dan suasana kelam, sering berlatar bangunan tua yang menyeramkan.","c":"","p":122},{"t":"Roman Jiwa","d":"Roman yang sangat mengutamakan lukisan jiwa pelaku-pelakunya.","c":"Atheis oleh Akhdiat Kartamiharja. Belenggu oleh Armjn Pane.","p":122},{"t":"Roman Masyarakat","d":"Roman yang menggambarkan kehidupan dan konflik sosial dalam masyarakat.","c":"","p":122},{"t":"Roman Masyarakat = Roman Sosial","d":"","c":"Sengsara Membawa Nikmat oleh Tulis st. Sati. Neraka Dunia oleh Nur Sutan Iskandar. Roman yang sangat mengutamakan gambaran atau corak sosial pelaku-pelakunya.","p":122},{"t":"Roman Picisan","d":"Roman yang bersifat hiburan semata, dangkal, dan tidak memiliki nilai sastra yang tinggi.","c":"","p":122},{"t":"Roman Psikologis","d":"Roman yang menekankan analisis mendalam terhadap psikologi dan kehidupan batin tokoh. Belenggu karya Armijn Pane adalah roman psikologis pertama sastra Indonesia.","c":"","p":123},{"t":"Roman Religius","d":"Roman yang mengangkat tema keagamaan atau spiritual sebagai inti ceritanya.","c":"Novel \"Di Bawah Lindungan Ka'bah\" karya Hamka.","p":123},{"t":"Roman Sejarah","d":"Roman yang dijalin dengan jalan, peristiwa dan tahun-tahun sejarah. Roman mengambil tokoh utama, tokoh penting dalam sejarah.","c":"Hulubalang Raja oleh Nur Sutan Iskandar. Contoh: Surapati oleh Abdul Muis.","p":123},{"t":"Roman Trilogi","d":"Roman yang terdiri atas tiga bagian atau jilid yang saling berkaitan.","c":"","p":123},{"t":"Roman Trilogy","d":"Roman yang bersumber pada satu tema. Terdiri dari tiga cerita.","c":"Roman Trilogy Metinggo Boesje, Retno Lestari, Bibi Marsiti, dan Tante Maryati.","p":123},{"t":"Romansa","d":"Karya sastra yang mengisahkan petualangan cinta, kepahlawanan, atau kisah luar biasa dengan latar yang eksotis.","c":"","p":123},{"t":"Romansa = Romance","d":"Puisi yang berisikan luapan kasih sayang kepada kekasih.","c":"","p":123},{"t":"Romantic = Romantisme","d":"Aliran pada kesusastraan yang sangat mengutamakan perasaan(lawan aliran realisme).","c":"","p":123},{"t":"Royalti Penulis","d":"Imbalan yang diterima pengarang dari penerbit berdasarkan jumlah eksemplar bukunya yang terjual.","c":"","p":123},{"t":"Rubai","d":"Bentuk puisi Persia yang terdiri atas empat baris dengan skema rima a-a-b-a; dikenal melalui karya Umar Khayyam.","c":"","p":123},{"t":"Rubai / Rubayat","d":"Puisi lama yang berasal dari Persia, terdiri dari empat baris berisi filsafat hidup atau nasihat, umumnya bersajak a-a-a-a atau a-a-b-a.","c":"Kumpulan Rubaiyat karya Omar Khayyam.","p":124},{"t":"Rubai = Rubayat","d":"Jenis puisi lama yang berasal dari Persi/Arab.","c":"","p":124},{"t":"Rubrik Cerpen","d":"Bagian tetap pada surat kabar atau majalah yang secara berkala memuat cerita pendek karya berbagai penulis.","c":"","p":124},{"t":"Saduran","d":"Karya sastra yang disusun berdasarkan karya lain dengan perubahan tertentu; sinonim dengan adaptasi.","c":"","p":125},{"t":"Sage","d":"Cerita rakyat yang mengandung unsur sejarah bercampur dengan khayalan/legenda tentang tokoh atau peristiwa yang dipercaya pernah benar-benar terjadi.","c":"Sage Damarwulan.","p":125},{"t":"Sajak","d":"Karya sastra yang menggunakan bahasa yang padat dan berirama; sinonim dengan puisi.","c":"","p":125},{"t":"Sajak Bebas","d":"Sajak yang bentuknya tidak begitu terikat oleh aturan-aturan seperti: rima, jumlah baris, yang diutamakan ialah isi.","c":"","p":125},{"t":"Sajak Suasana","d":"Puisi yang menonjolkan penggambaran suasana atau atmosfer tertentu ketimbang alur cerita atau argumentasi.","c":"","p":125},{"t":"Sampiran","d":"Baris pertama dan kedua pada pantun yang biasanya berisikan lukisan alam dan memberikan saran bunyi(rima) pada baris-baris isi (baris ketiga dan keempat).","c":"","p":125},{"t":"Sandiwara","d":"Istilah lain untuk drama atau pertunjukan yang dipentaskan berdasarkan naskah cerita.","c":"Pertunjukan sandiwara di panggung sekolah.","p":125},{"t":"Sarkasme","d":"Gaya bahasa sindiran yang paling kasar.","c":"hai, setan pergi dari sini! Sastra=seni sastra=kesusastraan=seni bahasa Hasil karya seni yang menggunakan bahasa sebagai alat untuk menciptakan keindahan.","p":125},{"t":"Sastra","d":"Karya tulisan atau lisan yang memiliki nilai keindahan dan kekayaan ekspresi bahasa.","c":"","p":125},{"t":"Sastra Anak","d":"Karya sastra yang secara khusus ditulis untuk pembaca anak-anak, mencakup cerita, puisi, maupun drama anak.","c":"Buku cerita bergambar untuk anak.","p":126},{"t":"Sastra Arus Utama","d":"Karya sastra yang diterima luas, banyak dibaca, dan mendapat pengakuan dari lembaga sastra maupun pasar pembaca umum.","c":"","p":126},{"t":"Sastra Bandingan","d":"Kajian sastra yang membandingkan karya sastra dari bahasa, negara, atau budaya yang berbeda.","c":"Membandingkan tema cinta dalam novel Indonesia dan Jepang.","p":126},{"t":"Sastra Baru","d":"Sastra Indonesia yang muncul sejak masuknya pengaruh Barat pada awal abad ke-20, dengan bentuk yang lebih bebas dibanding sastra lama.","c":"Novel \"Siti Nurbaya\" karya Marah Rusli.","p":126},{"t":"Sastra Cyber","d":"Karya sastra yang diciptakan, dipublikasikan, dan dibaca melalui media internet atau platform digital.","c":"","p":126},{"t":"Sastra Diaspora","d":"Karya sastra yang ditulis oleh atau tentang masyarakat yang hidup di luar tanah airnya, menyoroti pengalaman migrasi dan identitas ganda.","c":"","p":126},{"t":"Sastra Digital","d":"Karya sastra yang diciptakan, dipublikasikan, atau dinikmati melalui media digital.","c":"Puisi yang dipublikasikan dan dibaca melalui aplikasi ponsel dan media sosial.","p":126},{"t":"Sastra Dunia","d":"Konsep yang memandang karya sastra sebagai bagian dari peredaran dan percakapan sastra lintas bangsa, melampaui batas sastra nasional.","c":"","p":126},{"t":"Sastra Dunia (Weltliteratur)","d":"Konsep yang diperkenalkan Goethe tentang jaringan pertukaran gagasan sastra yang melampaui batas satu bangsa atau bahasa.","c":"","p":126},{"t":"Sastra Feminis","d":"Karya sastra yang mengangkat isu kesetaraan dan pengalaman perempuan sebagai tema utamanya.","c":"Novel yang mengangkat perjuangan perempuan melawan ketidakadilan gender.","p":127},{"t":"Sastra Kontemporer","d":"Sastra yang berkembang pada masa kini, sering bereksperimen dengan bentuk dan mengangkat tema-tema aktual.","c":"Puisi-puisi eksperimental penyair masa kini.","p":127},{"t":"Sastra Lama","d":"Sastra yang berkembang sebelum pengaruh Barat masuk, umumnya anonim dan terikat aturan tertentu, seperti hikayat, pantun, dan syair.","c":"Hikayat Bayan Budiman.","p":127},{"t":"Sastra Lisan","d":"Sastra yang disampaikan secara turun-temurun melalui tuturan lisan tanpa naskah tertulis.","c":"Cerita rakyat yang diwariskan dari mulut ke mulut.","p":127},{"t":"Sastra Marginal","d":"Karya sastra yang ditulis oleh atau tentang kelompok yang berada di pinggiran struktur sosial dan jarang mendapat perhatian kanon arus utama.","c":"","p":127},{"t":"Sastra Melayu Klasik","d":"Karya sastra yang berkembang dalam tradisi Melayu lama sebelum pengaruh sastra Barat, umumnya berbentuk hikayat, syair, dan babad.","c":"","p":127},{"t":"Sastra Modern","d":"Sastra yang lahir dan berkembang dengan ciri kebebasan bentuk dan individualitas pengarang, berbeda dari sastra lama yang terikat konvensi.","c":"Novel dan cerpen karya sastrawan Indonesia setelah abad ke- 20.","p":127},{"t":"Sastra Peralihan","d":"Karya sastra yang muncul pada masa transisi dari sastra Melayu klasik menuju sastra Indonesia modern, memuat ciri campuran keduanya.","c":"","p":127},{"t":"Sastra Pesantren","d":"Karya sastra yang tumbuh dari tradisi dan lingkungan pesantren, sering mengangkat tema keislaman dan kehidupan santri.","c":"","p":127},{"t":"Sastra Populer","d":"Karya sastra hiburan yang mengikuti selera pasar, umumnya bersifat ringan dan mudah dinikmati khalayak luas.","c":"Novel-novel roman remaja best seller.","p":128},{"t":"Sastra Remaja","d":"Karya sastra yang mengangkat pengalaman dan persoalan khas masa remaja, ditujukan bagi pembaca usia muda.","c":"","p":128},{"t":"Sastra Serius (Adiluhung)","d":"Karya sastra dengan nilai estetik dan intelektual tinggi, tidak sekadar bertujuan menghibur.","c":"Karya-karya Pramoedya Ananta Toer.","p":128},{"t":"Sastra Terjemahan","d":"Karya sastra hasil pengalihbahasaan dari bahasa asli ke bahasa lain.","c":"Terjemahan novel \"Harry Potter\" ke bahasa Indonesia.","p":128},{"t":"Sastra Tulis","d":"Sastra yang disampaikan dan didokumentasikan dalam bentuk tulisan.","c":"Novel dan kumpulan puisi yang diterbitkan dalam buku.","p":128},{"t":"Sastra Wangi","d":"Istilah populer untuk gelombang penulis perempuan Indonesia awal tahun 2000-an yang karyanya berani mengangkat tema seksualitas dan tubuh perempuan.","c":"","p":128},{"t":"Sastrawan","d":"Pengarang atau seniman yang berkarya di bidang sastra.","c":"","p":128},{"t":"Satir","d":"Bentuk sindiran tajam terhadap keburukan atau kepincangan dalam masyarakat, disampaikan melalui karya sastra.","c":"Cerpen yang menyindir pejabat korup melalui tokoh binatang dalam fabel.","p":128},{"t":"Satire","d":"Karya sastra yang menggunakan humor, ironi, atau sarkasme untuk mengkritik kelemahan manusia atau keadaan sosial.","c":"","p":128},{"t":"Sayembara Sastra","d":"Perlombaan menulis karya sastra yang diadakan lembaga atau media untuk menjaring dan mengapresiasi karya baru.","c":"","p":128},{"t":"Sekster","d":"Puisi 6 baris seuntai.","c":"","p":128},{"t":"Sekstet","d":"Bait puisi yang terdiri atas enam baris; juga bagian kedua soneta Italia.","c":"","p":129},{"t":"Seloka","d":"Nama lain dari pantun berkait (lihat pantun berkait). Peribahasa yang diberi sampiran. Pantun yang mengandung kiasan dan isinya berupa nasihat Pantun yang antara sampiran dan isinya mempunyai hubungan arti (pendapat B. Simorangkir S.). (pendapat Dr. C. Hooykaas) (pendapat Amir Hamzah).","c":"","p":129},{"t":"Semboyan","d":"Kalimat atau frasa pendek yang menjadi pedoman/prinsip suatu kelompok atau lembaga.","c":"\"Bersatu kita teguh, bercerai kita runtuh.\"","p":129},{"t":"Semiotika","d":"Ilmu yang mempelajari tanda dan makna, digunakan untuk mengkaji simbol-simbol dalam karya sastra.","c":"Kajian makna simbol burung merpati sebagai lambang perdamaian dalam sebuah cerita.","p":129},{"t":"Sendratari","d":"Jenis pertunjukan drama yang disampaikan melalui gerak tari tanpa dialog lisan.","c":"Sendratari Ramayana di Prambanan.","p":129},{"t":"Seni untuk Seni","d":"Pandangan estetika yang menyatakan seni tidak perlu melayani tujuan moral atau sosial selain dirinya sendiri; sinonim dengan l'art pour l'art.","c":"","p":129},{"t":"Senjata Chekhov","d":"Prinsip penulisan bahwa setiap unsur penting yang dimunculkan dalam cerita harus memiliki fungsi dan digunakan kembali di bagian selanjutnya.","c":"","p":129},{"t":"Septima","d":"Puisi 7 baris seuntai.","c":"Tinjaulah Dunia Sana oleh Maria Amin.","p":129},{"t":"Serat","d":"Istilah Jawa untuk karya sastra tertulis, sering berisi ajaran moral atau babad.","c":"Serat Wedhatama.","p":129},{"t":"Silepsis","d":"Majas yang menggunakan satu kata untuk dua konstruksi atau lebih, secara gramatikal benar namun salah satu maknanya kiasan.","c":"\"Ia kehilangan dompet dan kepercayaan diri.\"","p":130},{"t":"Silsilah Naskah (Stema)","d":"Diagram hubungan kekerabatan antarsalinan naskah yang digunakan filolog untuk menelusuri asal-usul dan urutan penyalinan sebuah teks.","c":"","p":130},{"t":"Simbol Budaya","d":"Tanda atau lambang yang mewakili nilai atau makna tertentu dalam suatu kebudayaan, sering muncul dalam karya sastra.","c":"Wayang sebagai simbol kearifan lokal masyarakat Jawa dalam banyak karya sastra.","p":130},{"t":"Simbolisme","d":"Aliran sastra dan seni yang menggunakan simbol-simbol untuk mengungkapkan gagasan dan emosi yang tidak dapat disampaikan secara langsung. Disebut juga simbolik: aliran dalam kesusastraan yang melukiskan sesuatu menggunakan simbol dan perlambang.","c":"Contoh (kutipan puisi \"Si Bapa\"): \"Dengarlah baik-baik beta berkata,\"","p":130},{"t":"Simile","d":"Gaya bahasa perbandingan eksplisit dengan menggunakan kata pembanding seperti 'bagai', 'seperti', atau 'laksana'; padanan asing dari perumpamaan.","c":"","p":130},{"t":"Simploke","d":"Majas repetisi berupa pengulangan kata/frasa yang sama pada awal dan akhir beberapa baris secara bersamaan.","c":"Pengulangan kalimat pembuka dan penutup yang sama pada tiap bait puisi.","p":130},{"t":"Sinalefa","d":"Penggabungan dua suku kata dari kata yang berbeda menjadi satu hitungan irama karena pertemuan bunyi vokal, umum dalam puisi berpola metrum.","c":"","p":130},{"t":"Sinekdoke","d":"Majas yang menggunakan sebagian untuk mewakili keseluruhan atau sebaliknya.","c":"","p":130},{"t":"Sinekdokhe","d":"Lihat: Pars Pro Toto, Totem Pro Parte Gaya bahasa yang menyatakan sebagian untuk seluruhnya (pars pro toto) atau seluruhnya untuk sebagian (totem pro parte).","c":"","p":131},{"t":"Sinestesia","d":"Penggunaan ungkapan yang menggabungkan dua indera yang berbeda seolah saling bertukar. 'Suara merdu yang biru' menggabungkan indera pendengaran dan penglihatan.","c":"","p":131},{"t":"Sinisme","d":"Majas sindiran berupa ungkapan keraguan terhadap ketulusan atau kebaikan seseorang, disampaikan secara kasar.","c":"\"Sudah pintar sekali kau berbohong.\"","p":131},{"t":"Sinkope Puitis","d":"Penghilangan satu bunyi atau suku kata di tengah kata dalam puisi untuk menyesuaikan jumlah suku kata dengan pola irama.","c":"","p":131},{"t":"Sinkretisme Budaya","d":"Perpaduan unsur-unsur budaya yang berbeda dalam satu karya sastra, menghasilkan corak baru.","c":"Cerita yang memadukan unsur Hindu, Islam, dan kepercayaan lokal dalam satu kisah.","p":131},{"t":"Sinonim","d":"Kata yang maknanya sama atau mirip dengan kata lain.","c":"\"pintar\" = \"cerdas\".","p":131},{"t":"Sinopsis","d":"Ringkasan cerita yang disusun mengikuti urutan alur asli karya secara singkat dan padat.","c":"Sinopsis novel pada sampul belakang buku.","p":131},{"t":"Sisindiran","d":"Pantun tradisional Sunda yang terdiri atas cangkang (sampiran) dan eusi (isi).","c":"Sisindiran berisi teka-teki atau nasihat.","p":131},{"t":"Skaz","d":"Gaya bertutur naratif yang meniru ragam lisan sehari-hari dengan ciri khas suara pencerita yang kental dan personal.","c":"","p":131},{"t":"Skema Aktan","d":"Model analisis struktural yang memetakan peran-peran fungsional (subjek, objek, pengirim, penerima, penolong, penentang) dalam sebuah cerita.","c":"","p":132},{"t":"Skema Rima","d":"Pola persajakan pada akhir larik-larik puisi.","c":"Pola a-b-a-b pada pantun menunjukkan skema rima bersilang.","p":132},{"t":"Skenario","d":"Naskah tertulis yang memuat alur, dialog, dan petunjuk pengambilan gambar untuk produksi film atau drama.","c":"Naskah yang memuat dialog dan adegan untuk produksi film pendek.","p":132},{"t":"Solilokui","d":"Monolog yang diucapkan tokoh untuk mengungkapkan pikiran atau perasaannya sendiri, biasanya di atas panggung tanpa disadari tokoh lain.","c":"Monolog panjang seorang tokoh yang diucapkan sendirian di atas panggung untuk mengungkap keraguannya.","p":132},{"t":"Soneta","d":"Puisi baru yang berasal dari Italia, masuk ke Indonesia melalui Belanda. Sastrawan yang mempelopori soneta di Indonesia: 2. Rustam Effendi. Soneta Italia memiliki syarat-syarat: 1. Terdiri dari 14 baris. Soneta Inggris (sonata shakespeare). Soneta Indonesia. 1. M. Yamin (bapak soneta), menulis soneta pertama Indonesia yang berjudul \"permintaan\". 2. Terbagi atas dua kuatren yang disebut oktaf dan dua tersina yang disebut Sekstet. 3. Oktaf melukiskan alam (semacam sampiran pada pantun) dan sekstet berisikan kesimpulan dari apa yang telah dilukiskan oktaf. 4. Peralihan dari oktaf ke sekstet disebut volta. 5. Rumus rima akhir: ab-ba; cd-cd; d-cd. Terdiri atas: tiga kuanten dan satu distikhon (inti soneta) dengan rumus akhir: ab-ab; cd-cd; ef-ef; gg. Tidak tunduk pada syarat-syarat soneta italia, bebas dalam isi maupun rimanya, yang menjadi pegangan hanyalah jumlah 14 baris.","c":"","p":132},{"t":"Sorot Balik","d":"Teknik penceritaan yang kembali ke masa lalu; sinonim dengan flashback atau alur mundur.","c":"","p":132},{"t":"Sosiokritik","d":"Pendekatan yang mengkaji karya sastra sebagai fakta sosial, memperhatikan hubungan timbal balik antara teks dan struktur masyarakatnya.","c":"","p":132},{"t":"Sosiolek","d":"Ragam bahasa yang digunakan oleh suatu kelompok sosial tertentu, mencerminkan identitas kelompok tersebut.","c":"","p":133},{"t":"Sosiologi Sastra","d":"Pendekatan kritik sastra yang mengkaji hubungan antara karya sastra dengan konteks sosial masyarakat penciptanya.","c":"Kajian atas gambaran kehidupan petani dalam novel \"Ronggeng Dukuh Paruk\".","p":133},{"t":"Spondai","d":"Jenis kaki puisi yang terdiri atas dua suku kata yang sama-sama mendapat tekanan.","c":"","p":133},{"t":"Stanza","d":"Kelompok baris dalam puisi yang membentuk satu unit; sinonim dengan bait.","c":"","p":133},{"t":"Stereotipe Tokoh","d":"Gambaran tokoh yang mengikuti pola umum atau klise tanpa pengembangan karakter yang mendalam.","c":"Ibu tiri yang selalu digambarkan jahat dalam berbagai dongeng.","p":133},{"t":"Stilisasi","d":"Penggayaan bahasa atau bentuk untuk menciptakan efek estetis tertentu dalam karya sastra.","c":"Penggunaan bahasa Melayu klasik yang digayakan dalam novel bertema kerajaan.","p":133},{"t":"Stilistika","d":"Ilmu yang mempelajari penggunaan bahasa dan gaya bahasa yang dipergunakan dalam karya sastra.","c":"","p":133},{"t":"Struktur Batin Puisi","d":"Unsur makna dalam puisi yang meliputi tema, rasa, nada, dan amanat.","c":"Tema kerinduan, nada sendu, dan amanat kesabaran dalam sebuah puisi duka.","p":133},{"t":"Struktur Cerita","d":"Susunan unsur-unsur pembangun cerita, meliputi pengenalan, konflik, klimaks, dan penyelesaian.","c":"Bagian pengenalan, konflik, klimaks, dan penyelesaian dalam sebuah cerpen.","p":133},{"t":"Struktur Dramatik","d":"Kerangka atau susunan elemen-elemen yang membangun sebuah drama, termasuk eksposisi, konflik, klimaks, dan resolusi.","c":"","p":134},{"t":"Struktur Fisik Puisi","d":"Unsur puisi yang tampak nyata dalam wujud teks, meliputi diksi, pengimajian, kata konkret, majas, rima, dan tipografi.","c":"","p":134},{"t":"Struktur Formula","d":"Pola tetap yang berulang dalam penyusunan cerita rakyat atau sastra lisan, seperti pembukaan dan penutup yang khas.","c":"Pembukaan 'Pada zaman dahulu kala' yang selalu muncul di awal dongeng.","p":134},{"t":"Struktur Naratif","d":"Kerangka atau susunan elemen-elemen yang membangun sebuah narasi.","c":"","p":134},{"t":"Struktur Naratif Kompleks","d":"Kerangka narasi yang memiliki banyak lapisan, alur sampingan, dan hubungan antarkarakter yang rumit.","c":"","p":134},{"t":"Struktur Naratif Sederhana","d":"Kerangka narasi yang langsung dan mudah diikuti dengan satu alur utama yang jelas.","c":"","p":134},{"t":"Struktur Puitik","d":"Kerangka dan unsur-unsur yang membangun sebuah karya puisi, meliputi bait, larik, rima, dan irama.","c":"","p":134},{"t":"Strukturalisme","d":"Pendekatan kritik sastra yang menganalisis unsur-unsur intrinsik karya sebagai satu struktur yang saling berkaitan, lepas dari konteks di luar teks.","c":"Analisis keterkaitan tema, alur, dan penokohan dalam sebuah cerpen.","p":134},{"t":"Strukturalisme Genetik","d":"Pendekatan kritik sastra yang menghubungkan struktur internal karya dengan pandangan dunia (world view) kelompok sosial pengarangnya; dikembangkan oleh Lucien Goldmann.","c":"","p":134},{"t":"Suasana","d":"Atmosfer atau nuansa emosional yang tercipta dalam sebuah karya sastra.","c":"","p":134},{"t":"Subjektivitas Kritik","d":"Unsur penilaian pribadi kritikus yang tak terelakkan turut memengaruhi cara ia membaca dan menafsirkan sebuah karya sastra.","c":"","p":135},{"t":"Subteks","d":"Makna tersembunyi atau tidak terucap yang terkandung di balik dialog atau tindakan tokoh.","c":"","p":135},{"t":"Sudut Pandang","d":"Lihat: Pusat Pengisahan.","c":"","p":135},{"t":"Sudut Pandang Campuran","d":"Penggunaan lebih dari satu sudut pandang dalam satu karya.","c":"","p":135},{"t":"Sudut Pandang Objektif","d":"Sudut pandang yang menyajikan peristiwa tanpa penilaian atau penjelasan dari narator.","c":"","p":135},{"t":"Sudut Pandang Orang Ketiga","d":"Sudut pandang yang menggunakan kata ganti 'ia', 'dia', atau nama tokoh untuk menceritakan kisah.","c":"","p":135},{"t":"Sudut Pandang Orang Pertama","d":"Sudut pandang yang menggunakan kata ganti 'aku' atau 'saya' sebagai narator yang terlibat langsung dalam cerita.","c":"","p":135},{"t":"Sudut Pandang Subjektif","d":"Sudut pandang yang sangat dipengaruhi oleh perasaan dan perspektif narator atau tokoh.","c":"","p":135},{"t":"Suluk","d":"Karya sastra kitab tasawuf/mistik Jawa yang berisi ajaran spiritual.","c":"Suluk Wujil.","p":135},{"t":"Suntingan Teks","d":"Hasil penyusunan kembali sebuah naskah lama menjadi teks yang siap dibaca, lengkap dengan catatan perbaikan dan penjelasan filologis.","c":"","p":135},{"t":"Surealisme","d":"Aliran seni dan sastra yang menggabungkan realitas dan mimpi atau alam bawah sadar tanpa logika biasa.","c":"","p":135},{"t":"Surprise Ending","d":"Akhir cerita yang mengejutkan dan tidak terduga oleh pembaca.","c":"","p":135},{"t":"Suspens","d":"Bagian cerita yang membuat pembaca terangsang untuk melanjutkan membaca cerita tersebut karena ingin tahu bagaimana kelanjutan cerita atau bagaimana jawaban pertanyaanyang muncul dalam hati, ketika membaca bagian-bagian cerita sebelumnya.","c":"","p":136},{"t":"Sutradara","d":"Orang yang bertanggung jawab mengarahkan seluruh unsur pertunjukan drama, mulai dari akting, tata panggung, hingga interpretasi naskah.","c":"","p":136},{"t":"Syair","d":"Puisi Melayu yang terdiri atas empat baris dengan rima akhir yang sama (a-a-a-a), berisi cerita atau nasihat. Syair Perahu karya Hamzah Fansuri merupakan syair sufi yang terkenal dalam sastra Melayu.","c":"","p":136},{"t":"Syair Modern","d":"Syair yang mengadaptasi bentuk tradisional dengan menggunakan tema dan bahasa kontemporer.","c":"","p":136},{"t":"Tablo","d":"Pertunjukan drama berupa adegan diam/statis seperti lukisan hidup, tanpa gerak dan dialog.","c":"Tablo perjuangan kemerdekaan dalam pentas sekolah.","p":137},{"t":"Talibun","d":"Pantun yang memiliki lebih dari empat baris; jumlah barisnya selalu genap dan lebih dari empat.","c":"","p":137},{"t":"Tambo","d":"Karya sastra tradisional Minangkabau yang berisi silsilah dan sejarah adat suatu kaum atau nagari.","c":"","p":137},{"t":"Tanda Baca dalam Puisi","d":"Penggunaan tanda baca yang disesuaikan atau bahkan dihilangkan penyair untuk mencapai efek tertentu dalam puisi.","c":"Penyair yang sengaja tidak memberi tanda baca untuk menciptakan kesan mengalir.","p":137},{"t":"Tata Panggung","d":"Keseluruhan pengaturan latar fisik pertunjukan, meliputi dekorasi, properti, dan pencahayaan yang mendukung suasana cerita.","c":"","p":137},{"t":"Tautologi","d":"Pengulangan gagasan yang sama dengan kata-kata berbeda tanpa menambah informasi baru. 'Ia mendengar dengan telinganya' merupakan tautologi.","c":"","p":137},{"t":"Tautology","d":"Gaya bahasa penegasan yang mempergunakan kata-kata yang hampir sama maknanya.","c":"","p":137},{"t":"Teater","d":"Seni pertunjukan yang menampilkan cerita melalui akting, dialog, dan tata panggung di depan penonton.","c":"","p":137},{"t":"Teater Absurd","d":"Aliran drama yang menampilkan situasi tidak masuk akal dan dialog yang terputus-putus untuk menggambarkan kehampaan eksistensi manusia.","c":"","p":137},{"t":"Teater Epik","d":"Aliran drama yang dipelopori Bertolt Brecht, menekankan efek jarak (alienasi) agar penonton tetap berpikir kritis, bukan hanya larut secara emosional.","c":"","p":138},{"t":"Teater Realis","d":"Aliran drama yang berusaha menampilkan kehidupan sehari-hari secara wajar dan senyata mungkin di atas panggung.","c":"","p":138},{"t":"Teater Tradisional","d":"Bentuk pertunjukan drama yang tumbuh dan berkembang dalam adat suatu daerah, seperti ketoprak, ludruk, atau lenong.","c":"","p":138},{"t":"Tegangan","d":"Rasa tegang yang dirasakan pembaca akibat ketidakpastian hasil konflik dalam cerita; sinonim dengan suspens.","c":"","p":138},{"t":"Tegangan Cerita","d":"Unsur ketegangan yang dibangun secara bertahap dalam narasi untuk menjaga minat pembaca.","c":"","p":138},{"t":"Teknik Alur","d":"Cara pengarang menyusun dan mengatur rangkaian peristiwa dalam cerita.","c":"","p":138},{"t":"Teknik Bercerita","d":"Cara atau metode yang digunakan pengarang dalam menyampaikan cerita.","c":"","p":138},{"t":"Teknik Deskripsi","d":"Cara pengarang menggambarkan tokoh, latar, atau situasi secara rinci.","c":"","p":138},{"t":"Teknik Dialog","d":"Cara pengarang menggunakan percakapan antar tokoh untuk mengungkap karakter dan menggerakkan cerita.","c":"","p":138},{"t":"Teknik Metaforis","d":"Penggunaan metafora secara sistematis sebagai teknik naratif atau puitis.","c":"","p":138},{"t":"Teknik Monolog","d":"Cara pengarang menggunakan ucapan seorang diri untuk mengungkap pikiran batin tokoh.","c":"","p":138},{"t":"Teknik Narasi","d":"Cara menyampaikan cerita melalui penuturan narator.","c":"","p":138},{"t":"Teknik Naratif","d":"Keseluruhan metode dan strategi yang digunakan pengarang dalam membangun narasi.","c":"","p":139},{"t":"Teknik Penokohan","d":"Cara pengarang membangun dan mengembangkan karakter tokoh dalam karya.","c":"","p":139},{"t":"Teks Naratif","d":"Jenis teks yang berisi rangkaian peristiwa yang disusun secara kronologis membentuk sebuah cerita.","c":"Cerita rakyat yang disusun secara runtut dari awal hingga penyelesaian.","p":139},{"t":"Teks Sastra","d":"Karya sastra sebagai objek yang dapat dibaca, dikaji, dan ditafsirkan.","c":"","p":139},{"t":"Tekstur Bahasa","d":"Kualitas dan rasa yang ditimbulkan oleh pilihan kata dan struktur kalimat dalam karya sastra.","c":"","p":139},{"t":"Tema","d":"Gagasan pokok atau persoalan utama yang menjadi inti sebuah karya sastra.","c":"","p":139},{"t":"Tema Filosofis","d":"Tema yang berkaitan dengan persoalan filsafat seperti keberadaan, kebenaran, dan makna hidup.","c":"","p":139},{"t":"Tema Khusus","d":"Tema yang bersifat spesifik dan berkaitan dengan kondisi, waktu, atau kelompok tertentu.","c":"","p":139},{"t":"Tema Mayor","d":"Gagasan pokok atau tema utama yang mendominasi keseluruhan cerita.","c":"Tema perjuangan yang mendominasi seluruh alur novel.","p":139},{"t":"Tema Minor","d":"Tema sampingan yang mendukung atau memperkaya tema utama dalam sebuah karya.","c":"","p":139},{"t":"Tema Sosial","d":"Tema yang berkaitan dengan permasalahan kehidupan bermasyarakat.","c":"","p":139},{"t":"Tema Universal","d":"Tema yang berkaitan dengan pengalaman manusia yang umum dan berlaku lintas budaya. Cinta, kematian, dan pencarian identitas merupakan tema universal yang selalu relevan.","c":"","p":140},{"t":"Tembang","d":"Puisi/lagu tradisional Jawa yang terikat oleh guru gatra, guru wilangan, dan guru lagu.","c":"Tembang Macapat.","p":140},{"t":"Tempo Naratif","d":"Kecepatan relatif penyampaian peristiwa dalam cerita, diatur melalui perbandingan antara panjang teks dan lamanya peristiwa yang diceritakan.","c":"","p":140},{"t":"Teori Resepsi","d":"Teori kritik sastra yang menitikberatkan pada tanggapan dan peran pembaca dalam memaknai teks.","c":"Perbedaan penafsiran pembaca muda dan tua terhadap pesan moral sebuah novel.","p":140},{"t":"Teori Sastra","d":"Kumpulan konsep dan prinsip yang digunakan untuk memahami, menganalisis, dan menilai karya sastra.","c":"Penggunaan pendekatan strukturalisme untuk menganalisis unsur pembangun cerpen.","p":140},{"t":"Terjemahan Beranotasi","d":"Terjemahan karya sastra yang dilengkapi catatan penjelas untuk membantu pembaca memahami konteks budaya atau kebahasaan teks sumber.","c":"","p":140},{"t":"Terjemahan Sastra","d":"Pengalihan karya sastra dari satu bahasa ke bahasa lain dengan tetap mempertahankan nilai estetisnya.","c":"Sebuah novel Indonesia yang diterjemahkan ke berbagai bahasa asing.","p":140},{"t":"Tersina","d":"Bait puisi yang terdiri atas tiga baris; berasal dari Italia dan dikenal melalui Divina Commedia Dante.","c":"","p":140},{"t":"Tersirat","d":"Maksud pengarang yang dikemukakan secara tersembunyi di balik apa yang tertulis (secara implisit).","c":"","p":140},{"t":"Tersurat","d":"Maksud pengarang yang dikemukakan secara jelas seperti apa yang tertulis (secara eksplisit).","c":"","p":141},{"t":"Terza Rima","d":"Bentuk puisi berpola tetap asal Italia yang tersusun dalam bait tiga baris dengan rima berantai antarbait, dipopulerkan Dante Alighieri.","c":"","p":141},{"t":"Terzina","d":"Puisi 3 baris seuntai.","c":"","p":141},{"t":"Tipografi","d":"Unsur fisik puisi berupa bentuk dan tata letak visual puisi di atas halaman yang turut membangun makna.","c":"Puisi konkret yang disusun membentuk gambar tertentu.","p":141},{"t":"Tipografi Puisi","d":"Susunan visual baris dan bait pada halaman, termasuk penggunaan spasi, indentasi, dan bentuk huruf, yang turut membangun makna puisi.","c":"","p":141},{"t":"Titik Balik","d":"Momen kritis dalam cerita di mana keadaan berubah secara dramatis, biasanya merupakan titik puncak.","c":"","p":141},{"t":"Tokoh","d":"Pelaku atau karakter dalam karya sastra.","c":"","p":141},{"t":"Tokoh Berkembang","d":"Tokoh yang mengalami perubahan watak atau pandangan hidup seiring berjalannya alur cerita.","c":"","p":141},{"t":"Tokoh Bulat","d":"Tokoh yang digambarkan memiliki watak kompleks dan dapat berubah, sehingga terasa hidup seperti manusia nyata.","c":"","p":141},{"t":"Tokoh Dinamis","d":"Tokoh yang mengalami perubahan atau perkembangan karakter sepanjang cerita.","c":"","p":141},{"t":"Tokoh Figuran","d":"Tokoh pendukung yang memiliki peran kecil dan tidak berpengaruh besar terhadap jalannya cerita.","c":"","p":141},{"t":"Tokoh Inti","d":"Pelaku cerita yang menjadi penyebab persengketaan (konflik), pada peristiwa dramatis serta sebagai penentu gerak langkah dan alur cerita.","c":"","p":141},{"t":"Tokoh Pelengkap","d":"Tokoh sampingan yang hadir untuk melengkapi cerita atau mendukung perkembangan tokoh utama. Disebut juga tokoh figuran: tokoh yang hanya melengkapi mata rantai cerita.","c":"","p":142},{"t":"Tokoh Pipih","d":"Tokoh yang digambarkan hanya memiliki satu sifat dominan dan tidak mengalami perkembangan sepanjang cerita.","c":"","p":142},{"t":"Tokoh Sentral","d":"Tokoh yang menjadi pusat perhatian dan penggerak utama cerita.","c":"","p":142},{"t":"Tokoh Statis","d":"Tokoh yang tidak mengalami perubahan karakter sepanjang cerita.","c":"","p":142},{"t":"Tokoh Utama","d":"Tokoh yang memiliki peran paling penting dan mendominasi cerita.","c":"","p":142},{"t":"Totem Pro Parte","d":"Gaya bahasa yang menyatakan seluruhnya untuk sebagian.","c":"Indonesia berhasil menjadi juara bulu tangkis Asia.","p":142},{"t":"Tradisi Lisan","d":"Kebiasaan menyampaikan cerita, ajaran, atau nilai budaya secara turun-temurun melalui tuturan lisan.","c":"Kisah legenda yang diwariskan secara turun-temurun melalui penuturan lisan.","p":142},{"t":"Tragedi","d":"Karya sastra, khususnya drama, yang menampilkan kehancuran atau kematian tokoh utama akibat kelemahan atau nasib buruk.","c":"Kisah dua tokoh yang berakhir dengan kematian akibat kesalahpahaman tragis.","p":142},{"t":"Tragikomedi","d":"Jenis drama yang memadukan unsur tragedi (kesedihan) dan komedi (kelucuan) dalam satu cerita.","c":"Naskah drama yang menampilkan kisah sedih diselingi adegan jenaka.","p":142},{"t":"Transformasi Cerita","d":"Perubahan atau pengolahan kembali sebuah cerita menjadi bentuk atau versi yang baru.","c":"","p":142},{"t":"Transliterasi","d":"Pengalihan tulisan dari satu sistem aksara ke sistem aksara lain.","c":"Pengalihan naskah beraksara Jawi ke huruf Latin.","p":143},{"t":"Transtekstualitas","d":"Istilah Gérard Genette untuk seluruh jenis hubungan yang mungkin terjadi antara satu teks dengan teks lain, termasuk intertekstualitas dan hipertekstualitas.","c":"","p":143},{"t":"Tritagonis","d":"Tokoh ketiga yang berperan mendukung atau menengahi konflik antara protagonis dan antagonis.","c":"Tokoh penengah yang membantu mendamaikan tokoh utama dan lawannya.","p":143},{"t":"Trokaik","d":"Jenis kaki puisi yang terdiri atas satu suku kata bertekanan diikuti satu suku kata tak bertekanan, kebalikan dari iambik.","c":"","p":143},{"t":"Tuturan","d":"Ujaran atau perkataan yang disampaikan tokoh dalam karya sastra, baik lisan maupun tertulis.","c":"Dialog tokoh yang mencerminkan wataknya melalui cara ia berbicara.","p":143},{"t":"Twist Akhir","d":"Kejutan atau pembalikan tak terduga yang muncul menjelang akhir cerita dan mengubah pemahaman pembaca atas keseluruhan kisah.","c":"","p":143},{"t":"Ubrug","d":"Teater tradisional Banten yang memadukan lawakan dan cerita rakyat dengan iringan musik sederhana.","c":"Pertunjukan Ubrug di Banten.","p":144},{"t":"Ungkapan","d":"Gabungan kata dengan makna kias yang sudah menjadi satu kesatuan makna, mirip dengan idiom.","c":"\"Kambing hitam\" berarti orang yang dipersalahkan.","p":144},{"t":"Ungkapan Idiomatik","d":"Gabungan kata yang maknanya tidak dapat ditafsirkan dari makna kata-kata pembentuknya secara harfiah.","c":"'Naik daun' berarti menjadi terkenal, bukan benar-benar naik ke atas daun.","p":144},{"t":"Unsur Cerita","d":"Komponen atau elemen yang membangun sebuah karya sastra narasi.","c":"","p":144},{"t":"Unsur Ekstrinsik","d":"Unsur pembangun karya sastra dari luar teks, seperti latar belakang pengarang, sosial, budaya, dan sejarah.","c":"Latar belakang kehidupan pengarang yang memengaruhi isi novelnya.","p":144},{"t":"Unsur Intrinsik","d":"Unsur pembangun karya sastra dari dalam karya itu sendiri, seperti tema, alur, tokoh, dan latar.","c":"Tema, alur, dan penokohan dalam sebuah cerpen.","p":144},{"t":"Unsur Pembangun","d":"Elemen-elemen yang membentuk dan menyusun sebuah karya sastra.","c":"","p":144},{"t":"Untai","d":"Bagian atau satuan dalam karya sastra; juga dapat merujuk pada rangkaian cerita yang saling berkaitan.","c":"","p":144},{"t":"Uraian Cerita","d":"Penjelasan rinci mengenai jalannya suatu cerita atau alur karya sastra.","c":"Penjelasan ringkas tentang jalannya kisah sebuah novel sebelum dibahas lebih dalam.","p":144},{"t":"Urutan Peristiwa","d":"Susunan kejadian dalam sebuah cerita, baik secara kronologis maupun tidak.","c":"Kejadian dalam novel yang disusun mulai dari perkenalan tokoh hingga penyelesaian konflik.","p":145},{"t":"Utopia","d":"Gambaran tentang tempat atau masyarakat ideal yang sempurna, sering menjadi tema dalam karya sastra.","c":"Kisah tentang negeri ideal tanpa kejahatan dan kemiskinan.","p":145},{"t":"Versifikasi","d":"Teknik penyusunan bait dan larik dalam penciptaan puisi.","c":"Teknik menyusun jumlah baris dan pola rima dalam menciptakan sebuah soneta.","p":146},{"t":"Villanelle","d":"Bentuk puisi berpola tetap asal Prancis yang terdiri atas 19 baris dengan pengulangan dua larik secara bergantian di setiap bait.","c":"","p":146},{"t":"Vinyet","d":"Ilustrasi kecil atau hiasan yang menyertai teks sastra, biasa terdapat pada awal atau akhir bab.","c":"Gambar kecil bunga yang menghiasi awal setiap bab dalam buku puisi.","p":146},{"t":"Visualisasi Sastra","d":"Penggambaran suatu karya sastra ke dalam bentuk visual, seperti ilustrasi, film, atau pertunjukan.","c":"Novel yang diadaptasi menjadi film layar lebar.","p":146},{"t":"Vita Brevis, Ars Longa","d":"Ungkapan Latin yang berarti 'hidup itu singkat, seni itu panjang'; mengingatkan bahwa karya yang diciptakan akan melampaui usia penciptanya.","c":"","p":146},{"t":"Vitalis","d":"Orang yang mempunyai gairah hidup, tenaga hidup, mempunyai keuletan dan semangat bernyala-nyala dalam menempuh hidup ini.","c":"","p":146},{"t":"Volta","d":"Titik balik dalam soneta di mana tema atau argumen berpindah atau berkembang; biasanya terjadi pada baris kesembilan.","c":"","p":146},{"t":"Vulgarisme","d":"Penggunaan kata atau ungkapan kasar dan tidak sopan dalam karya sastra, biasanya untuk memperkuat karakter tokoh atau efek realistis.","c":"","p":146},{"t":"Wacana","d":"Satuan bahasa yang lebih besar dari kalimat; dalam kajian sastra merujuk pada cara pandang atau sistem berpikir yang mengatur makna teks.","c":"","p":147},{"t":"Wacana Naratif","d":"Rangkaian tuturan yang membentuk sebuah cerita, dikaji dari segi struktur bahasa dan hubungan antarkalimatnya.","c":"","p":147},{"t":"Wacana Sastra","d":"Keseluruhan percakapan, debat, dan pemikiran yang berlangsung dalam dunia kesusastraan.","c":"","p":147},{"t":"Waktu Cerita","d":"Rentang waktu peristiwa yang terjadi di dalam dunia rekaan, berbeda dengan waktu tutur, yaitu lama waktu yang dibutuhkan untuk membacanya.","c":"","p":147},{"t":"Waktu Tutur","d":"Durasi yang dibutuhkan narator untuk menyampaikan suatu peristiwa dalam teks, yang bisa lebih panjang atau lebih pendek daripada waktu cerita sesungguhnya.","c":"","p":147},{"t":"Wangsalan","d":"Bentuk sastra Jawa berupa teka-teki yang disampaikan dalam bentuk sindiran.","c":"Wangsalan dalam percakapan sehari-hari orang Jawa.","p":147},{"t":"Warna Lokal","d":"Unsur kedaerahan yang ditampilkan dalam karya sastra untuk memberi ciri khas tempat atau budaya tertentu.","c":"Suasana pasar tradisional Minangkabau yang kental dalam sebuah novel karya sastrawan Sumatra.","p":147},{"t":"Watak","d":"Sifat batin yang mempengaruhi perasaan, pikiran, dan perbuatan tokoh dalam cerita.","c":"","p":147},{"t":"Wattpad","d":"Contoh platform berbagi cerita daring tempat penulis dapat mempublikasikan karya fiksi secara bersambung dan berinteraksi langsung dengan pembaca.","c":"","p":147},{"t":"Wawacan","d":"Puisi naratif panjang berbahasa Sunda yang biasanya dilagukan.","c":"Wawacan Panji Wulung.","p":148},{"t":"Wawancang","d":"Dialog atau percakapan antar tokoh dalam naskah drama.","c":"Kalimat percakapan yang diucapkan tokoh di atas panggung.","p":148},{"t":"Wawasan Sastra","d":"Pengetahuan dan pemahaman seseorang mengenai bidang kesusastraan.","c":"Pemahaman mendalam tentang berbagai aliran dan tokoh sastra Indonesia.","p":148},{"t":"Wayang Kulit","d":"Seni pertunjukan tradisional yang menggunakan boneka kulit sebagai media penyampaian cerita, biasa diiringi dialog dan musik gamelan.","c":"Pertunjukan lakon Ramayana yang dibawakan dalang semalam suntuk diiringi gamelan.","p":148},{"t":"Wayang Orang","d":"Teater tradisional Jawa yang mementaskan lakon pewayangan, seperti Ramayana atau Mahabharata, yang diperankan oleh manusia.","c":"Pertunjukan Wayang Orang di Sriwedari, Solo.","p":148},{"t":"Wiracarita","d":"Cerita kepahlawanan berskala besar yang menggambarkan tokoh-tokoh heroik dalam pertempuran atau petualangan; sinonim dengan epos. Mahabharata dan Ramayana menjadi sumber inspirasi sastra Jawa dan Bali.","c":"","p":148},{"t":"Zeugma","d":"Majas yang menggunakan satu kata (biasanya kata kerja) untuk menerangkan dua objek atau lebih, meski secara gramatikal tidak semuanya tepat.","c":"\"Ia membuka pintu dan hatinya untuk tamu itu.\"","p":149}];const LOGO="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMQAAADICAYAAAC3ZE4QAAD8m0lEQVR42uy9dZhd1fn+/Vlr7b2PzhnPZOLuHiC4BC3uDi0ttKWlSAulQiktdUMqtFDc3V0KBE1DgIS4JxOZZHzOHNmy1vvHOpOZhAD1t/3+2Nc1EMKZI/usx+7nfu4HPr3+/7gE4AAkEolj0+l0Pp1OF+Lx+Bml/++UHvPp9en1f/5SgCwZw3HpdLpdCKEBXVZWlk8mk1/sZTTq09v16fV/KQqI0uF3tj/cyWTykkwmYwBz8MEH62OPPVYDpqyszKRSqV92R5BeRuSUnkt8Gj0+vf7bD77sdWjVxxxYVVZWtnsmk3kwnU4bQB933HG6s7PTBEFgzj77bA1EyWTSVFRUvJBKpfYD3I953e7X7G0sn16fXv+/GIH6pJSmvr4+WVVVNS6TyZxa  const ab=[...new Set(D.map(x=>x.L))].slice(0,3).join(", ");
 app.innerHTML=`<div class="hero"><img src="${LOGO}" alt=""><h2>Kamus Sastra</h2><p>Tekan tombol cari dan ketikkan istilah yang ingin Anda temukan atau gunakan tombol-tombol di bawah ini untuk menelusuri isi Kamus Sastra Indonesia.</p></div>
 <div class="grid"><button class="tile" data-go="#/abjad"><b>Abjad</b><span>${ab}, …</span></button><button class="tile" data-go="#/rumpun"><b>Rumpun</b><span>${g.join(", ")}, …</span></button>
 <button class="tile" data-go="#/favorit"><b>Favorit</b><span>${st.get("fav").length} istilah</span></button><button class="tile" data-go="#/riwayat"><b>Riwayat</b><span>istilah yang dibuka</span></button></div>
 <div class="card"><h3>Kata Hari Ini</h3><h4>${esc(w.t)}</h4><div style="line-height:1.55">${esc(w.d||w.c)}</div><small>Disusun oleh Kelas XII IPA 1 MA Manbail Futuh, Jenu.</small></div>
 <button class="outline" data-id="${y.i}">Kata Tahun Ini <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>`;
 app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>location.hash=b.dataset.go);bind();
}
function search(){
 app.innerHTML=`<input class="search" id="q" placeholder="Cari istilah…" autocomplete="off"><div id="r"></div>`;
 const q=$("#q"),r=$("#r");q.focus();
 const run=()=>{const s=norm(q.value.trim());if(!s){r.innerHTML='<p class="empty">Ketik istilah yang ingin dicari.</p>';return}
  const a=[],b=[],c=[];D.forEach(x=>{if(x.n.startsWith(s))a.push(x);else if(x.n.includes(s))b.push(x);else if(x.dn.includes(s))c.push(x)});
  const all=[...a,...b,...c];r.innerHTML=`<div class="sec">${all.length} hasil</div>`+list(all.slice(0,80));bind()};
 q.oninput=run;run();
}
function abjad(){
 const m={};D.forEach(x=>m[x.L]=(m[x.L]||0)+1);
 app.innerHTML=`<div class="letters">${Object.keys(m).sort().map(l=>`<button class="tile" data-go="#/abjad/${l}"><b>${l}</b><span>${m[l]}</span></button>`).join("")}</div>`;
 app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>location.hash=b.dataset.go);
}
function huruf(l){app.innerHTML=`<div class="sec">Huruf ${esc(l)}</div>`+list(D.filter(x=>x.L===l));bind()}
function rumpun(){
 app.innerHTML=groups().map(([w,v])=>`<button class="item" data-go="#/rumpun/${encodeURIComponent(w)}"><b>${esc(w)}</b><span>${v.length} istilah</span></button>`).join("");
 app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>location.hash=b.dataset.go);
}
function rump(w){app.innerHTML=`<div class="sec">Rumpun ${esc(w)}</div>`+list(D.filter(x=>x.t.split(/[\s\/=,(]/)[0]===w));bind()}
function kata(id){
 const x=D[+id];if(!x){app.innerHTML='<p class="empty">Istilah tidak ditemukan.</p>';return}
 let h=st.get("riw").filter(i=>i!==x.i);h.unshift(x.i);st.set("riw",h.slice(0,50));
 const fav=st.get("fav").includes(x.i);
 const lnk=s=>esc(s).replace(/(Lihat(?: juga)?:\s*)([^.;]+)/,(m,p,t)=>{const f=D.find(z=>z.n===norm(t.trim()));return f?`${p}<a class="l" data-id="${f.i}">${t}</a>`:m});
 app.innerHTML=`<div class="def"><h2>${esc(x.t)}</h2><div class="pg">Halaman ${x.p} dalam buku</div>
 ${x.d?`<p>${lnk(x.d)}</p>`:""}${x.c?`<div class="ex"><b style="font-style:normal">Contoh:</b> ${esc(x.c)}</div>`:""}
 <div class="act"><button id="f">${fav?"★ Hapus favorit":"☆ Favorit"}</button><button id="s">Salin</button></div></div>`;
 $("#f").onclick=()=>{let f=st.get("fav");f=f.includes(x.i)?f.filter(i=>i!==x.i):[x.i,...f];st.set("fav",f);kata(id)};
 $("#s").onclick=()=>{const t=x.t+"\n"+x.d+(x.c?"\nContoh: "+x.c:"");(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$("#s").textContent="Tersalin"},()=>{})};
 bind();
}
function koleksi(k,j){const a=st.get(k).map(i=>D[i]).filter(Boolean);app.innerHTML=`<div class="sec">${j}</div>`+(a.length?list(a):`<p class="empty">Belum ada istilah.</p>`);bind()}
function tentang(){app.innerHTML=`<div class="hero"><img src="${LOGO}" alt=""><h2 style="font-size:28px">Kamus Sastra Indonesia</h2><p>Rangkuman sastra Bahasa Indonesia: istilah, genre, dan teori sastra.<br><br>Penulis: Kelas XII IPA 1 MA Manbail Futuh<br>Pembimbing: Nurul Adib Ali Fikri, M.Pd<br>Edisi Kedua, 2027 · Jenu<br><br>${D.length} istilah · bekerja sepenuhnya offline.<br>Versi 1.2</p></div>`}

const FONTS=[["Klasik",'Georgia,"Times New Roman",serif'],["Modern",'Roboto,"Segoe UI",system-ui,sans-serif'],["Jelas",'Verdana,Tahoma,sans-serif'],["Mesin tik",'"Courier New",monospace']];
const SIZES=[["Kecil",.9],["Sedang",1],["Besar",1.15],["Sangat besar",1.3]];
const pref={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:+v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let fi=pref.get("font",0),si=pref.get("ukuran",1);if(!FONTS[fi])fi=0;if(!SIZES[si])si=1;
const applyType=()=>{const r=document.documentElement.style;r.setProperty("--ff",FONTS[fi][1]);r.setProperty("--s",SIZES[si][1])};applyType();
function pengaturan(){
 app.innerHTML=`<div class="sec">Jenis huruf</div><div class="opts">${FONTS.map((f,i)=>`<button class="opt${i===fi?" on":""}" data-f="${i}" style="font-family:${esc(f[1])}">${f[0]}</button>`).join("")}</div>
 <div class="sec">Ukuran huruf</div><div class="opts">${SIZES.map((s,i)=>`<button class="opt${i===si?" on":""}" data-z="${i}">${s[0]}</button>`).join("")}</div>
 <div class="card"><h3>Pratinjau</h3><h4>Alur</h4><div style="line-height:1.55">Rangkaian peristiwa dalam karya sastra yang tersusun secara sebab-akibat dan membentuk kesatuan cerita yang utuh.</div></div>`;
 app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{fi=+b.dataset.f;pref.set("font",fi);applyType();pengaturan()});
 app.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{si=+b.dataset.z;pref.set("ukuran",si);applyType();pengaturan()});
}
function route(){
 dr(false);const h=(location.hash||"#/").split("/").slice(1),[a,b]=[h[0]||"",h[1]&&decodeURIComponent(h[1])];
 $("#ttl").textContent={"":"Kamus Sastra",cari:"Cari",abjad:"Abjad",rumpun:"Rumpun",kata:"Istilah",favorit:"Favorit",riwayat:"Riwayat",pengaturan:"Pengaturan",tentang:"Tentang"}[a]||"Kamus Sastra";
 ({"":home,cari:search,abjad:()=>b?huruf(b):abjad(),rumpun:()=>b?rump(b):rumpun(),kata:()=>kata(b),favorit:()=>koleksi("fav","Istilah favorit"),riwayat:()=>koleksi("riw","Terakhir dibuka"),pengaturan,tentang}[a]||home)();
 if(a!=="cari")scrollTo(0,0);
}
addEventListener("hashchange",route);route();
setTimeout(()=>{const s=$("#splash");if(s){s.style.opacity=0;setTimeout(()=>s.remove(),500)}},1300);
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
