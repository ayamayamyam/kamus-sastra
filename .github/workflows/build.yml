name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: build-apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk kamus-sastra.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kamus-sastra-apk
          path: kamus-sastra.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kamus Sastra build ${{ github.run_number }}
          files: kamus-sastra.apk
